:"Význam slov a frazémy","popis":"Synonyma, antonyma, homonyma, přenesený význam a ustálená spojení. Test je má rád.","vyklad":[{"h":"Synonyma","t":"Slova se stejným nebo velmi podobným významem.\n\nNejsou ale úplně zaměnitelná — liší se citovým zabarvením nebo tím, kde se hodí.","f":"dům – stavení – barák\nkrásný – hezký – nádherný"},{"h":"Antonyma","t":"Slova opačného významu. Často se tvoří předponou ne-, ale ne vždycky.","f":"velký × malý\nden × noc\nšťastný × nešťastný"},{"h":"Homonyma","t":"Slova, která zní i píší se stejně, ale znamenají něco úplně jiného.\n\nVýznam pozná jen z kontextu — z toho, jak je slovo použito ve větě.","f":"kolej (na koleji × studentská)\nlist (na stromě × papíru)\nvlna (na moři × ovčí)"},{"h":"Slova jednoznačná a mnohoznačná","t":"Jednoznačné slovo má jediný význam — obvykle odborné termíny.\n\nMnohoznačné má významů víc, které spolu ale souvisejí.","f":"kyslík (jednoznačné)\noko (na obličeji, na polévce, na síti)"},{"h":"Význam přímý a přenesený","t":"Přímý význam je ten původní a doslovný. Přenesený vznikl na základě podobnosti.\n\nPřenesené významy dávají jazyku barvu — a v testu se na ně ptají.","f":"zlaté hodinky (přímý)\nzlaté ruce (přenesený)"},{"h":"Metafora a metonymie","t":"Metafora přenáší význam podle podobnosti — hlava člověka a hlava státu.\n\nMetonymie podle věcné souvislosti — číst Čapka znamená číst jeho knihu.","f":"metafora: moře slz, kamenné srdce\nmetonymie: pije sklenici, čte Nerudu"},{"h":"Rčení a přísloví","t":"Rčení je ustálené obrazné spojení, které se ohýbá podle věty — chodit kolem horké kaše.\n\nPřísloví je celá věta s poučením — Kdo šetří, má za tři.","f":"rčení: mít máslo na hlavě\npřísloví: Bez práce nejsou koláče."},{"h":"Slova citově zabarvená","t":"Zdrobněliny vyjadřují náklonnost, zveličelá slova naopak.\n\nHanlivá slova vyjadřují odpor. Neutrální slovo je bez zabarvení.","f":"pes (neutrální)\npejsek (zdrobnělina)\npsisko (zveličelé)"}],"ulohy":[{"id":"cj-vyznam-a823d0dc","q":"Které slovo je synonymem ke slovu DŮM?","typ":"choice","kroky":[{"n":"Krok 1 — co znamená synonymum","d":"Slovo se stejným nebo velmi blízkým významem.","f":"stejný význam"},{"n":"Krok 2 — projdi možnosti","d":"Zahrada, ulice a střecha jsou jiné věci — s domem jen souvisejí. Stavení znamená totéž co dům.","f":"stavení ✓"}],"vys":"stavení","moz":["stavení","zahrada","ulice","střecha"],"spr":0},{"id":"cj-vyznam-2a4f9578","q":"Které slovo je antonymem ke slovu ŠIROKÝ?","typ":"choice","kroky":[{"n":"Krok 1 — hledáme opak","d":"Antonymum je slovo opačného významu.","f":"opak"},{"n":"Krok 2 — projdi možnosti","d":"Dlouhý a vysoký jsou jiné rozměry, ne opaky. Opakem širokého je úzký.","f":"úzký ✓"}],"vys":"úzký","moz":["úzký","dlouhý","vysoký","velký"],"spr":0},{"id":"cj-vyznam-ffcc5390","q":"Ve které dvojici jde o homonyma?","typ":"choice","kroky":[{"n":"Krok 1 — co jsou homonyma","d":"Stejně znějící slova s úplně odlišným významem.","f":"stejný zvuk, jiný význam"},{"n":"Krok 2 — projdi možnosti","d":"Dům a stavení jsou synonyma. Velký a malý antonyma. Pes a pejsek je zdrobnělina.","f":"kolej – kolej ✓"},{"n":"Krok 3 — proč právě kolej","d":"Železniční kolej a studentská kolej spolu nemají nic společného.","f":"homonyma"}],"vys":"kolej (na trati) – kolej (ubytovna)","moz":["kolej (na trati) – kolej (ubytovna)","dům – stavení","velký – malý","pes – pejsek"],"spr":0},{"id":"cj-vyznam-04e1d0b2","q":"V jakém významu je použito slovo ZLATÉ ve spojení ZLATÉ RUCE?","typ":"choice","kroky":[{"n":"Krok 1 — jsou ruce ze zlata?","d":"Nejsou. Nikdo nemá ruce z drahého kovu.","f":"ne doslova"},{"n":"Krok 2 — co to znamená","d":"Šikovné ruce, které všechno umí. Přeneseno podle hodnoty zlata.","f":"přenesený význam ✓"},{"n":"Pro srovnání","d":"Zlaté hodinky jsou opravdu ze zlata — tam je význam přímý.","f":"přenesený"}],"vys":"V přeneseném","moz":["přeneseném","přímém","zdrobnělém","hanlivém"],"spr":0},{"id":"cj-vyznam-90f1de7d","q":"Co znamená rčení MÍT MÁSLO NA HLAVĚ?","typ":"choice","kroky":[{"n":"Krok 1 — je to obrazné spojení","d":"Nemyslí se doslova, je to rčení.","f":"rčení"},{"n":"Krok 2 — co znamená","d":"Provinit se něčím a raději o tom nemluvit. Kdo má máslo na hlavě, nemá chodit na slunce.","f":"mít něco na svědomí ✓"}],"vys":"Mít něco na svědomí","moz":["Mít něco na svědomí","Být zamaštěný","Být hloupý","Mít hlad"],"spr":0},{"id":"cj-vyznam-90c25ead","q":"Co znamená přísloví KDO ŠETŘÍ, MÁ ZA TŘI?","typ":"choice","kroky":[{"n":"Krok 1 — je to přísloví","d":"Celá věta s poučením do života.","f":"přísloví"},{"n":"Krok 2 — jeho smysl","d":"Kdo neutrácí zbytečně, ten si nastřádá výrazně víc než ten, kdo peníze rozhází.","f":"šetrnost se vyplácí ✓"}],"vys":"Kdo hospodárně nakládá s penězi, ušetří si na víc","moz":["Kdo hospodárně nakládá s penězi, ušetří si na víc","Kdo má tři děti, musí šetřit","Šetrnost je zbytečná","Kdo pracuje, má víc"],"spr":0},{"id":"cj-vyznam-edd9ed53","q":"Které slovo je zdrobnělina?","typ":"choice","kroky":[{"n":"Krok 1 — co je zdrobnělina","d":"Slovo vyjadřující něco menšího nebo milejšího, obvykle příponou -ek, -eček, -ka.","f":"zmenšení, náklonnost"},{"n":"Krok 2 — projdi možnosti","d":"Domov je místo, kde bydlíme. Domácí je přídavné jméno. Domovník je člověk.","f":"domeček ✓"}],"vys":"domeček","moz":["domeček","domov","domácí","domovník"],"spr":0},{"id":"cj-vyznam-6da4c322","q":"Jaký je vztah mezi slovy ZAČÁTEK a KONEC?","typ":"choice","kroky":[{"n":"Krok 1 — porovnej významy","d":"Začátek je první bod, konec poslední. Jsou to protiklady.","f":"opačný význam"},{"n":"Krok 2 — takový vztah se jmenuje","d":"","f":"antonyma ✓"}],"vys":"Antonyma","moz":["antonyma","synonyma","homonyma","zdrobněliny"],"spr":0},{"id":"cj-vyznam-6ac66462","q":"Ve větě „Přečetl jsem celého Čapka“ jde o:","typ":"choice","kroky":[{"n":"Krok 1 — co se přečetlo doslova","d":"Nepřečetl člověka, ale jeho knihy.","f":"autor místo díla"},{"n":"Krok 2 — podobnost, nebo souvislost?","d":"Autor a jeho dílo spolu věcně souvisejí, není to podobnost tvaru. To je metonymie.","f":"metonymie ✓"},{"n":"Pro srovnání","d":"Metafora by byla „moře slz“ — tam jde o podobnost množství.","f":"metonymie"}],"vys":"O metonymii","moz":["metonymii — místo díla je uveden autor","metaforu","zdrobnělinu","homonymum"],"spr":0},{"id":"cj-vyznam-72af9f53","q":"Které slovo je mnohoznačné?","typ":"choice","kroky":[{"n":"Krok 1 — hledej slovo s více významy","d":"Oko na obličeji, oko na polévce, oko v síti, oko na punčoše.","f":"oko má mnoho významů"},{"n":"Krok 2 — a ostatní","d":"Kyslík, vodík i trojúhelník jsou odborné termíny s jediným přesným významem.","f":"oko ✓"}],"vys":"oko","moz":["oko","kyslík","trojúhelník","vodík"],"spr":0}]},{"id":"cj-text","predmet":"CJ","tema":"porozumeni-textu","nazev":"Práce s textem","popis":"Čtenářská gramotnost — hlavní myšlenka, informace v textu, styl a záměr autora. Největší část testu.","vyklad":[{"h":"Proč je tenhle okruh nejdůležitější","t":"Test z češtiny ověřuje hlavně čtenářskou gramotnost. Otázek k výchozím textům bývá víc než na pravopis.\n\nDobrá zpráva: odpověď je skoro vždycky přímo v textu. Nemusíš nic vědět předem.","f":"odpověď hledej V TEXTU"},{"h":"Nejdřív si přečti otázku","t":"Než začneš číst dlouhý text, projdi si otázky. Budeš vědět, co v textu hledat, a nebudeš ho číst nadarmo dvakrát.","f":"1. otázky\n2. text\n3. odpovědi"},{"h":"Hlavní myšlenka","t":"Ptej se: o čem to celé je? Co by zůstalo, kdybych to měla shrnout jednou větou?\n\nHlavní myšlenka bývá v úvodu nebo v závěru odstavce. Detaily a příklady hlavní myšlenkou nejsou.","f":"O čem to je jako celek?"},{"h":"Rozliš fakt od názoru","t":"Fakt se dá ověřit — je to tvrzení o skutečnosti.\n\nNázor vyjadřuje postoj a poznáš ho podle slov jako myslím, podle mě, nejlepší, krásný.","f":"fakt: Praha má 1,3 milionu obyvatel.\nnázor: Praha je nejkrásnější město."},{"h":"Co text NEŘÍKÁ","t":"Častá otázka zní, které tvrzení z textu nevyplývá. Pozor na možnosti, které znějí rozumně a pravdivě — ale v textu nejsou.\n\nRozhoduje jen text, ne to, co víš odjinud.","f":"Je to v textu? Ne? → nevyplývá."},{"h":"Funkční styly","t":"Prostěsdělovací — běžná komunikace, dopis, vzkaz.\nOdborný — učebnice, encyklopedie, přesné termíny.\nPublicistický — noviny, zpravodajství.\nUmělecký — próza a poezie, obrazná vyjádření.\nAdministrativní — úřední dopisy, formuláře.","f":"prostěsdělovací, odborný,\npublicistický, umělecký,\nadministrativní"},{"h":"Jak styl poznat","t":"Podívej se na slovní zásobu a účel. Odborný text má termíny a poučuje. Umělecký má obrazná vyjádření a působí na city. Publicistický informuje o aktuálním dění.","f":"termíny → odborný\nobrazy a city → umělecký\naktuality → publicistický"},{"h":"Slohové postupy","t":"Vyprávěcí — děj v čase, co se stalo.\nPopisný — jak něco vypadá.\nVýkladový — jak něco funguje a proč.\nÚvahový — přemýšlení nad problémem.","f":"vyprávěcí, popisný,\nvýkladový, úvahový"}],"ulohy":[{"id":"cj-text-dee2a197","q":"VÝCHOZÍ TEXT\n\nJežek západní je noční savec. Přes den spí ve svém úkrytu a ven vychází až po setmění. Živí se hlavně hmyzem, plži a žížalami. Na zimu upadá do pravého zimního spánku, který trvá od listopadu do března.\n\nCo je hlavním obsahem textu?","typ":"choice","kroky":[{"n":"Krok 1 — projdi text po větách","d":"Kdy je aktivní, čím se živí, jak přezimuje.","f":"aktivita, potrava, zimní spánek"},{"n":"Krok 2 — co mají společné","d":"Všechno popisuje, jak ježek žije.","f":"způsob života ✓"},{"n":"Krok 3 — vyluč ostatní","d":"O ochraně, porovnávání ani o žádném zážitku text nemluví.","f":"informace o způsobu života"}],"vys":"Základní informace o způsobu života ježka","moz":["Základní informace o způsobu života ježka","Ochrana ježků v zahradách","Porovnání ježka s jinými savci","Vyprávění o setkání s ježkem"],"spr":0},{"id":"cj-text-62dc111c","q":"VÝCHOZÍ TEXT (viz předchozí úloha o ježkovi)\n\nKteré tvrzení z textu NEVYPLÝVÁ?","typ":"choice","kroky":[{"n":"Krok 1 — ověř každou možnost v textu","d":"Noční aktivita — v textu je. Hmyz — v textu je. Listopad až březen je pět měsíců — vyplývá.","f":"tři možnosti v textu jsou"},{"n":"Krok 2 — zbývá ochrana","d":"O tom, že je ježek chráněný, text neříká ani slovo.","f":"nevyplývá ✓"},{"n":"Pozor na past","d":"To tvrzení je pravdivé — ježek chráněný opravdu je. Ale otázka se ptá na text, ne na skutečnost.","f":"rozhoduje jen text"}],"vys":"Ježek je v Česku chráněný živočich","moz":["Ježek je v Česku chráněný živočich","Ježek je aktivní v noci","Ježek se živí hmyzem","Zimní spánek ježka trvá zhruba pět měsíců"],"spr":0},{"id":"cj-text-1efb59a4","q":"Které z tvrzení je NÁZOR, nikoli fakt?","typ":"choice","kroky":[{"n":"Krok 1 — dá se to ověřit?","d":"Délku zimy, teploty i datum slunovratu lze ověřit měřením.","f":"ověřitelné = fakta"},{"n":"Krok 2 — a co nejhezčí?","d":"Slovo nejhezčí vyjadřuje osobní postoj. Někdo má radši léto.","f":"názor ✓"},{"n":"Pomůcka","d":"Hodnotící slova jako nejlepší, krásný, nudný obvykle prozradí názor.","f":"Zima je nejhezčí roční období."}],"vys":"Zima je nejhezčí roční období.","moz":["Zima je nejhezčí roční období.","Zima trvá tři měsíce.","V zimě klesají teploty pod nulu.","Nejkratší den v roce připadá na prosinec."],"spr":0},{"id":"cj-text-ccf8ab66","q":"Do kterého funkčního stylu patří tento text?\n\n„Vážená paní ředitelko, žádám Vás o uvolnění své dcery z výuky dne 15. května z rodinných důvodů.“","typ":"choice","kroky":[{"n":"Krok 1 — k čemu text slouží","d":"Je to úřední žádost adresovaná instituci.","f":"úřední účel"},{"n":"Krok 2 — jak je napsaný","d":"Ustálené obraty, vykání s velkým V, věcnost, žádné city ani obrazy.","f":"formální jazyk"},{"n":"Krok 3 — to je styl administrativní","d":"Patří sem žádosti, přihlášky, formuláře, potvrzení.","f":"administrativní ✓"}],"vys":"Administrativní styl","moz":["administrativní","umělecký","publicistický","prostěsdělovací"],"spr":0},{"id":"cj-text-e330d7cb","q":"Do kterého funkčního stylu patří text?\n\n„Slunce zapadalo za obzor a proměnilo oblohu v moře rudého plamene. Ticho večera dolehlo na kraj jako těžká přikrývka.“","typ":"choice","kroky":[{"n":"Krok 1 — všimni si vyjadřování","d":"Moře rudého plamene, ticho jako těžká přikrývka — to jsou obrazná pojmenování.","f":"metafory a přirovnání"},{"n":"Krok 2 — jaký má text účel","d":"Nechce poučit ani informovat, chce působit na city a vytvořit náladu.","f":"působí na city"},{"n":"Krok 3 — to je styl umělecký","d":"","f":"umělecký ✓"}],"vys":"Umělecký styl","moz":["umělecký","odborný","administrativní","publicistický"],"spr":0},{"id":"cj-text-ddcf4861","q":"Který slohový postup je v textu?\n\n„Nejprve smícháme mouku s cukrem. Poté přidáme vejce a vše důkladně promícháme. Nakonec vlijeme těsto do formy.“","typ":"choice","kroky":[{"n":"Krok 1 — co text dělá","d":"Popisuje po krocích, jak něco udělat.","f":"nejprve, poté, nakonec"},{"n":"Krok 2 — to je popis pracovního postupu","d":"Patří pod popisný slohový postup.","f":"popisný ✓"},{"n":"Proč ne vyprávěcí","d":"Vyprávění by mělo děj a postavy — něco by se přihodilo. Tady jde o návod.","f":"popisný (návod)"}],"vys":"Popisný (návod)","moz":["popisný (návod)","vyprávěcí","úvahový","výkladový"],"spr":0},{"id":"cj-text-6679b36f","q":"VÝCHOZÍ TEXT\n\nKnihovna bude od 1. do 14. července uzavřena z důvodu revize knižního fondu. Čtenáři si mohou knihy vypůjčit nejpozději 30. června. Vrácení knih se během uzavření nepočítá do výpůjční lhůty.\n\nDo kdy si lze knihy vypůjčit?","typ":"choice","kroky":[{"n":"Krok 1 — najdi v textu tu větu","d":"„Čtenáři si mohou knihy vypůjčit nejpozději 30. června.“","f":"informace je přímo v textu"},{"n":"Krok 2 — přečti pozorně","d":"Nejpozději znamená poslední možný den.","f":"30. června ✓"},{"n":"Pozor na past","d":"1. července je den, kdy se ZAVÍRÁ, ne kdy se ještě půjčuje.","f":"do 30. června"}],"vys":"Do 30. června","moz":["Do 30. června","Do 1. července","Do 14. července","Kdykoli během uzavření"],"spr":0},{"id":"cj-text-e28953c9","q":"Který text je psán odborným stylem?","typ":"choice","kroky":[{"n":"Krok 1 — hledej odborné termíny","d":"Fotosyntéza, oxid uhličitý, glukóza.","f":"odborné termíny"},{"n":"Krok 2 — jaký má text účel","d":"Přesně a věcně poučit o jevu.","f":"poučuje ✓"},{"n":"Krok 3 — vyluč ostatní","d":"Druhý je prostěsdělovací, třetí administrativní, čtvrtý umělecký.","f":"odborný styl"}],"vys":"Text o fotosyntéze","moz":["Fotosyntéza je proces, při němž rostliny přeměňují oxid uhličitý a vodu na glukózu.","Ta naše zahrádka je letos nádherná!","Vážený pane, potvrzuji přijetí Vaší žádosti.","Zelené listy šeptaly ve větru tajemství léta."],"spr":0},{"id":"cj-text-6794f683","q":"Kolik funkčních stylů obvykle rozlišujeme?","typ":"open","kroky":[{"n":"Krok 1 — vyjmenuj je","d":"Prostěsdělovací, odborný, publicistický, umělecký, administrativní.","f":"5 stylů"},{"n":"Krok 2 — jak si je zapamatovat","d":"Podle toho, kde se s nimi setkáš: doma, ve škole, v novinách, v knize, na úřadě.","f":"5"}],"vys":"5","odp":"5"},{"id":"cj-text-1e5e2eef","q":"VÝCHOZÍ TEXT\n\nTomáš se rozhodl, že letos konečně zdolá Sněžku. Vstal ve čtyři ráno, sbalil batoh a vyrazil. Cesta byla dlouhá a nohy ho bolely, ale na vrcholu zapomněl na všechnu únavu.\n\nJaký slohový postup autor použil?","typ":"choice","kroky":[{"n":"Krok 1 — je tam děj?","d":"Ano — rozhodl se, vstal, sbalil, vyrazil, došel. Události jdou po sobě v čase.","f":"sled událostí"},{"n":"Krok 2 — je tam postava?","d":"Tomáš. Vyprávění má hrdinu a děj.","f":"vyprávěcí ✓"},{"n":"Proč ne popisný","d":"Popis by říkal, jak Sněžka vypadá, ne co se stalo.","f":"vyprávěcí postup"}],"vys":"Vyprávěcí","moz":["vyprávěcí","popisný","výkladový","úvahový"],"spr":0}]},{"id":"cj-literatura","predmet":"CJ","tema":"literatura","nazev":"Literární pojmy","popis":"Druhy a žánry, poezie a próza, verš a rým, postava a vypravěč. Menší, ale bodovaná část testu.","vyklad":[{"h":"Tři literární druhy","t":"Lyrika vyjadřuje pocity a nálady, nemá děj — typicky báseň.\n\nEpika vypráví příběh, má děj a postavy. Drama je určeno k předvedení na jevišti.","f":"lyrika — pocity\nepika — příběh\ndrama — divadlo"},{"h":"Poezie a próza","t":"Poezie je psaná ve verších, člení se do slok a často se rýmuje.\n\nPróza je psaná souvisle v odstavcích, běžnou řečí.","f":"poezie: verše, sloky, rytmus\npróza: odstavce, plynulý text"},{"h":"Verš, sloka a rým","t":"Verš je jeden řádek básně. Sloka je skupina veršů oddělená mezerou.\n\nRým je zvuková shoda na koncích veršů.","f":"verš = řádek\nsloka = skupina veršů\nrým = shoda konců"},{"h":"Druhy rýmu","t":"Podle toho, které verše se rýmují, rozlišujeme čtyři základní typy.","f":"sdružený  AABB\nstřídavý   ABAB\nobkročný   ABBA\npřerývaný  ABCB"},{"h":"Epické žánry","t":"Pohádka má nadpřirozené prvky a dobrý konec. Pověst se váže ke skutečnému místu či osobě.\n\nBajka má zvířecí postavy a poučení. Román je rozsáhlé prozaické dílo s více dějovými liniemi.","f":"pohádka, pověst, bajka,\npovídka, novela, román"},{"h":"Vypravěč","t":"V ich-formě vypráví příběh sám hrdina — mluví v první osobě.\n\nV er-formě vypráví někdo zvenčí ve třetí osobě.","f":"ich-forma: Šel jsem lesem.\ner-forma: Šel lesem."},{"h":"Postavy a děj","t":"Hlavní postava je ta, kolem níž se příběh točí. Vedlejší ji doplňují.\n\nDěj má obvykle úvod, zápletku, vyvrcholení a rozuzlení.","f":"úvod → zápletka →\nvyvrcholení → rozuzlení"},{"h":"Básnické prostředky","t":"Metafora přenáší význam podle podobnosti, personifikace dává neživým věcem lidské vlastnosti.\n\nPřirovnání používá slovo jako. Zdrobnělina zmenšuje a zjemňuje.","f":"metafora: moře slz\npersonifikace: vítr si zpívá\npřirovnání: bílý jako sníh"}],"ulohy":[{"id":"cj-literatura-27586a4d","q":"Do kterého literárního druhu patří báseň bez děje, která vyjadřuje pocity?","typ":"choice","kroky":[{"n":"Krok 1 — má dílo děj?","d":"Nemá, jen vyjadřuje pocity a nálady.","f":"bez děje"},{"n":"Krok 2 — to je lyrika","d":"Epika by měla příběh, drama by se hrálo na jevišti.","f":"lyrika ✓"}],"vys":"Lyrika","moz":["lyrika","epika","drama","publicistika"],"spr":0},{"id":"cj-literatura-21260582","q":"Jak se nazývá jeden řádek básně?","typ":"choice","kroky":[{"n":"Krok 1 — základní jednotka básně","d":"Jeden řádek se nazývá verš.","f":"verš ✓"},{"n":"Krok 2 — pro srovnání","d":"Sloka (jinak strofa) je skupina veršů oddělená mezerou.","f":"verš = řádek"}],"vys":"Verš","moz":["verš","sloka","rým","strofa"],"spr":0},{"id":"cj-literatura-dcde9092","q":"Jaký je rýmový vzorec u rýmu sdruženého?","typ":"choice","kroky":[{"n":"Krok 1 — co znamená sdružený","d":"Rýmují se vždycky dva sousední verše.","f":"1. s 2., 3. se 4."},{"n":"Krok 2 — zapiš vzorcem","d":"","f":"AABB ✓"},{"n":"Ostatní typy","d":"ABAB je střídavý, ABBA obkročný, ABCB přerývaný.","f":"AABB"}],"vys":"AABB","moz":["AABB","ABAB","ABBA","ABCB"],"spr":0},{"id":"cj-literatura-91af4c96","q":"Který žánr má zvířecí postavy a končí poučením?","typ":"choice","kroky":[{"n":"Krok 1 — zvířata jednající jako lidé","d":"To je typický znak bajky.","f":"zvířecí postavy"},{"n":"Krok 2 — poučení na konci","d":"Bajka vždycky míří k mravnímu ponaučení. Psal je Ezop nebo La Fontaine.","f":"bajka ✓"},{"n":"Pro srovnání","d":"Pohádka má kouzla a dobrý konec, pověst se váže ke skutečnému místu.","f":"bajka"}],"vys":"Bajka","moz":["bajka","pohádka","pověst","román"],"spr":0},{"id":"cj-literatura-98372136","q":"V jaké formě je napsán text?\n\n„Vstal jsem časně ráno a vydal se k řece.“","typ":"choice","kroky":[{"n":"Krok 1 — v jaké osobě se mluví","d":"Vstal jsem, vydal jsem se — první osoba.","f":"1. osoba"},{"n":"Krok 2 — to je ich-forma","d":"Vypravěč je zároveň postavou příběhu.","f":"ich-forma ✓"},{"n":"Pro srovnání","d":"Er-forma by zněla: Vstal časně ráno a vydal se k řece.","f":"ich-forma"}],"vys":"Ich-forma","moz":["ich-forma","er-forma","dialog","monolog"],"spr":0},{"id":"cj-literatura-fe4609db","q":"Jak se nazývá básnický prostředek ve spojení VÍTR SI ZPÍVÁ?","typ":"choice","kroky":[{"n":"Krok 1 — co se ve spojení děje","d":"Vítr je neživý, ale zpívá — což umí jen člověk.","f":"neživé jedná jako člověk"},{"n":"Krok 2 — to je personifikace","d":"Jinak také zosobnění.","f":"personifikace ✓"}],"vys":"Personifikace","moz":["personifikace","přirovnání","zdrobnělina","nadsázka"],"spr":0},{"id":"cj-literatura-887cef83","q":"Jak se nazývá prostředek ve spojení BÍLÝ JAKO SNÍH?","typ":"choice","kroky":[{"n":"Krok 1 — najdi spojku jako","d":"Slůvko jako je jasným znakem přirovnání.","f":"jako → přirovnání"},{"n":"Krok 2 — rozdíl proti metafoře","d":"Metafora by řekla rovnou „sněhová pleť“ — bez slova jako.","f":"přirovnání ✓"}],"vys":"Přirovnání","moz":["přirovnání","metafora","personifikace","nadsázka"],"spr":0},{"id":"cj-literatura-a183d605","q":"Který literární druh je určen k předvedení na jevišti?","typ":"choice","kroky":[{"n":"Krok 1 — co se hraje","d":"Divadelní hra, tedy drama.","f":"drama ✓"},{"n":"Krok 2 — jak drama poznáš","d":"Je psané jako dialogy postav a obsahuje scénické poznámky.","f":"dialogy + poznámky"}],"vys":"Drama","moz":["drama","lyrika","epika","esej"],"spr":0},{"id":"cj-literatura-c0dd2603","q":"Jak se nazývá skupina veršů oddělená v básni mezerou?","typ":"choice","kroky":[{"n":"Krok 1 — verš je řádek","d":"Verš je jeden řádek, ne skupina.","f":"verš = řádek"},{"n":"Krok 2 — skupina veršů","d":"Nazývá se sloka, cizím slovem strofa.","f":"sloka ✓"}],"vys":"Sloka (strofa)","moz":["sloka","verš","rým","rytmus"],"spr":0},{"id":"cj-literatura-169c9a58","q":"Který žánr se váže ke skutečnému místu nebo historické osobě a bývá v něm zrnko pravdy?","typ":"choice","kroky":[{"n":"Krok 1 — vazba na skutečnost","d":"Pověst se vypráví o konkrétním místě, hradu nebo osobě.","f":"reálný základ"},{"n":"Krok 2 — pro srovnání","d":"Pohádka je zcela vymyšlená a nikde se neodehrává konkrétně.","f":"pověst ✓"},{"n":"Příklady","d":"Staré pověsti české — o Libuši, o Bivojovi, o Golemovi.","f":"pověst"}],"vys":"Pověst","moz":["pověst","pohádka","bajka","novela"],"spr":0}]}],"hlasky":{"spravne":["Jo… přesně tak.","Správně. To bylo rychlé.","Máš to dobře. Hezky.","Tak tohle ti jde líp než mně.","Sedí to. Můžeme dál?"],"spatne":["To nevadí, to se stává. Koukni na správnou odpověď.","Těsně vedle. Tohle plete skoro každého, mě taky.","Nic se neděje. Podívej, jak to mělo být."],"vyzva_ok":["Dobře! A… můžu ti ukázat, jak to jde ještě rychleji?"],"vyzva_ko":["To nevadí. Přesně na tohle ten trik je. Můžu ti ho ukázat?"],"umim":["Tak tenhle trik už umíš. Dobrá práce.","Všechno správně. To je… fakt dobré."],"neumim":["Skoro. Zkus si to pustit ještě jednou, určitě to dáš."],"zapnuto":["Ehm… ahoj. Tak já ti k tomu budu něco říkat, jestli ti to nevadí."],"procv_spatne":["Hele, to ještě není ono. Zkus to znova, nebo si vezmi nápovědu.","Těsně vedle. V pohodě, nápověda ti ukáže další krok."],"okruh_hotovy":["Ty jo, celý okruh máš za sebou. To je… fakt hustý."],"dochazka_hotovo":["Zapsáno. Dneska máš splněno, tak si dej pauzu.","Hotovo, dnešek je zapsaný. Fakt dobrá práce."],"den_priprava":["Čau. Tenhle týden se ještě neučíme, jenom si všechno nachystáme. Dole máš seznam, co stihnout do neděle. Ber to v klidu, jedno po druhým, a odškrtávej."],"den_M":["Čau. Dneska je na řadě matika. Mrkni na téma týdne, pusť si k němu video, a pak si to zkus sama v procvičování. To dáš.","Čau, tak dneska matika. Jedno téma, jedno video, pár úloh. A kdyby ses zasekla, v pohodě, vezmi si nápovědu. Od toho tam je.","Čau. Dneska matika. Jedno téma, žádný stres, a večer máš chill. Jdeme na to."],"den_CJ":["Čau. Dneska je na řadě čeština. Mrkni na téma týdne, pusť si k němu video, a pak si to zkus v procvičování. Já počkám.","Čau, dneska čeština. Jedno téma, jedno video, pár úloh. Víc toho dneska není, fakt.","Čau. Dneska čeština. Vím, že to není žádná zábava, ale každé téma jsou body navíc. Dáme to."],"den_slabsi":["Čau. Dneska je den na předmět, co potřebuje víc péče. Vezmi si téma týdne, a na konci si zopakuj něco staršího.","Čau. Dneska ještě jedno téma a trochu opakování. A pak máš dva dny volno. To si zasloužíš."],"den_rozbor":["Čau. Dneska se mrkneme na včerejší test. Projdi si úlohy, kde utekly bod function slucData(zdroj) {

  for (const k of KOLEKCE) {

    if (Array.isArray(z)) z = Object.fromEntries(z.filter(r => r && r.id).map(r => [String(r.id), r])); // soubor od Clauda smí mít pole
    for (const id of Object.keys(z)) {

      const mistni = Object.prototype.hasOwnProperty.call(nova[k], id) ? nova[k][id] : null;

      htmlTemaKarta(slabsiPredmet() === 'M' ? 'M' : 'CJ', t, 'Téma týdne') + htmlBloky(d, p);
  } else if (p.typ === 'priprava') {
    const st = VIDEA ? VIDEA.strategie : [];
    h += pripravaHotova() && !ukazPripravu
      ? `<section class="karta siroka"><h2>Příprava je hotová ✓</h2>
          <p style="margin:0">Všechno máš připravené. Do neděle si můžeš zkoušet <a href="#tipy">triky</a> nebo <a href="#procvicovani">procvičování</a>.</p>
          <div class="btn-rada"><button class="btn" data-akce="ukaz-pripravu">Zobrazit seznam znovu</button></div></section>`
      : `<section class="karta siroka"><h2>Přípravný týden: co udělat do neděle</h2>
          <span class="stitek akcent">21.–24. 9.</span>
          ${htmlUkolyPripravy()}</section>`;
    h += htmlBloky(d, p);
  } else if (p.typ === 'zkouska') {
    h += `<section class="karta siroka volno-karta"><div class="velke">Dnes je zkouška</div><p>Matematika 70 minut, čeština 60 minut. Všechno, co jsi natrénovala, umíš. Hodně štěstí!</p></section>`;
  } else if (p.typ === 'po') {
    h += `<section class="karta siroka volno-karta"><div class="velke">Máš to za sebou</div><p class="maly">Řádné termíny proběhly 12. a 13. 4. 2027.</p></section>`;
  } else {
    h += `<section class="karta siroka"><h2>Příprava ještě nezačala</h2><p>Začíná se 21. 9. 2026.</p></section>`;
  }
  if (['rozbor', 'M', 'CJ', 'slabsi'].includes(p.typ)) h += htmlRozcvicka(d, p);
  h += htmlTipDne(d, p);
  if (['rozbor', 'M', 'CJ', 'slabsi', 'priprava'].includes(p.typ)) h += htmlPristiTest(d);
  return h + '</div>';
}

/* ---------- obrazovka Plán ---------- */
function renderPlan() {
  const d = dnes(), akt = tydenProDatum(d), s = iso(d);
  let h = '<div class="plan-seznam">', faze = null;
  for (const t of vsechnyTydny()) {

    const stavTydne = t.od > s ? '' : !minuly ? (zapsano ? `<span class="stitek">zapsáno ${zapsano} z ${planDnu}</span>` : '')
      : zapsano >= planDnu ? '<span class="stitek ok">splněno</span>' : zapsano ? `<span class="stitek pozor">částečně ${zapsano} z ${planDnu}</span>` : '<span class="stitek">vynecháno</span>';
    h += `<details class="karta tyden${jeAkt ? ' aktualni' : ''}${minuly ? ' minuly' : ''}"${jeAkt ? ' open id="aktualni-tyden"' : ''}>
      <summary>
        <div class="cislo">Týden ${t.tyden}<small>${datumKratke(parseISO(t.od))}–${datumKratke(parseISO(t.do))}</small></div>
        <div class="temata"><div><span class="stitek m">M</span>${esc(t.M)}</div><div><span class="stitek cj">ČJ</span>${esc(t.CJ)}</div></div>
        <div class="vpravo">${jeAkt ? '<span class="stitek akcent">tento týden</span>' : ''}
          <span class="stitek" title="Nedělní test ${datumKratke(nd)}">Ne ${datumKratke(nd)} · ${n && n.test ? esc(n.test) : 'bez testu'}</span>
          ${kb ? '<span class="stitek pozor">kontrolní bod</span>' : ''}${stavTydne}</div>
      </summary>
      <div class="telo">
        ${t.tyden === 0 ? '<h3>Co udělat tento týden</h3>' + htmlUkolyPripravy() : `<h3><span class="stitek m">M</span> Videa – matematika</h3>${htmlVidea(vm)}
        <h3><span class="stitek cj">ČJ</span> Videa – čeština</h3>${htmlVidea(vc)}`}
        <h3>Nedělní test ${datumKratke(nd)}: ${n && n.test ? esc(nazevTestu(n.test)) : 'bez testu'}</h3>
        ${n && n.poznamka ? `<p class="maly">${esc(n.poznamka)}</p>` : ''}
        ${htmlJakNaTest(n)}
        ${!(n && n.test) ? '' : n.datum < s ? htmlRozboryTestu(n.test) : '<p class="maly">Videorozbor se tu ukáže až po napsání testu.</p>'}
      </div></details>`;
  }
  h += '</div>';
  if (VIDEA && VIDEA.zdroje.length) {
    h += `<section class="karta" style="margin-top:18px"><h2>Hlavní zdroje videí a procvičování</h2>
      <ul class="zdroje">${VIDEA.zdroje.map(z => `<li><a href="${esc(z.url)}" target="_blank" rel="noopener">${esc(z.nazev)} ↗</a></li>`).join('')}
      <li><a href="${TAU_URL}" target="_blank" rel="noopener">TAU – procvičování od CERMATu ↗</a></li></ul></section>`;

/* ---------- Procvičování ---------- */
const OKRUHY = DATA ? (DATA.ulohy || []) : [];
const TIPY = DATA ? (DATA.tipy || []) : [];
const castiHashe = () => location.hash.replace('#', '').split('/');
let procvPredmet = null; // který předmět je v seznamu okruhů vidět
const procv = {}; // okruh.id -> rozpracovaný stav (jen do zavření stránky); výsledky prvních pokusů jdou do db.procvicovani
const zvladnuta = u => { const r = db.procvicovani[u.id]; return !!(r && !r.smazano && r.posledni === 'ok'); };
const zvladnutoVOkruhu = o => o.ulohy.filter(zvladnuta).length;
function stavOkruhu(o) {
  if (procv[o.id]) return procv[o.id];
  const prvni = o.ulohy.findIndex(u => !zvladnuta(u)); // pokračuje se první úlohou, která ještě není zvládnutá
  return procv[o.id] = { i: Math.max(prvni, 0), faze: 'ceka', odpoved: '', volba: null, kroku: 0, ok: 0, ko: 0, pocitano: false };
}
// Do statistiky jde první pokus u úlohy: ok / ko, kolikrát s nápovědou, poslední výsledek a den.
function zapisPokus(o, s, spravne) {
  const u = o.ulohy[s.i], r = db.procvicovani[u.id] && !db.procvicovani[u.id].smazano ? db.procvicovani[u.id] : { id: u.id, ok: 0, ko: 0, napoveda: 0 };
  zapis('procvicovani', Object.assign({}, r, { okruh: o.id, predmet: o.predmet, tema: o.tema, ok: r.ok + (spravne ? 1 : 0), ko: r.ko + (spravne ? 0 : 1),
    napoveda: r.napoveda + (s.kroku > 0 ? 1 : 0), posledni: spravne ? 'ok' : 'ko', kdy: iso(dnes()) }));
}

// Odpověď se dá napsat všelijak – sjednotíme zápis (x^2 i x², 0,5 i 1/2, s jednotkou i bez).
function norm(s) {
  let t = String(s).toLowerCase().trim();
  t = t.replace(/[−–—]/g, '-').replace(/[·×]/g, '*').replace(/²/g, '^2').replace(/³/g, '^3').replace(/√/g, 'odm');
  t = t.replace(/\s+/g, '').replace(/,/g, '.').replace(/^[xy]=/, '');
  t = t.replace(/(cm\^?[23]|m\^?[23]|dm\^?[23]|cm|mm|km|dm|kč|minut|min|hodin|litr[ůyu]?|stupňů|°|%)$/, '');
  return t.replace(/\*/g, '');
}
function cislo(t) {
  if (/^-?\d+(\.\d+)?$/.test(t)) return parseFloat(t);
  const m = t.match(/^(-?\d+(?:\.\d+)?)\/(\d+(?:\.\d+)?)$/);
  return m && parseFloat(m[2]) !== 0 ? parseFloat(m[1]) / parseFloat(m[2]) : null;
}
function stejne(a, b) {
  const na = norm(a), nb = norm(b);
  if (na === nb) return true;
  const ca = cislo(na), cb = cislo(nb);
  return ca !== null && cb !== null && Math.abs(ca - cb) < 1e-9;
}

// Zlomky: jen v matematice. Čitatel i jmenovatel musí být číslo, jednočlen (2x, y²) nebo závorka,
// takže "km/h", "i/y" ani "ano/ne" se nezmění. Pracuje nad už escapovaným textem.
const ZL_RE = /(?<![\p{L}\d,.^])(\[[znh]:)?(\([^()\/]*\)|\d+(?:,\d+)?[a-zA-Z]?[²³]?|[a-zA-Z][²³]?)(\])? ?\/ ?(\[[znh]:)?(\([^()\/]*\)|\d+(?:,\d+)?[a-zA-Z]?[²³]?|[a-zA-Z][²³]?)(\])?(?![\p{L}\d^(])/gu;
const ZL_JEDNOTKY = new Set(['m/s', 'l/s', 'l/h', 'g/l']);
const bezZavorky = a => a[0] === '(' ? a.slice(1, -1).trim() : a;
// Značky animace [h:zvýrazni] [n:nové] [z:škrtni] smí obalit čitatele, jmenovatele i celý zlomek.
function zlomky(html) {
  return html.replace(ZL_RE, (vse, m1, c, z1, m2, j, z2) => {
    if (ZL_JEDNOTKY.has(c + '/' + j)) return vse;
    const celek = m1 && !z1 && !m2 && z2;
    const cast = (text, znacka) => znacka ? `<span class="a-${znacka[1]}">${bezZavorky(text)}</span>` : bezZavorky(text);
    const zl = `<span class="zl" role="img" aria-label="${bezZavorky(c)} lomeno ${bezZavorky(j)}"><span>${cast(c, m1 && z1 ? m1 : null)}</span><span>${cast(j, m2 && z2 ? m2 : null)}</span></span>`;
    if (celek) return `<span class="a-${m1[1]}">${zl}</span>`;
    return (m1 && !z1 ? m1 : '') + zl + (z2 && !m2 ? z2 : '');
  })
    // závorka jen kolem jednoho zlomku je zbytečná: (3/4) : (9/8)
    .replace(/\((<span class="zl"[^>]*><span>[^<]*<\/span><span>[^<]*<\/span><\/span>)\)/g, '$1');
}
const znacky = html => html.replace(/\[([znh]):([^\[\]]*)\]/g, '<span class="a-$1">$2</span>');
const fm = (text, matematika) => matematika ? zlomky(esc(text)) : esc(text);

const stitekPredmetu = p => p === 'M' ? '<span class="stitek m">Matematika</span>' : '<span class="stitek cj">Čeština</span>';
function temataTydne() {
  const t = tydenProDatum(dnes());
  return t ? [t.M_tema, t.CJ_tema].filter(Boolean) : [];
}

function renderProcvicovani() {
  const [, idOkruhu, zalozka] = castiHashe();
  const o = OKRUHY.find(x => x.id === idOkruhu);
  if (!o) return htmlSeznamOkruhu();
  procvPredmet = o.predmet;
  const s = stavOkruhu(o), jeUlohy = zalozka === 'ulohy';
  return `<a class="zpet" href="#procvicovani">← Všechny okruhy</a>
    <section class="karta" style="margin-bottom:16px">
      <div class="skore">${stitekPredmetu(o.predmet)}<span class="stitek${zvladnutoVOkruhu(o) ? ' ok' : ''}">zvládnuto ${zvladnutoVOkruhu(o)} z ${o.ulohy.length}</span>${s.ok + s.ko ? `<span class="stitek">dnes správně ${s.ok}, špatně ${s.ko}</span>` : ''}</div>
      <h1 style="font-size:24px;margin:8px 0 4px">${esc(o.nazev)}</h1>
      <p class="maly" style="margin:0 0 12px">${esc(o.popis)}</p>
      <div class="filtry" style="margin:0">
        <a class="chip" href="#procvicovani/${o.id}/vyklad" aria-current="${!jeUlohy}">Výklad (${o.vyklad.length})</a>
        <a class="chip" href="#procvicovani/${o.id}/ulohy" aria-current="${jeUlohy}">Úlohy (${o.ulohy.length})</a>
      </div>
    </section>` + (jeUlohy ? htmlUloha(o, s) : htmlVyklad(o));
}

function htmlSeznamOkruhu() {
  const tyden = temataTydne();
  const sloupec = p => '<div class="okruhy">' +
    OKRUHY.filter(o => o.predmet === p).map(o => {
      const zv = zvladnutoVOkruhu(o);
      return `<a class="karta okruh" href="#procvicovani/${o.id}/vyklad">
        <span class="radek">${tyden.includes(o.tema) ? '<span class="stitek akcent">téma týdne</span>' : ''}
          <span class="stitek">${o.ulohy.length} úloh</span>${zv ? `<span class="stitek ok">${zv === o.ulohy.length ? 'vše zvládnuto ✓' : 'zvládnuto ' + zv}</span>` : ''}</span>
        <b>${esc(o.nazev)}</b><span class="maly">${esc(o.popis)}</span></a>`;
    }).join('') + '</div>';
  if (!OKRUHY.length) return '<section class="karta"><h2>Procvičování</h2><p>Zatím tu nejsou žádné úlohy.</p></section>';
  // vždy jen jeden předmět, ať se nemusí scrollovat; výchozí je předmět dne, jinak slabší předmět
  if (!procvPredmet) {
    const typ = programDne(dnes()).typ;
    procvPredmet = typ === 'M' || typ === 'CJ' ? typ : (slabsiPredmet() === 'M' ? 'M' : 'CJ');
  }
  const pocet = p => OKRUHY.filter(o => o.predmet === p).length;
  const chip = (p, text) => `<button type="button" class="chip" data-akce="procv-predmet" data-p="${p}" aria-pressed="${procvPredmet === p}">${text} (${pocet(p)})</button>`;
  return `<section class="karta" style="margin-bottom:12px;padding:12px 16px">
    <div style="display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center">
      <h2 style="margin:0 auto 0 0">Procvičování</h2>
      <div class="filtry" style="margin:0">${chip('CJ', 'Čeština')}${chip('M', 'Matematika')}</div>
    </div>
    <p class="maly" style="margin:6px 0 0">Nejdřív výklad, potom úlohy. <b>Nápověda</b> ukáže jen další krok, ne celé řešení.</p></section>` +
    sloupec(procvPredmet);
}

function htmlVyklad(o) {
  const tipy = TIPY.filter(t => t.tema === o.tema), mat = o.predmet === 'M';
  return '<div class="mrizka">' + o.vyklad.map((v, i) => `<section class="karta">
      <div class="maly">${i + 1} z ${o.vyklad.length}</div><h2>${fm(v.h, mat)}</h2>
      <div class="odstavce">${fm(v.t, mat)}</div>
      ${v.svg ? `<div class="tabule">${v.svg}</div>` : ''}${v.f ? `<div class="tabule">${fm(v.f, mat)}</div>` : ''}
    </section>`).join('') +
    (tipy.length ? `<section class="karta siroka"><h2>Tipy k tématu</h2>${tipy.map(htmlTip).join('<hr style="border:0;border-top:1px solid var(--linka);margin:14px 0">')}</section>` : '') +
    `<div class="siroka"><a class="btn hlavni" href="#procvicovani/${o.id}/ulohy">Jdu na úlohy →</a></div></div>`;
}

function htmlUloha(o, s) {
  if (s.i >= o.ulohy.length) {
    return `<section class="karta volno-karta"><div class="velke">Okruh hotový</div>
      <p>Dnes správně ${s.ok} z ${s.ok + s.ko} úloh na první pokus. V okruhu máš zvládnuto ${zvladnutoVOkruhu(o)} z ${o.ulohy.length}.</p>
      <div class="btn-rada" style="justify-content:center"><button class="btn hlavni" data-akce="procv-znovu">Projít znovu</button><a class="btn" href="#procvicovani">Jiný okruh</a></div></section>`;
  }
  const u = o.ulohy[s.i], konec = s.faze === 'spravne' || s.faze === 'reseni', mat = o.predmet === 'M';
  let odpoved;
  if (u.typ === 'choice') {
    odpoved = '<div class="moznosti">' + u.moz.map((m, i) => {
      const trida = konec && i === u.spr ? 'spravne' : (s.volba === i && i !== u.spr ? 'spatne' : '');
      return `<button type="button" data-akce="procv-volba" data-i="${i}" class="${trida}"${konec ? ' disabled' : ''}>${fm(m, mat)}</button>`;
    }).join('') + '</div>';
  } else {
    odpoved = `<input class="odp-vstup" id="odp-vstup" type="text" autocomplete="off" autocapitalize="off" spellcheck="false"
      placeholder="Tvoje odpověď" value="${esc(s.odpoved)}"${konec ? ' disabled' : ''}>` +
      (mat && !konec ? '<div class="maly" style="margin-top:6px">Zlomek napiš s lomítkem, třeba 5/6.</div>' : '');
  }
  let verdikt = '';
  if (s.faze === 'spravne') verdikt = `<div class="verdikt ok">Správně! <span class="maly">${fm(u.vys, mat)}</span></div>`;
  else if (s.faze === 'spatne') verdikt = '<div class="verdikt ko">Tohle to není. <span class="maly">Zkus to znovu, nebo si vezmi nápovědu.</span></div>';
  else if (s.faze === 'reseni') verdikt = `<div class="verdikt ko">Správná odpověď: <span class="maly">${fm(u.vys, mat)}</span></div>`;
  const kroku = konec && s.vse ? u.kroky.length : s.kroku;
  const kroky = u.kroky.slice(0, kroku).map(k => `<div class="krok"><b>${fm(k.n, mat)}</b>
      ${k.d ? `<div class="odstavce">${fm(k.d, mat)}</div>` : ''}${k.f ? `<div class="tabule">${fm(k.f, mat)}</div>` : ''}</div>`).join('');
  const tlacitka = konec
    ? `${kroku < u.kroky.length ? '<button class="btn" data-akce="procv-postup">Ukázat celý postup</button>' : ''}
       <button class="btn hlavni" data-akce="procv-dalsi">${s.i + 1 < o.ulohy.length ? 'Další úloha →' : 'Dokončit okruh'}</button>`
    : `${u.typ === 'open' ? '<button class="btn hlavni" data-akce="procv-kontrola" data-enter>Zkontrolovat</button>' : ''}
       ${s.kroku < u.kroky.length ? `<button class="btn" data-akce="procv-napoveda">Nápověda (${s.kroku + 1}. krok z ${u.kroky.length})</button>` : ''}
       <button class="btn" data-akce="procv-reseni">Ukázat řešení</button>`;
  return `<section class="karta">
    <div class="maly">Úloha ${s.i + 1} z ${o.ulohy.length}</div>
    <div class="zadani">${fm(u.q, mat)}</div>
    ${odpoved}${verdikt}${kroky}
    <div class="btn-rada">${tlacitka}</div>
  </section>`;
}

function aktualniOkruh() { return OKRUHY.find(x => x.id === castiHashe()[1]); }
function vyhodnot(o, s, spravne) {
  if (!s.pocitano) { s.pocitano = true; spravne ? s.ok++ : s.ko++; zapisPokus(o, s, spravne); } // počítá se jen první pokus
  s.faze = spravne ? 'spravne' : 'spatne';
  rekniKlip(nahodne(HLASKY[spravne ? 'spravne' : 'procv_spatne']));
}
const AKCE = {
  'procv-kontrola'() {
    const o = aktualniOkruh(), s = stavOkruhu(o), el = document.getElementById('odp-vstup');
    s.odpoved = el ? el.value : '';
    if (!s.odpoved.trim()) return;
    vyhodnot(o, s, stejne(s.odpoved, o.ulohy[s.i].odp));
  },
  'procv-volba'(b) { const o = aktualniOkruh(), s = stavOkruhu(o); s.volba = +b.dataset.i; vyhodnot(o, s, s.volba === o.ulohy[s.i].spr); },
  'procv-napoveda'() { const s = stavOkruhu(aktualniOkruh()), el = document.getElementById('odp-vstup'); if (el) s.odpoved = el.value; s.kroku++; s.pouzitaNapoveda = true; },
  'procv-reseni'() { const o = aktualniOkruh(), s = stavOkruhu(o); if (!s.pocitano) { s.pocitano = true; s.ko++; zapisPokus(o, s, false); } s.faze = 'reseni'; s.vse = true; },
  'procv-postup'() { stavOkruhu(aktualniOkruh()).vse = true; },
  'procv-dalsi'() {
    const o = aktualniOkruh(), s = stavOkruhu(o);
    Object.assign(s, { i: s.i + 1, faze: 'ceka', odpoved: '', volba: null, kroku: 0, pocitano: false, vse: false });
    if (s.i >= o.ulohy.length) rekniKlip(nahodne(HLASKY.okruh_hotovy)); else zmlkni();
  },
  'pruvodce-prehrat'() {
    if (!ui.zvuk) { ui.zvuk = true; ulozUi(); btnZvuk.setAttribute('aria-pressed', 'true'); }
    bylGesto = true; cekaNaGesto = null;
    ui.pozdrav = iso(dnes()); ulozUi();
    rekniKlip(textDne());
  },
  'procv-znovu'() { const o = aktualniOkruh(); delete procv[o.id]; stavOkruhu(o).i = 0; },

  { id: 'procvicovani', nazev: 'Procvičování', render: renderProcvicovani },
  { id: 'tipy', nazev: 'Tipy a triky', render: renderTipy },
  { id: 'testy', nazev: 'Testy', render: renderTesty },
  { id: 'progres', nazev: 'Progres', render: renderProgres },
  { id: 'chyby', nazev: 'Deník chyb', render: renderChyby },
  { id: 'nastaveni', nazev: 'Nastavení', render: renderNastaveni, rodic: true },
];
let role = 'dcera';

function render() {
  const viditelne = OBRAZOVKY.filter(o => !o.rodic || role === 'rodic');
  const id = castiHashe()[0];
  const akt = viditelne.find(o => o.id === id) || viditelne[0];
  document.getElementById('menu').innerHTML = viditelne.map(o =>
    `<a href="#${o.id}"${o.id === akt.id ? ' aria-current="page"' : ''}>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${IK[o.id]}</svg>${o.nazev}</a>`).join('');
  const obsah = document.getElementById('obsah');
  if (!DATA) {
    obsah.innerHTML = '<section class="karta"><h2>Chybí data plánu</h2><p>V souboru nejsou vložená data. Spusť <code>python app/build.py</code>.</p></section>';
  } else {
    try { obsah.innerHTML = htmlStavUloziste() + akt.render(); }
    catch (e) { obsah.innerHTML = `<section class="karta"><h2>Něco se pokazilo</h2><p class="maly">${esc(e && e.message)}</p></section>`; console.error(e); }
  }
  document.title = akt.nazev + ' · Přijímačky 2027';
  document.querySelectorAll('.prepinac button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.role === role)));
  document.getElementById('pata').textContent = `Přijímačky 2027 · v${APP_VERZE} · build ${DATA ? DATA.build : '–'}`;
  if (akt.id === 'plan') { const el = document.getElementById('aktualni-tyden'); if (el) el.scrollIntoView({ block: 'center' }); }
  else if (!zachovatPozici) window.scrollTo(0, 0);
  zachovatPozici = false;
  const misto = akt.id + '/' + (castiHashe()[1] || '');
  if (misto !== posledniMisto) { posledniMisto = misto; if (DATA) pruvodceVstup(akt.id); }
  const vstup = document.getElementById('odp-vstup');
  if (vstup && !vstup.disabled) vstup.focus();
}
let zachovatPozici = false;

// tlačítka uvnitř obrazovek: data-akce="…" -> AKCE[…], potom překreslit bez skoku nahoru
document.getElementById('obsah').addEventListener('click', e => {
  if (e.target.closest('[data-rodic]') && role !== 'rodic') { if (!prepniRoli('rodic')) { e.preventDefault(); return; } render(); } // odkaz do Nastavení přepne na rodiče (s PINem)
  const b = e.target.closest('[data-akce]');
  if (!b || !AKCE[b.dataset.akce]) return;
  extCti(); chCti();
  AKCE[b.dataset.akce](b);
  zachovatPozici = true;
  render();
});
document.getElementById('obsah').addEventListener('change', e => {
  const el = e.target.closest('[data-zmena]');
  if (!el || !AKCE[el.dataset.zmena]) return;
  AKCE[el.dataset.zmena](el);
  zachovatPozici = true;
  render();
});
document.getElementById('obsah').addEventListener('keydown', e => {
  if (e.key !== 'Enter' || e.target.id !== 'odp-vstup') return;
  const b = document.querySelector('#obsah [data-enter]');
  if (b) b.click();
});

document.querySelectorAll('.prepinac button').forEach(b => b.addEventListener('click', () => { if (prepniRoli(b.dataset.role)) render(); }));
document.getElementById('btn-vzhled').addEventListener('click', () => {
  ui.vzhled = document.documentElement.dataset.vzhled === 'tmavy' ? 'svetly' : 'tmavy';
  document.documentElement.dataset.vzhled = ui.vzhled;
  ulozUi();
});
const btnZvuk = document.getElementById('btn-zvuk');
btnZvuk.setAttribute('aria-pressed', String(!!ui.zvuk));
btnZvuk.addEventListener('click', () => {
  ui.zvuk = !ui.zvuk; ulozUi();
  btnZvuk.setAttribute('aria-pressed', String(ui.zvuk));
  if (ui.zvuk) { probudZvuk(); if (trik && trik.faze === 'trik' && castiHashe()[0] === 'tipy') mluvSnimek(); else rekni(nahodne(HLASKY.zapnuto)); }
  else { zastavPrehravani(); zmlkni(); uspiZvuk(); }
});
// výstup probudit hned při prvním kliknutí (prohlížeč to dřív nedovolí); průvodce přitom řekne větu, která čekala
document.addEventListener('pointerdown', probudZvuk, { passive: true });
document.addEventListener('click', prvniGesto, true);
document.addEventListener('keydown', prvniGesto, true);
document.addEventListener('visibilitychange', () => {
  if (!audioCtx) return;
  if (document.hidden) audioCtx.suspend(); else if (ui.zvuk) audioCtx.resume();
});
window.addEventListener('hashchange', () => { zastavPrehravani(); zmlkni(); });
window.addEventListener('hashchange', render);
render();
obnovSoubor();
</script>
</body>
</html>
