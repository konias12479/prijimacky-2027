<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Přijímačky 2027</title>
<script>
// vzhled nastavit hned, ať stránka neproblikne
(function () {
  var v = null;
  try { v = JSON.parse(localStorage.getItem('prijimacky2027-ui') || '{}').vzhled; } catch (e) {}
  if (v !== 'svetly' && v !== 'tmavy') {
    v = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'tmavy' : 'svetly';
  }
  document.documentElement.dataset.vzhled = v;
})();
</script>
<style>
:root {
  --bg: #f5f3ee; --karta: #ffffff; --karta2: #faf8f4; --text: #1c2230; --text2: #5d6577;
  --linka: #e4e0d6; --akcent: #4f46e5; --akcent-bg: #ecebfd; --akcent-text: #ffffff;
  --m: #1d6fd8; --m-bg: #e5f0fd; --cj: #c2410c; --cj-bg: #fdece2;
  --ok: #15803d; --ok-bg: #e3f5e8; --pozor: #b45309; --pozor-bg: #fdf1dc; --zle: #b91c1c; --zle-bg: #fde8e8;
  --stin: 0 1px 2px rgba(28,34,48,.06), 0 4px 14px rgba(28,34,48,.05);
  --r: 14px;
}
:root[data-vzhled="tmavy"] {
  --bg: #11141b; --karta: #1a1f2a; --karta2: #202635; --text: #e8eaf0; --text2: #9aa3b5;
  --linka: #2c3444; --akcent: #8b85ff; --akcent-bg: #262a4d; --akcent-text: #11141b;
  --m: #6db0ff; --m-bg: #17304f; --cj: #ff9a6b; --cj-bg: #4a2413;
  --ok: #5fd08a; --ok-bg: #143422; --pozor: #f2b659; --pozor-bg: #3d2c0f; --zle: #ff8a8a; --zle-bg: #451b1b;
  --stin: 0 1px 2px rgba(0,0,0,.3), 0 4px 14px rgba(0,0,0,.25);
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  padding-bottom: 40px;
}
a { color: var(--akcent); }
h1, h2, h3 { line-height: 1.25; margin: 0; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--akcent); outline-offset: 2px; border-radius: 6px; }

/* hlavička a navigace */
.hlava { position: sticky; top: 0; z-index: 20; background: var(--bg); border-bottom: 1px solid var(--linka); }
.hlava-in { max-width: 980px; margin: 0 auto; padding: 10px 16px; display: flex; align-items: center; gap: 12px; }
.logo { font-weight: 800; font-size: 18px; letter-spacing: -.01em; margin-right: auto; white-space: nowrap; }
.logo span { color: var(--akcent); }
.prepinac { display: inline-flex; background: var(--karta); border: 1px solid var(--linka); border-radius: 999px; padding: 3px; }
.prepinac button { border: 0; background: none; padding: 7px 14px; border-radius: 999px; font-size: 14px; font-weight: 600; color: var(--text2); min-height: 36px; }
.prepinac button[aria-pressed="true"] { background: var(--akcent); color: var(--akcent-text); }
.ikona-btn { border: 1px solid var(--linka); background: var(--karta); border-radius: 999px; width: 42px; height: 42px; display: grid; place-items: center; }
.ikona-btn svg { width: 20px; height: 20px; }
#btn-zvuk[aria-pressed="true"] { background: var(--akcent); border-color: var(--akcent); color: var(--akcent-text); }
#btn-zvuk[aria-pressed="true"] .skrt, #btn-zvuk[aria-pressed="false"] .vlny { display: none; }
nav.menu { max-width: 980px; margin: 0 auto; padding: 0 12px; display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; }
nav.menu::-webkit-scrollbar { display: none; }
nav.menu a {
  display: flex; align-items: center; gap: 8px; padding: 11px 14px; text-decoration: none; color: var(--text2);
  font-weight: 600; font-size: 15px; border-bottom: 3px solid transparent; white-space: nowrap;
}
nav.menu a svg { width: 20px; height: 20px; flex: none; }
nav.menu a[aria-current="page"] { color: var(--akcent); border-bottom-color: var(--akcent); }
nav.menu a:hover { color: var(--text); }

main { max-width: 980px; margin: 0 auto; padding: 20px 16px; }
.mrizka { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); align-items: start; }
.siroka { grid-column: 1 / -1; }
.karta { background: var(--karta); border: 1px solid var(--linka); border-radius: var(--r); box-shadow: var(--stin); padding: 18px; }
.karta h2 { font-size: 17px; margin-bottom: 10px; }
.karta h3 { font-size: 15px; margin: 14px 0 6px; }
.maly { font-size: 14px; color: var(--text2); }
.stitek { display: inline-block; font-size: 12.5px; font-weight: 700; padding: 3px 9px; border-radius: 999px; background: var(--karta2); border: 1px solid var(--linka); color: var(--text2); white-space: nowrap; }
.stitek.m { background: var(--m-bg); color: var(--m); border-color: transparent; }
.stitek.cj { background: var(--cj-bg); color: var(--cj); border-color: transparent; }
.stitek.akcent { background: var(--akcent-bg); color: var(--akcent); border-color: transparent; }
.stitek.pozor { background: var(--pozor-bg); color: var(--pozor); border-color: transparent; }
.stitek.ok { background: var(--ok-bg); color: var(--ok); border-color: transparent; }

/* Dnes */
.hrdina { display: flex; flex-wrap: wrap; gap: 18px 28px; align-items: center; }
.odpocet { font-size: 56px; font-weight: 800; line-height: 1; letter-spacing: -.03em; color: var(--akcent); }
.odpocet small { display: block; font-size: 15px; font-weight: 600; letter-spacing: 0; color: var(--text2); margin-top: 6px; }
.hrdina-text { flex: 1 1 260px; }
.hrdina-text h1 { font-size: 24px; }
.hrdina-text h1::first-letter { text-transform: uppercase; }
.pruh { height: 8px; border-radius: 99px; background: var(--karta2); border: 1px solid var(--linka); overflow: hidden; margin-top: 12px; }
.pruh i { display: block; height: 100%; background: var(--akcent); border-radius: 99px; }
.rytmus { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-top: 16px; }
.rytmus div { text-align: center; padding: 8px 2px; border-radius: 10px; background: var(--karta2); border: 1px solid var(--linka); font-size: 12.5px; color: var(--text2); }
.rytmus b { display: block; font-size: 14px; color: var(--text); }
.rytmus .dnes { background: var(--akcent); border-color: var(--akcent); color: var(--akcent-text); }
.rytmus .dnes b { color: var(--akcent-text); }
.rytmus .volno { opacity: .6; }
.tema { font-size: 20px; font-weight: 700; margin: 6px 0 4px; }
.videa { list-style: none; margin: 8px 0 0; padding: 0; display: grid; gap: 8px; }
.videa a {
  display: flex; align-items: center; gap: 12px; padding: 12px 14px; min-height: 52px; border-radius: 12px;
  background: var(--karta2); border: 1px solid var(--linka); text-decoration: none; color: var(--text); font-weight: 600;
}
.videa a:hover { border-color: var(--akcent); }
.videa .play { flex: none; width: 34px; height: 34px; border-radius: 50%; background: var(--akcent); color: var(--akcent-text); display: grid; place-items: center; }
.videa .play svg { width: 14px; height: 14px; margin-left: 2px; }
.videa .kde { margin-left: auto; font-size: 12.5px; font-weight: 600; color: var(--text2); white-space: nowrap; }
.bloky { list-style: none; margin: 0; padding: 0; counter-reset: blok; display: grid; gap: 10px; }
.bloky li { counter-increment: blok; display: grid; grid-template-columns: 34px 1fr auto; gap: 12px; align-items: start; }
.bloky li::before { content: counter(blok); width: 34px; height: 34px; border-radius: 10px; background: var(--akcent-bg); color: var(--akcent); font-weight: 800; display: grid; place-items: center; }
.bloky b { display: block; }
.bloky b .stitek { margin-left: 6px; font-weight: 600; }
.bloky li.bezi::before { background: var(--akcent); color: var(--akcent-text); }
.stopky { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
.stopky-cas { font-weight: 800; font-size: 17px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.stopky-cas.bezi { color: var(--akcent); }
.stopky-cas.konec { color: var(--zle); }
.btn.mala { min-height: 40px; padding: 7px 14px; font-size: 14.5px; white-space: nowrap; }
.stopky-celkem { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--linka); }
.stopky-celkem .btn { margin-left: auto; }
.doch-form { display: grid; gap: 12px; margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--linka); }
.doch-form label { display: grid; gap: 4px; font-weight: 600; font-size: 14.5px; }
.doch-form input { font: inherit; padding: 10px 12px; border-radius: 10px; border: 2px solid var(--linka); background: var(--karta2); color: var(--text); width: 100%; max-width: 460px; }
.doch-form input[type="number"] { max-width: 130px; }
.doch-form select, .arch-radek select { font: inherit; font-size: 14px; padding: 6px 8px; border-radius: 9px; border: 2px solid var(--linka); background: var(--karta2); color: var(--text); max-width: 100%; }
.doch-form select:focus, .arch-radek select:focus { outline: none; border-color: var(--akcent); }
.arch-radek select.chybi { border-color: var(--pozor); }
.doch-form .dvojice { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; max-width: 460px; }
.doch-form input:focus { outline: none; border-color: var(--akcent); }
.rytmus .splneno b::after { content: " ✓"; color: var(--ok); }
.rytmus .dnes.splneno b::after { color: inherit; }
.seznam { margin: 6px 0 0; padding-left: 20px; }
.seznam li { margin: 4px 0; }
.volno-karta { text-align: center; padding: 34px 18px; }
.volno-karta .velke { font-size: 30px; font-weight: 800; }
.simulace { background: var(--pozor-bg); color: var(--pozor); border-radius: 10px; padding: 8px 14px; font-size: 14px; font-weight: 600; margin-bottom: 14px; }

.ukoly { list-style: none; margin: 10px 0 0; padding: 0; display: grid; gap: 4px; }
.ukoly li { display: grid; grid-template-columns: 30px 1fr; gap: 10px; align-items: start; padding: 9px 10px; border-radius: 10px; }
.ukoly li:hover { background: var(--karta2); }
.ukoly input { width: 24px; height: 24px; margin: 1px 0 0; accent-color: var(--ok); cursor: pointer; }
.ukoly li.hotovo > div { color: var(--text2); text-decoration: line-through; text-decoration-color: var(--linka); }
.ukoly li.hotovo > div a { color: inherit; }
.kroky-navodu { margin: 10px 0 0; padding-left: 22px; display: grid; gap: 10px; }
.kroky-navodu li::marker { font-weight: 800; color: var(--akcent); }
details.navod { margin-top: 10px; border: 1px solid var(--linka); border-radius: 12px; background: var(--karta); }
details.navod > summary { cursor: pointer; padding: 11px 14px; font-weight: 700; color: var(--akcent); list-style: none; }
details.navod > summary::-webkit-details-marker { display: none; }
details.navod > summary::before { content: "▸ "; }
details.navod[open] > summary::before { content: "▾ "; }
details.navod .kroky-navodu { margin: 0; padding: 0 16px 14px 36px; }

/* Plán */
.tyden { padding: 0; overflow: hidden; }
.tyden > summary { list-style: none; cursor: pointer; padding: 14px 18px; display: grid; grid-template-columns: 74px 1fr auto; gap: 6px 14px; align-items: center; }
.tyden > summary::-webkit-details-marker { display: none; }
.tyden .cislo { font-weight: 800; font-size: 15px; }
.tyden .cislo small { display: block; font-weight: 500; font-size: 12.5px; color: var(--text2); }
.tyden .temata { display: grid; gap: 4px; font-size: 14.5px; min-width: 0; }
.tyden .temata span.stitek { margin-right: 6px; }
.tyden .vpravo { display: flex; flex-direction: column; gap: 4px; align-items: flex-end; }
.tyden.aktualni { border-color: var(--akcent); box-shadow: 0 0 0 2px var(--akcent), var(--stin); }
.tyden.minuly > summary { opacity: .62; }
.tyden .telo { border-top: 1px solid var(--linka); padding: 14px 18px 18px; background: var(--karta2); }
.tyden .telo h3:first-child { margin-top: 0; }
.plan-seznam { display: grid; gap: 10px; }
.faze-nadpis { margin: 18px 4px 2px; font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--text2); }
.zdroje { columns: 2 320px; margin: 0; padding-left: 20px; font-size: 14.5px; }
.zdroje li { margin: 0 0 6px; break-inside: avoid; }

/* tlačítka, filtry */
.btn { border: 1px solid var(--linka); background: var(--karta2); border-radius: 12px; padding: 11px 18px; min-height: 46px; font-weight: 700; text-decoration: none; color: var(--text); display: inline-flex; align-items: center; gap: 8px; }
.btn:hover { border-color: var(--akcent); }
.btn.hlavni { background: var(--akcent); border-color: var(--akcent); color: var(--akcent-text); }
.btn-rada { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 14px; }
.test-radek, .arch-radek { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 10px 0; border-top: 1px solid var(--linka); }
.test-radek:first-child, .arch-radek:first-child { border-top: 0; }
.test-radek .nazev { flex: 1 1 220px; }
.test-radek.aktualni .nazev { font-weight: 800; }
.arch-c { flex: 0 0 52px; font-weight: 800; }
.arch-radek .chip { min-width: 46px; justify-content: center; padding: 8px 10px; }
.arch-pod { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; flex: 1 1 100%; padding-left: 52px; }
.arch-pod .arch-c { flex-basis: 44px; font-weight: 600; color: var(--text2); }
.arch-ok { color: var(--ok); font-weight: 700; }
.arch-ko { color: var(--zle); font-weight: 700; }
.arch-soucet { font-size: 28px; font-weight: 800; }
.nan-uloha { padding: 16px 0; border-top: 1px solid var(--linka); }
.nan-uloha:first-of-type { border-top: 0; }
.moznosti button.vybrano { border-color: var(--akcent); background: var(--akcent-bg); color: var(--akcent); }
.nan-cas { position: sticky; top: 8px; z-index: 5; display: inline-block; padding: 6px 14px; border-radius: 999px; background: var(--akcent); color: var(--akcent-text); font-weight: 800; font-variant-numeric: tabular-nums; }
.nan-cas.konec { background: var(--zle); color: #fff; }
.filtry { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
.filtry .mezera { width: 12px; }
.chip { border: 1px solid var(--linka); background: var(--karta); border-radius: 999px; padding: 8px 15px; min-height: 40px; font-weight: 600; font-size: 14.5px; color: var(--text2); text-decoration: none; display: inline-flex; align-items: center; }
.chip[aria-pressed="true"], .chip[aria-current="true"] { background: var(--akcent); border-color: var(--akcent); color: var(--akcent-text); }

/* tabule – vzorce a obrázky převzaté z výkladu počítají s tmavým podkladem */
.tabule { background: #1f3a34; color: #f4f1e8; border-radius: 12px; padding: 14px 16px; margin-top: 10px; font: 600 16px/1.6 ui-monospace, Consolas, "Cascadia Mono", monospace; white-space: pre-wrap; overflow-x: auto; }
.tabule svg { display: block; width: 100%; max-width: 380px; height: auto; margin: 0 auto; }
.priklad { background: var(--karta2); border: 1px solid var(--linka); border-left: 4px solid var(--akcent); border-radius: 10px; padding: 10px 14px; margin-top: 10px; font-size: 15px; white-space: pre-wrap; }
.odstavce { white-space: pre-wrap; }

/* zlomky: v datech "3/4", na obrazovce čitatel nad jmenovatelem */
.zl { display: inline-flex; flex-direction: column; align-items: center; vertical-align: middle; text-align: center; line-height: 1.15; margin: 0 .15em; font-size: .95em; white-space: nowrap; }
.zl > span:first-child { padding: 0 .3em .06em; }
.zl > span:last-child { align-self: stretch; border-top: .1em solid currentColor; padding: .06em .3em 0; }
.zadani .zl { font-size: 1em; }

/* animovaná tabule u triků */
.deska { background: #1f3a34; color: #f4f1e8; border-radius: 14px; padding: 22px 20px; min-height: 170px; font: 600 21px/2 ui-monospace, Consolas, "Cascadia Mono", monospace; white-space: pre-wrap; overflow-x: auto; }
.deska .zl { font-size: 1em; }
.radek-desky.novy { animation: prijed .45s ease both; }
.a-h { background: rgba(255, 214, 102, .3); box-shadow: 0 0 0 4px rgba(255, 214, 102, .3); border-radius: 5px; animation: blik .9s ease 1; }
.a-n { display: inline-block; color: #8ff0b0; font-weight: 800; background: rgba(143, 240, 176, .16); border-radius: 5px; padding: 0 .18em; animation: vyskoc .55s cubic-bezier(.2, 1.7, .4, 1) both; }
.a-z { display: inline-block; position: relative; color: #ffa3a3; }
.a-z::after { content: ""; position: absolute; left: -3px; right: -3px; top: 52%; height: 3px; border-radius: 2px; background: #ff6b6b; transform-origin: left center; animation: skrt .45s ease both; }
.pozn-desky { margin-top: 12px; font-size: 17px; min-height: 3em; animation: prijed .45s ease both; }
.tecky { display: flex; gap: 6px; margin-top: 4px; }
.tecky i { width: 9px; height: 9px; border-radius: 50%; background: var(--linka); }
.tecky i.je { background: var(--akcent); }
@keyframes prijed { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
@keyframes vyskoc { from { opacity: 0; transform: scale(.3); } to { opacity: 1; transform: none; } }
@keyframes blik { 0% { box-shadow: 0 0 0 0 rgba(255, 214, 102, .9); } 100% { box-shadow: 0 0 0 4px rgba(255, 214, 102, .3); } }
@keyframes skrt { from { transform: scaleX(0); } to { transform: scaleX(1); } }
@media (prefers-reduced-motion: reduce) { .radek-desky.novy, .a-h, .a-n, .a-z::after, .pozn-desky { animation: none; } }

/* triky: dlaždice a fáze lekce */
.triky { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(215px, 1fr)); margin-bottom: 22px; }
.trik { display: flex; flex-direction: column; gap: 8px; text-decoration: none; color: var(--text); padding: 14px; }
.trik:hover { border-color: var(--akcent); }
.trik .play { width: 40px; height: 40px; border-radius: 50%; background: var(--akcent); color: var(--akcent-text); display: grid; place-items: center; flex: none; font-weight: 800; }
.trik .play svg { width: 15px; height: 15px; margin-left: 3px; }
.trik.umim .play { background: var(--ok); }
.trik b { font-size: 16px; line-height: 1.3; }
.trik .radek { display: flex; gap: 8px; align-items: center; justify-content: space-between; }
.faze { display: flex; gap: 6px; margin: 10px 0 0; flex-wrap: wrap; }
.faze span { font-size: 13px; font-weight: 700; padding: 5px 12px; border-radius: 999px; background: var(--karta2); border: 1px solid var(--linka); color: var(--text2); }
.faze span.ted { background: var(--akcent); border-color: var(--akcent); color: var(--akcent-text); }
.faze span.bylo { background: var(--ok-bg); border-color: transparent; color: var(--ok); }
details.tipy-skupina { padding: 0; margin-bottom: 10px; overflow: hidden; }
details.tipy-skupina > summary { cursor: pointer; padding: 14px 18px; font-weight: 700; font-size: 16px; list-style: none; display: flex; align-items: center; gap: 10px; }
details.tipy-skupina > summary::-webkit-details-marker, details.tip-radek > summary::-webkit-details-marker { display: none; }
details.tip-radek { border-top: 1px solid var(--linka); }
details.tip-radek > summary { cursor: pointer; padding: 12px 18px; list-style: none; display: flex; gap: 10px; align-items: center; font-weight: 600; }
details.tip-radek > summary::after, details.tipy-skupina > summary::after { content: "+"; margin-left: auto; color: var(--text2); font-weight: 700; font-size: 20px; }
details.tip-radek[open] > summary::after, details.tipy-skupina[open] > summary::after { content: "−"; }
details.tip-radek > div { padding: 0 18px 16px; }

/* Procvičování */
.okruhy { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(225px, 1fr)); }
.okruh { display: block; text-decoration: none; color: var(--text); padding: 12px 14px; }
.okruh .maly { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; font-size: 13px; line-height: 1.4; }
.okruh:hover { border-color: var(--akcent); }
.okruh b { display: block; font-size: 15.5px; line-height: 1.3; margin: 6px 0 3px; }
.okruh .radek { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.zpet { display: inline-block; margin-bottom: 12px; font-weight: 600; text-decoration: none; }
.zadani { font-size: 19px; font-weight: 600; white-space: pre-wrap; margin: 10px 0 16px; }
.odp-vstup { width: 100%; max-width: 360px; font: inherit; font-size: 19px; padding: 12px 14px; border-radius: 12px; border: 2px solid var(--linka); background: var(--karta2); color: var(--text); }
.odp-vstup:focus { outline: none; border-color: var(--akcent); }
.moznosti { display: grid; gap: 8px; }
.moznosti button { text-align: left; border: 2px solid var(--linka); background: var(--karta2); border-radius: 12px; padding: 12px 16px; min-height: 50px; font-weight: 600; }
.moznosti button:hover:not(:disabled) { border-color: var(--akcent); }
.moznosti button.spravne { border-color: var(--ok); background: var(--ok-bg); color: var(--ok); }

mobil. Našla ho, až když se vrátila o čtvrtinu vzdálenosti, kterou předtím ušla od parkoviště ke studánce. Pak pokračovala až k rozhledně.\n\nDélku celé trasy označíme x.\n\nÚloha 6.1\nVyjádřete výrazem s x délku trasy mezi studánkou a rozhlednou.","typ":"choice","b":1,"kroky":[{"n":"Krok 1 — co už ušla","d":"Od parkoviště ke studánce ušla tři pětiny celé trasy.","f":"parkoviště → studánka = 3/5 x"},{"n":"Krok 2 — co zbývá","d":"Odečti od celku.","f":"x − 3/5 x = 2/5 x"}],"vys":"2/5 x","moz":["2/5 x","3/5 x","1/4 x","3/20 x"],"spr":0},{"c":"13","q":"Úloha 6.2\n\nVyjádřete výrazem s x délku trasy mezi studánkou a místem, kde Eva našla mobil.","typ":"choice","b":1,"kroky":[{"n":"Krok 1 — o kolik se vrátila","d":"O čtvrtinu vzdálenosti, kterou ušla od parkoviště ke studánce.","f":"1/4 z 3/5 x"},{"n":"Krok 2 — vynásob zlomky","d":"","f":"1/4 · 3/5 = 3/20\n→ 3/20 x"}],"vys":"3/20 x","moz":["3/20 x","1/4 x","2/5 x","3/5 x"],"spr":0},{"c":"14","q":"Úloha 6.3\n\nVe chvíli, kdy našla mobil, zbývalo Evě k rozhledně ještě 22 km.\nVypočtěte, kolik km Eva celkem ušla, než se dostala od parkoviště k rozhledně.","typ":"open","b":2,"kroky":[{"n":"Krok 1 — kolik zbývá od místa nálezu","d":"Musí se vrátit zpět ke studánce (3/20 x) a odtud k rozhledně (2/5 x).","f":"3/20 x + 8/20 x = 11/20 x"},{"n":"Krok 2 — dopočítej celou trasu","d":"Těch 11/20 x je 22 km.","f":"11/20 x = 22  →  x = 40 km"},{"n":"Krok 3 — sečti celou nachozenou dráhu","d":"Cesta ke studánce, návrat pro mobil a pak celý zbytek.","f":"3/5·40 + 3/20·40 + 11/20·40\n= 24 + 6 + 22"},{"n":"Krok 4 — výsledek","d":"","f":"52 km"}],"vys":"52 km","odp":"52"},{"c":"15","q":"VÝCHOZÍ TEXT K ÚLOZE 7\n\nAdam běžel 10kilometrový okruh stálým tempem a uběhl jej za 40 minut.\nBára běžela pouze 8kilometrový okruh rovněž stálým tempem (jiným než Adam).\nOba vyběhli ve stejném okamžiku a po 24 minutách běhu jim oběma zbývala do cíle stejná vzdálenost.\n\nÚloha 7.1\nVypočtěte, kolik km uběhla Bára za 24 minut.","typ":"open","b":1,"kroky":[{"n":"Krok 1 — Adamovo tempo","d":"Deset kilometrů za čtyřicet minut.","f":"10 : 40 = 0,25 km/min"},{"n":"Krok 2 — kolik Adam uběhl za 24 minut","d":"","f":"0,25 · 24 = 6 km"},{"n":"Krok 3 — kolik Adamovi zbývá","d":"","f":"10 − 6 = 4 km"},{"n":"Krok 4 — Báře zbývá stejně","d":"Její okruh je osmikilometrový.","f":"8 − 4 = 4 km uběhla"}],"vys":"4 km","odp":"4"},{"c":"16","q":"Úloha 7.2\n\nVypočtěte, za kolik minut uběhla svůj okruh Bára.","typ":"open","b":2,"kroky":[{"n":"Krok 1 — Bářino tempo","d":"Čtyři kilometry za dvacet čtyři minut.","f":"4 : 24 = 1/6 km/min"},{"n":"Krok 2 — celý okruh","d":"Osm kilometrů jejím tempem.","f":"8 : (1/6) = 48 minut"},{"n":"Rychlejší úvaha","d":"Za 24 minut uběhla polovinu okruhu, takže celý zvládne za dvojnásobek času.","f":"48 minut"}],"vys":"48 minut","odp":"48"},{"c":"17","q":"VÝCHOZÍ TEXT K ÚLOZE 8\n\nV trojúhelníku ABC leží střed S kružnice opsané přímo na straně AB.\nOsa vnitřního úhlu při vrcholu B svírá se stranou AB úhel 26°.\n\nÚloha 8.1\nVypočtěte ve stupních velikost vnitřního úhlu β při vrcholu B.","typ":"open","b":1,"kroky":[{"n":"Krok 1 — co dělá osa úhlu","d":"Osa dělí vnitřní úhel přesně na dvě stejné poloviny.","f":"polovina β = 26°"},{"n":"Krok 2 — celý úhel","d":"","f":"β = 2 · 26 = 52°"}],"vys":"β = 52°","odp":"52"},{"c":"18","q":"Úloha 8.2\n\nVypočtěte ve stupních velikost vnitřního úhlu α při vrcholu A.","typ":"open","b":2,"kroky":[{"n":"Krok 1 — proč je úhel při C pravý","d":"Střed kružnice opsané leží na straně AB, takže AB je průměrem. Podle Thaletovy věty je úhel při C pravý.","f":"γ = 90°"},{"n":"Krok 2 — součet úhlů v trojúhelníku","d":"","f":"α + β + γ = 180°"},{"n":"Krok 3 — dopočítej","d":"","f":"α = 180 − 90 − 52 = 38°"}],"vys":"α = 38°","odp":"38"},{"c":"19","q":"KONSTRUKČNÍ ÚVAHA — ÚLOHA 9\n\nBod C má mít od přímky AB vzdálenost 3 cm a zároveň má ležet na kružnici se středem A a poloměrem 5 cm.\n\nKolik takových bodů C existuje?","typ":"choice","b":3,"kroky":[{"n":"Krok 1 — první podmínka","d":"Body vzdálené 3 cm od přímky leží na dvou rovnoběžkách — jedné nad přímkou, druhé pod ní.","f":"2 rovnoběžky"},{"n":"Krok 2 — druhá podmínka","d":"Body ve vzdálenosti 5 cm od A leží na kružnici s poloměrem 5 cm.","f":"1 kružnice"},{"n":"Krok 3 — kolik průsečíků","d":"Vzdálenost bodu A od každé rovnoběžky je 3 cm, což je méně než poloměr 5 cm. Každá rovnoběžka tedy kružnici protne ve dvou bodech.","f":"2 · 2 = 4 body"}],"vys":"Čtyři body","moz":["čtyři","dva","jeden","žádný"],"spr":0},{"c":"20","q":"KONSTRUKČNÍ ÚVAHA — ÚLOHA 10\n\nOsa souměrnosti rovnoběžníku ABCD prochází jeho vrcholy B a D, tedy leží na úhlopříčce BD.\n\nO jaký rovnoběžník se musí jednat?","typ":"choice","b":2,"kroky":[{"n":"Krok 1 — co osa souměrnosti znamená","d":"Překlopením podle úhlopříčky BD se vrchol A musí zobrazit na vrchol C.","f":"A ↔ C"},{"n":"Krok 2 — co z toho plyne","d":"Pak musí platit |AB| = |BC|, tedy sousední strany jsou stejně dlouhé.","f":"|AB| = |BC|"},{"n":"Krok 3 — závěr","d":"Rovnoběžník se všemi stranami stejně dlouhými je kosočtverec. Obdélník úhlopříčku jako osu souměrnosti nemá.","f":"kosočtverec"}],"vys":"Kosočtverec","moz":["kosočtverec","obdélník","obecný rovnoběžník","lichoběžník"],"spr":0},{"c":"21","q":"VÝCHOZÍ TEXT K ÚLOZE 11\n\nVe skladu jsou pouze čtyři druhy krmiva — oves, ječmen, kukuřice a pšenice.\nZ diagramu vyplývá, že oves tvoří 30 % a ječmen 20 % celkové hmotnosti zásob.\nSklad obsahuje 24 tun kukuřice a 24 tun pšenice.\n\nÚloha 11.1\nRozhodněte, zda je tvrzení pravdivé:\n„Oves a ječmen tvoří dohromady polovinu celkové hmotnosti zásob.“","typ":"choice","b":1,"kroky":[{"n":"Krok 1 — sečti procenta","d":"","f":"30 % + 20 % = 50 %"},{"n":"Krok 2 — porovnej","d":"Padesát procent je přesně polovina.","f":"tvrzení je pravdivé"}],"vys":"Pravdivé","moz":["Pravdivé (A)","Nepravdivé (N)"],"spr":0},{"c":"22","q":"Úloha 11.2\n\nRozhodněte, zda je tvrzení pravdivé:\n„Poměr hmotnosti ovsa ku hmotnosti ječmene je 3 : 2.“","typ":"choice","b":1,"kroky":[{"n":"Krok 1 — zapiš poměr z procent","d":"","f":"30 : 20"},{"n":"Krok 2 — krať desítkou","d":"","f":"3 : 2  →  tvrzení je pravdivé"}],"vys":"Pravdivé","moz":["Pravdivé (A)","Nepravdivé (N)"],"spr":0},{"c":"23","q":"Úloha 11.3\n\nRozhodněte, zda je tvrzení pravdivé:\n„Sklad obsahuje 30 tun ovsa.“","typ":"choice","b":2,"kroky":[{"n":"Krok 1 — dopočítej podíl kukuřice a pšenice","d":"Zbývá 50 %, rozdělené na dva stejné díly, protože obou je 24 tun.","f":"kukuřice 25 %, pšenice 25 %"},{"n":"Krok 2 — celková hmotnost zásob","d":"Čtvrtina zásob je 24 tun.","f":"24 : 0,25 = 96 tun"},{"n":"Krok 3 — kolik je ovsa","d":"","f":"30 % z 96 = 28,8 tuny"},{"n":"Krok 4 — závěr","d":"Není to 30 tun, tvrzení je nepravdivé.","f":"nepravdivé"}],"vys":"Nepravdivé — ovsa je 28,8 tuny","moz":["Nepravdivé (N)","Pravdivé (A)"],"spr":0},{"c":"24","q":"VÝCHOZÍ TEXT K ÚLOZE 12\n\nV restauraci je 12 stolů vyhrazeno pro nekuřáky.\nLoni tyto stoly představovaly jednu desetinu celkové kapacity, letos po přestavbě představují pouze 8 % celkové kapacity.\n\nO kolik stolů se díky přestavbě zvětšila celková kapacita restaurace?","typ":"choice","b":2,"kroky":[{"n":"Krok 1 — loňská kapacita","d":"Dvanáct stolů byla jedna desetina.","f":"12 · 10 = 120 stolů"},{"n":"Krok 2 — letošní kapacita","d":"Dvanáct stolů je osm procent.","f":"12 : 0,08 = 150 stolů"},{"n":"Krok 3 — rozdíl","d":"","f":"150 − 120 = 30 stolů"}],"vys":"O 30 stolů","moz":["o 20 stolů","o 30 stolů","o 40 stolů","o 50 stolů","o jiný počet stolů"],"spr":1},{"c":"25","q":"VÝCHOZÍ TEXT K ÚLOZE 13\n\nRovnoramenný trojúhelník KLM se základnou LM délky 24 cm má obvod 64 cm.\n\nJaký je obsah trojúhelníku KLM?","typ":"choice","b":2,"kroky":[{"n":"Krok 1 — délka ramen","d":"Obvod bez základny se rozdělí na dvě stejná ramena.","f":"(64 − 24) : 2 = 20 cm"},{"n":"Krok 2 — výška k základně","d":"Výška půlí základnu, vznikne pravoúhlý trojúhelník s přeponou 20 a odvěsnou 12.","f":"v² = 400 − 144 = 256\nv = 16 cm"},{"n":"Krok 3 — obsah","d":"","f":"S = 24 · 16 / 2 = 192 trany jsou v rovnováze.\n\nKdyž něco přidáš vlevo, musíš to samé přidat i vpravo — jinak se váhy překlopí. Přesně to znamená ekvivalentní úprava.","svg":"<svg class=\"vis\" viewBox=\"0 0 320 130\" xmlns=\"http://www.w3.org/2000/svg\"><line x1=\"160\" y1=\"20\" x2=\"160\" y2=\"95\" stroke=\"#f4f1e8\" stroke-width=\"3\"/><line x1=\"55\" y1=\"35\" x2=\"265\" y2=\"35\" stroke=\"#f4f1e8\" stroke-width=\"3\"/><polygon points=\"160,95 135,120 185,120\" fill=\"none\" stroke=\"#f4f1e8\" stroke-width=\"3\"/><rect x=\"25\" y=\"38\" width=\"60\" height=\"34\" rx=\"5\" fill=\"none\" stroke=\"#7fe3ff\" stroke-width=\"2.5\"/><text x=\"55\" y=\"61\" fill=\"#7fe3ff\" font-size=\"17\" font-weight=\"700\" text-anchor=\"middle\" font-family=\"sans-serif\">3x+5<\/text><rect x=\"235\" y=\"38\" width=\"60\" height=\"34\" rx=\"5\" fill=\"none\" stroke=\"#ffd84d\" stroke-width=\"2.5\"/><text x=\"265\" y=\"61\" fill=\"#ffd84d\" font-size=\"17\" font-weight=\"700\" text-anchor=\"middle\" font-family=\"sans-serif\">20<\/text><text x=\"160\" y=\"17\" fill=\"#f4f1e8\" font-size=\"15\" text-anchor=\"middle\" font-family=\"sans-serif\">=<\/text><\/svg>"},{"h":"Úprava 1 — přičítání a odčítání","t":"Chceš dostat x doleva a čísla doprava.\n\nPravidlo do kapsy: co přechází přes rovnítko, mění znaménko. Plus se změní na minus a naopak.","f":"3x + 5 = 20  | −5\n3x = 15"},{"h":"Úprava 2 — násobení a dělení","t":"Když u x zůstane číslo, celou rovnici tím číslem vyděl. Zase obě strany!\n\nJediný zákaz: nikdy nesmíš dělit nulou.","f":"3x = 15  | :3\nx = 5"},{"h":"Závorky roznásob jako první","t":"Máš-li v rovnici závorku, nejdřív ji odstraň. Číslo před závorkou vynásobíš každý člen uvnitř.\n\nPozor na minus před závorkou — to obrátí znaménka všech členů uvnitř.","f":"2(x + 3) = 2x + 6\n−(x − 4) = −x + 4"},{"h":"Zlomky? Vynásob a zmizí","t":"Zlomky v rovnici jsou jen strašák. Najdi nejmenší společný jmenovatel a jím vynásob celou rovnici — každý člen na obou stranách.\n\nZlomky se zkrátí a zbude ti obyčejná rovnice.","f":"x/2 + x/3 = 5  | ·6\n3x + 2x = 30"},{"h":"Zkouška — a máš jistotu","t":"Zkouška není otrava, je to tvoje pojistka. Za body v testu se často počítá i ona.\n\nDůležité: dosazuj vždy do PŮVODNÍ rovnice, ne do té upravené. Kdybys totiž udělala chybu při úpravě, zkouška by ti ji neodhalila.","f":"L = 3·5 + 5 = 20\nP = 20\nL = P  ✓"},{"h":"Dva zvláštní případy","t":"Občas se x vykrátí úplně. Nezpanikař, jsou jen dvě možnosti:\n\n• Zbude pravdivé tvrzení (třeba 0 = 0) → rovnice má nekonečně mnoho řešení.\n• Zbude nesmysl (třeba 0 = 5) → rovnice nemá žádné řešení.","f":"2x + 2 = 2x + 2  →  0 = 0\n3x + 2 = 3x + 7  →  0 = 5"}],"ulohy":[{"id":"mat-rovnice-35f0e5fa","q":"Řeš rovnici:\n\n4x + 7 = 31","typ":"open","kroky":[{"n":"Krok 1 — dostaň čísla doprava","d":"Od obou stran odečti 7. Sedmička přejde přes rovnítko a změní znaménko.","f":"4x = 31 − 7\n4x = 24"},{"n":"Krok 2 — osamostatni x","d":"U x stojí čtyřka, takže obě strany vyděl čtyřmi.","f":"x = 24 : 4\nx = 6"},{"n":"Krok 3 — zkouška","d":"Dosaď 6 do původní rovnice a spočítej obě strany zvlášť.","f":"L = 4·6 + 7 = 31\nP = 31   →   L = P ✓"}],"vys":"x = 6","odp":"6"},{"id":"mat-rovnice-20336ecb","q":"Řeš rovnici:\n\n5x − 7 = 2x + 8","typ":"open","kroky":[{"n":"Krok 1 — x doleva","d":"Neznámá je na obou stranách. Odečti 2x od obou stran, aby zůstala jen vlevo.","f":"5x − 2x − 7 = 8\n3x − 7 = 8"},{"n":"Krok 2 — čísla doprava","d":"Přičti 7 k oběma stranám.","f":"3x = 8 + 7\n3x = 15"},{"n":"Krok 3 — vyděl","d":"Obě strany vyděl třemi.","f":"x = 5"},{"n":"Krok 4 — zkouška","d":"Dosaď do původní rovnice.","f":"L = 5·5 − 7 = 18\nP = 2·5 + 8 = 18  ✓"}],"vys":"x = 5","odp":"5"},{"id":"mat-rovnice-470023bf","q":"Řeš rovnici se závorkou:\n\n2(x + 3) = 14","typ":"open","kroky":[{"n":"Krok 1 — roznásob závorku","d":"Dvojku vynásob s každým členem uvnitř závorky.","f":"2·x + 2·3 = 14\n2x + 6 = 14"},{"n":"Krok 2 — odečti 6","d":"Šestka přejde doprava se změněným znaménkem.","f":"2x = 8"},{"n":"Krok 3 — vyděl dvěma","d":"","f":"x = 4"},{"n":"Zkouška","d":"Dosaď zpátky do původního tvaru se závorkou.","f":"L = 2·(4 + 3) = 2·7 = 14  ✓"}],"vys":"x = 4","odp":"4"},{"id":"mat-rovnice-b098adfd","q":"Pozor na minus před závorkou:\n\n5x − (2x − 6) = 12","typ":"open","kroky":[{"n":"Krok 1 — odstraň závorku","d":"Před závorkou je minus, takže se obrátí znaménka VŠECH členů uvnitř. Tady dělá většina lidí chybu.","f":"5x − 2x + 6 = 12"},{"n":"Krok 2 — sečti x","d":"5x mínus 2x jsou 3x.","f":"3x + 6 = 12"},{"n":"Krok 3 — dopočítej","d":"Odečti 6 a vyděl třemi.","f":"3x = 6\nx = 2"},{"n":"Zkouška","d":"","f":"L = 5·2 − (2·2 − 6) = 10 − (−2) = 12  ✓"}],"vys":"x = 2","odp":"2"},{"id":"mat-rovnice-1314bf21","q":"Řeš rovnici:\n\n4(x − 1) = 3(x + 2)","typ":"open","kroky":[{"n":"Krok 1 — roznásob obě závorky","d":"Vlevo čtyřkou, vpravo trojkou.","f":"4x − 4 = 3x + 6"},{"n":"Krok 2 — x doleva, čísla doprava","d":"Odečti 3x a přičti 4.","f":"4x − 3x = 6 + 4\nx = 10"},{"n":"Zkouška","d":"Dosaď do původní rovnice.","f":"L = 4·(10 − 1) = 36\nP = 3·(10 + 2) = 36  ✓"}],"vys":"x = 10","odp":"10"},{"id":"mat-rovnice-a369ffa9","q":"Rovnice se zlomkem:\n\nx/3 + 2 = 5","typ":"open","kroky":[{"n":"Krok 1 — zbav se čísla","d":"Nejdřív odečti 2 od obou stran.","f":"x/3 = 3"},{"n":"Krok 2 — vynásob jmenovatelem","d":"Obě strany vynásob třemi, zlomek zmizí.","f":"x = 9"},{"n":"Zkouška","d":"","f":"L = 9:3 + 2 = 5  ✓"}],"vys":"x = 9","odp":"9"},{"id":"mat-rovnice-e7c4b65b","q":"Řeš rovnici:\n\nx/2 + x/3 = 5","typ":"open","kroky":[{"n":"Krok 1 — najdi společný jmenovatel","d":"Jmenovatelé jsou 2 a 3. Nejmenší společný násobek je 6.","f":"NSN(2, 3) = 6"},{"n":"Krok 2 — vynásob celou rovnici šesti","d":"Každý člen na obou stranách! Zlomky se zkrátí.","f":"6·x/2 + 6·x/3 = 6·5\n3x + 2x = 30"},{"n":"Krok 3 — dopočítej","d":"Sečti x a vyděl.","f":"5x = 30\nx = 6"},{"n":"Zkouška","d":"","f":"L = 6:2 + 6:3 = 3 + 2 = 5  ✓"}],"vys":"x = 6","odp":"6"},{"id":"mat-rovnice-76b27ce4","q":"Náročnější zlomky (typ z ostrého testu):\n\n(x − 6)/6 = (2x − 3)/2 − (3x − 2)/3","typ":"open","kroky":[{"n":"Krok 1 — společný jmenovatel","d":"Jmenovatelé jsou 6, 2 a 3. Nejmenší společný násobek je 6.","f":"NSN(6, 2, 3) = 6"},{"n":"Krok 2 — vynásob šesti","d":"Každý zlomek vynásob šesti a zkrať. Čitatele dej do závorek, ať neuděláš chybu se znaménky.","f":"(x − 6) = 3(2x − 3) − 2(3x − 2)"},{"n":"Krok 3 — roznásob závorky","d":"Pozor na minus před druhou závorkou.","f":"x − 6 = 6x − 9 − 6x + 4"},{"n":"Krok 4 — zjednoduš pravou stranu","d":"6x a −6x se vyruší, zbudou jen čísla.","f":"x − 6 = −5"},{"n":"Krok 5 — dopočítej","d":"Přičti 6 k oběma stranám.","f":"x = 1"}],"vys":"x = 1","odp":"1"},{"id":"mat-rovnice-7d9a46a4","q":"Řeš rovnici:\n\n(x + 1)/4 − (x − 1)/6 = 1","typ":"open","kroky":[{"n":"Krok 1 — společný jmenovatel","d":"Jmenovatelé 4 a 6, nejmenší společný násobek je 12.","f":"NSN(4, 6) = 12"},{"n":"Krok 2 — vynásob dvanácti","d":"12:4 = 3 a 12:6 = 2.","f":"3(x + 1) − 2(x − 1) = 12"},{"n":"Krok 3 — roznásob","d":"Minus před druhou závorkou obrátí znaménka.","f":"3x + 3 − 2x + 2 = 12"},{"n":"Krok 4 — sečti a dopočítej","d":"","f":"x + 5 = 12\nx = 7"}],"vys":"x = 7","odp":"7"},{"id":"mat-rovnice-e40fdfdf","q":"Kolik řešení má tato rovnice?\n\n3x + 2 = 3x + 7","typ":"choice","kroky":[{"n":"Krok 1 — dej x na jednu stranu","d":"Odečti 3x od obou stran.","f":"3x − 3x + 2 = 7\n2 = 7"},{"n":"Krok 2 — přečti, co ti zbylo","d":"Neznámá se vykrátila úplně a zbylo tvrzení 2 = 7. To ale není pravda — dvě se nikdy nerovnají sedmi.","f":"2 = 7   ✗ nepravda"},{"n":"Krok 3 — závěr","d":"Když po vykrácení zbude nepravdivé tvrzení, neexistuje žádné číslo, které by rovnici splnilo.","f":"Rovnice nemá řešení."}],"vys":"Rovnice nemá žádné řešení","moz":["Nemá žádné řešení","Má jedno řešení x = 5","Má nekonečně mnoho řešení","Má dvě řešení"],"spr":0},{"id":"mat-rovnice-cf25e008","q":"Kolik řešení má tato rovnice?\n\n2(x + 1) = 2x + 2","typ":"choice","kroky":[{"n":"Krok 1 — roznásob závorku","d":"","f":"2x + 2 = 2x + 2"},{"n":"Krok 2 — odečti 2x","d":"Obě strany jsou úplně stejné, x se vykrátí.","f":"2 = 2"},{"n":"Krok 3 — závěr","d":"Zbylo pravdivé tvrzení. To znamená, že rovnice platí pro jakékoli číslo, které za x dosadíš.","f":"Nekonečně mnoho řešení."}],"vys":"Nekonečně mnoho řešení","moz":["Nemá řešení","Jedno řešení x = 1","Nekonečně mnoho řešení","Jedno řešení x = 0"],"spr":2},{"id":"mat-rovnice-e3b5e81f","q":"SLOVNÍ ÚLOHA\n\nMatěj nasbírá za 45 minut půl džbánu malin.\nZa jak dlouho by tři děti naplnily celý džbán, kdyby každé pracovalo stejným tempem jako Matěj?\n\n(Odpověz počtem minut.)","typ":"open","kroky":[{"n":"Krok 1 — přelož zadání do čísel","d":"Matěj zvládne za 45 minut půl džbánu. Celý džbán by mu tedy trval dvakrát tak dlouho.","f":"1 dítě → celý džbán za 90 minut"},{"n":"Krok 2 — co udělají tři děti","d":"Tři děti pracují najednou, takže práci zvládnou třikrát rychleji. Čas se dělí třemi.","f":"90 : 3 = 30"},{"n":"Krok 3 — ověř úsudkem","d":"Dává to smysl? Tři děti musí být rychlejší než jedno — 30 minut je méně než 90. Sedí.","f":"Odpověď: 30 minut"}],"vys":"30 minut","odp":"30"},{"id":"mat-rovnice-12d1a906","q":"SLOVNÍ ÚLOHA\n\nMysli si číslo. Když ho zvětšíš o 12, dostaneš jeho trojnásobek.\nKteré je to číslo?","typ":"open","kroky":[{"n":"Krok 1 — označ neznámou","d":"Hledané číslo si pojmenuj x. To je vždycky první krok u slovní úlohy.","f":"x … hledané číslo"},{"n":"Krok 2 — přepiš větu do rovnice","d":"„Zvětšíš o 12\" znamená x + 12. „Trojnásobek\" znamená 3x. Slovo „dostaneš\" je rovnítko.","f":"x + 12 = 3x"},{"n":"Krok 3 — vyřeš","d":"Odečti x od obou stran a vyděl dvěma.","f":"12 = 2x\nx = 6"},{"n":"Krok 4 — ověř do zadání","d":"Šestka zvětšená o 12 je 18. Trojnásobek šesti je taky 18. Sedí.","f":"6 + 12 = 18 = 3·6  ✓"}],"vys":"Hledané číslo je 6","odp":"6"},{"id":"mat-rovnice-a70daae3","q":"SLOVNÍ ÚLOHA\n\nObdélník má obvod 46 cm. Jeho delší strana je o 5 cm delší než kratší.\nJak dlouhá je kratší strana? (Odpověz v cm.)","typ":"open","kroky":[{"n":"Krok 1 — označ neznámou","d":"Vždycky si označ to menší nebo jednodušší. Kratší strana bude x, delší je pak x + 5.","f":"kratší = x\ndelší = x + 5"},{"n":"Krok 2 — napiš vzorec pro obvod","d":"Obvod obdélníku je dvakrát součet obou stran.","f":"o = 2·(a + b)\n46 = 2·(x + x + 5)"},{"n":"Krok 3 — uprav a vyřeš","d":"Vyděl dvěma, pak sečti x a odečti 5.","f":"23 = 2x + 5\n18 = 2x\nx = 9"},{"n":"Krok 4 — ověř do zadání","d":"Kratší 9, delší 14. Obvod je 2·(9 + 14) = 46. Sedí.","f":"Kratší strana měří 9 cm"}],"vys":"9 cm","odp":"9"},{"id":"mat-rovnice-85f67f34","q":"Řeš rovnici s desetinnými čísly:\n\n0,5x + 1,5 = 4","typ":"open","kroky":[{"n":"Krok 1 — zbav se desetinných čísel","d":"Vynásob celou rovnici deseti. Není to nutné, ale s celými čísly se počítá líp.","f":"5x + 15 = 40"},{"n":"Krok 2 — odečti 15","d":"","f":"5x = 25"},{"n":"Krok 3 — vyděl pěti","d":"","f":"x = 5"},{"n":"Zkouška","d":"","f":"L = 0,5·5 + 1,5 = 2,5 + 1,5 = 4  ✓"}],"vys":"x = 5","odp":"5"}]},{"id":"cj-shoda","predmet":"CJ","tema":"pravopis-iy","nazev":"Shoda přísudku s podmětem","popis":"Kdy psát v příčestí -i, -y nebo -a. Nejčastější pravopisný jev v testu — a jeden z nejzrádnějších.","vyklad":[{"h":"O co vlastně jde?","t":"V minulém čase se sloveso musí přizpůsobit podmětu. Tomu se říká shoda přísudku s podmětem.\n\nRozhoduje se poslední písmeno slovesa — a to podle toho, jakého rodu a čísla je podmět.","f":"Chlapci běželi.\nDívky běžely.\nKuřata běžela."},{"h":"Vždycky postupuj v těchto třech krocích","t":"Nikdy nehádej podle citu. Vždycky si projdi tyhle tři otázky — nikdy tě nezradí:\n\n1. Najdi podmět. Zeptej se: KDO nebo CO to dělal?\n2. Urči jeho rod a číslo.\n3. Podle tabulky doplň koncovku.","f":"KDO? → jaký rod? → koncovka"},{"h":"Množné číslo — hlavní tabulka","t":"Tuhle tabulku si zapamatuj a máš vyhráno. Platí pro množné číslo:\n\n• rod mužský ŽIVOTNÝ → -i\n• rod mužský NEŽIVOTNÝ → -y\n• rod ŽENSKÝ → -y\n• rod STŘEDNÍ → -a","f":"muži nesli    (M životný)\nstromy padaly (M neživotný)\nženy nesly    (ženský)\nauta jela     (střední)"},{"h":"Jednotné číslo je jednodušší","t":"V jednotném čísle se koncovka řídí rodem takto:\n\n• rod mužský → -l  (chlapec běžel)\n• rod ženský → -la (dívka běžela)\n• rod střední → -lo (kotě běželo)\n\nTady chybu skoro nikdo neudělá, sluch si poradí sám.","f":"pes štěkal · fena štěkala · štěně štěkalo"},{"h":"Zrádná slova, na kterých se propadá","t":"Některá podstatná jména vypadají jako ženský rod, ale jsou mužská životná — nebo naopak. Ta si zapamatuj zvlášť:\n\n• koně, lidé, hosté, rodiče → mužský ŽIVOTNÝ → -i\n• děti, oči, uši → rod ŽENSKÝ → -y\n• housata, koťata, děvčata → rod STŘEDNÍ → -a","f":"Koně běželi.   ale   Děti běhaly.\nLidé přišli.   ale   Oči se leskly."},{"h":"Několikanásobný podmět","t":"Když je podmětů víc, platí jednoduché pravidlo: stačí jediný mužský životný a celý přísudek dostane -i.\n\nJe úplně jedno, kolik je tam ženských nebo středních — ten jeden mužský životný rozhodne.","f":"Maminka, sestra a bratr odjeli.\n(bratr = M životný → -i)\n\nSestra a maminka odjely.\n(oba ženské → -y)"},{"h":"Podmět nevyjádřený","t":"Někdy podmět ve větě vůbec není napsaný. Pak ho musíš najít z předchozí věty nebo z tvaru slovesa.\n\nNejjistější je dosadit si zájmeno oni / ony / ona a podívat se, koho zastupuje.","f":"Kluci šli do lesa. Nesli si batohy.\n(kdo nesl? → kluci → -i)"},{"h":"Pozor na past: podmět není to nejbližší slovo","t":"Tvůrci testů schválně dají těsně před sloveso slovo jiného rodu, aby tě zmátli. Podmět ale může být daleko vepředu.\n\nProto se vždycky ptej KDO / CO, ne co je nejblíž slovesu.","f":"Chlapci u řeky s udicemi seděli.\n(kdo seděl? chlapci → -i, ne udice!)"}],"ulohy":[{"id":"cj-shoda-90fb5e7a","q":"Doplň správnou koncovku:\n\nChlapci na hřišti hlasitě křičel__.","typ":"choice","kroky":[{"n":"Krok 1 — najdi podmět","d":"Zeptej se: KDO křičel? Odpověď je chlapci. Slovo „na hřišti\" tě nemá zmást, to je jen místo.","f":"podmět: chlapci"},{"n":"Krok 2 — urči rod a číslo","d":"Chlapec je mužský rod životný. Ve větě je jich víc, takže množné číslo.","f":"rod mužský ŽIVOTNÝ, množné číslo"},{"n":"Krok 3 — použij tabulku","d":"Mužský životný v množném čísle má vždy koncovku -i.","f":"→ křičeli"}],"vys":"Chlapci na hřišti hlasitě křičeli.","moz":["křičeli","křičely","křičela","křičel"],"spr":0},{"id":"cj-shoda-9288af6f","q":"Doplň správnou koncovku:\n\nStromy v aleji se ohýbal__ ve větru.","typ":"choice","kroky":[{"n":"Krok 1 — najdi podmět","d":"CO se ohýbalo? Stromy.","f":"podmět: stromy"},{"n":"Krok 2 — urči rod a číslo","d":"Strom je mužský rod, ale NEŽIVOTNÝ — strom není živá bytost, která by chodila. Množné číslo.","f":"rod mužský NEŽIVOTNÝ, množné číslo"},{"n":"Krok 3 — použij tabulku","d":"Mužský neživotný v množném čísle má koncovku -y, stejně jako ženský rod. Tady se chybuje nejčastěji — lidé napíšou -i jen proto, že je to mužský rod.","f":"→ ohýbaly"}],"vys":"Stromy v aleji se ohýbaly ve větru.","moz":["ohýbaly","ohýbali","ohýbala","ohýbal"],"spr":0},{"id":"cj-shoda-d9794386","q":"Doplň správnou koncovku:\n\nKoťata si spokojeně předl__ na peřině.","typ":"choice","kroky":[{"n":"Krok 1 — najdi podmět","d":"KDO předl? Koťata.","f":"podmět: koťata"},{"n":"Krok 2 — urči rod a číslo","d":"Kotě je rod střední (to kotě). Koťata je množné číslo.","f":"rod STŘEDNÍ, množné číslo"},{"n":"Krok 3 — použij tabulku","d":"Střední rod v množném čísle má koncovku -a.","f":"→ předla"}],"vys":"Koťata si spokojeně předla na peřině.","moz":["předla","předly","předli","předlo"],"spr":0},{"id":"cj-shoda-117a784b","q":"Doplň správnou koncovku:\n\nKoně klidně pásl__ na louce.","typ":"choice","kroky":[{"n":"Krok 1 — najdi podmět","d":"KDO se pásl? Koně.","f":"podmět: koně"},{"n":"Krok 2 — pozor, tady je past","d":"Slovo „koně\" končí na -ě a vypadá jako ženský rod. Není! Kůň je mužský rod ŽIVOTNÝ — je to živé zvíře.","f":"rod mužský ŽIVOTNÝ, množné číslo"},{"n":"Krok 3 — použij tabulku","d":"Mužský životný v množném čísle → -i. Tohle slovo se v testech objevuje schválně.","f":"→ pásli"}],"vys":"Koně klidně pásli na louce.","moz":["pásli","pásly","pásla","pásl"],"spr":0},{"id":"cj-shoda-78cdfb05","q":"Doplň správnou koncovku:\n\nDěti si na dvoře hrál__ s míčem.","typ":"choice","kroky":[{"n":"Krok 1 — najdi podmět","d":"KDO si hrál? Děti.","f":"podmět: děti"},{"n":"Krok 2 — pozor, druhá klasická past","d":"Děti jsou přece kluci i holky, tak by měla být -i, ne? NE. Slovo „děti\" je v množném čísle rodu ŽENSKÉHO — ta děti, ty děti.","f":"rod ŽENSKÝ, množné číslo"},{"n":"Krok 3 — použij tabulku","d":"Ženský rod v množném čísle → -y. Zapamatuj si: děti, oči, uši → vždycky -y.","f":"→ hrály"}],"vys":"Děti si na dvoře hrály s míčem.","moz":["hrály","hráli","hrála","hrálo"],"spr":0},{"id":"cj-shoda-4171a44d","q":"Doplň správnou koncovku:\n\nLidé před obchodem netrpělivě čekal__.","typ":"choice","kroky":[{"n":"Krok 1 — najdi podmět","d":"KDO čekal? Lidé.","f":"podmět: lidé"},{"n":"Krok 2 — urči rod","d":"Slovo „lidé\" je mužský rod ŽIVOTNÝ v množném čísle — ti lidé. Patří do stejné skupiny jako koně, hosté nebo rodiče.","f":"rod mužský ŽIVOTNÝ, množné číslo"},{"n":"Krok 3 — použij tabulku","d":"","f":"→ čekali"}],"vys":"Lidé před obchodem netrpělivě čekali.","moz":["čekali","čekaly","čekala","čekalo"],"spr":0},{"id":"cj-shoda-03fd12b2","q":"Doplň správnou koncovku:\n\nMaminka, teta a strýc přijel__ na návštěvu.","typ":"choice","kroky":[{"n":"Krok 1 — najdi podmět","d":"KDO přijel? Jsou tři: maminka, teta a strýc. Je to několikanásobný podmět.","f":"podmět: maminka, teta, strýc"},{"n":"Krok 2 — projdi rody","d":"Maminka je ženský rod. Teta je ženský rod. Strýc je mužský rod ŽIVOTNÝ.","f":"ženský + ženský + M životný"},{"n":"Krok 3 — použij pravidlo o převaze","d":"U několikanásobného podmětu stačí JEDINÝ mužský životný a celý přísudek dostane -i. Nezáleží na tom, že ženské jsou dvě.","f":"→ přijeli"}],"vys":"Maminka, teta a strýc přijeli na návštěvu.","moz":["přijeli","přijely","přijela","přijelo"],"spr":0},{"id":"cj-shoda-398e3c3e","q":"Doplň správnou koncovku:\n\nSestra s kamarádkou odjel__ na výlet.","typ":"choice","kroky":[{"n":"Krok 1 — najdi podmět","d":"KDO odjel? Sestra a kamarádka.","f":"podmět: sestra, kamarádka"},{"n":"Krok 2 — urči rody","d":"Obě jsou ženský rod. Žádný mužský životný tam není.","f":"ženský + ženský, množné číslo"},{"n":"Krok 3 — použij tabulku","d":"Samé ženské rody v množném čísle → -y.","f":"→ odjely"}],"vys":"Sestra s kamarádkou odjely na výlet.","moz":["odjely","odjeli","odjela","odjelo"],"spr":0},{"id":"cj-shoda-3da72e60","q":"Doplň správnou koncovku:\n\nAuta na parkovišti stál__ v dlouhé řadě.","typ":"choice","kroky":[{"n":"Krok 1 — najdi podmět","d":"CO stálo? Auta.","f":"podmět: auta"},{"n":"Krok 2 — urči rod a číslo","d":"Auto je rod střední (to auto). Auta je množné číslo.","f":"rod STŘEDNÍ, množné číslo"},{"n":"Krok 3 — použij tabulku","d":"Střední rod v množném čísle → -a.","f":"→ stála"}],"vys":"Auta na parkovišti stála v dlouhé řadě.","moz":["stála","stály","stáli","stálo"],"spr":0},{"id":"cj-shoda-022cd4ae","q":"Doplň správnou koncovku:\n\nRybáři u rybníka s pruty trpělivě seděl__.","typ":"choice","kroky":[{"n":"Krok 1 — najdi podmět","d":"KDO seděl? Rybáři. Slova „u rybníka\" a „s pruty\" jsou schválně vložená, aby tě zmátla — těsně před slovesem stojí „pruty\", ale ty nesedí.","f":"podmět: rybáři"},{"n":"Krok 2 — urči rod a číslo","d":"Rybář je mužský rod ŽIVOTNÝ, množné číslo.","f":"rod mužský ŽIVOTNÝ, množné číslo"},{"n":"Krok 3 — použij tabulku","d":"Pamatuj: podmět nemusí být to slovo nejblíž slovesu. Vždy se ptej KDO.","f":"→ seděli"}],"vys":"Rybáři u rybníka s pruty trpělivě seděli.","moz":["seděli","seděly","seděla","sedělo"],"spr":0},{"id":"cj-shoda-3e17107c","q":"Doplň správnou koncovku:\n\nJejí oči se v přítmí leskl__.","typ":"choice","kroky":[{"n":"Krok 1 — najdi podmět","d":"CO se lesklo? Oči.","f":"podmět: oči"},{"n":"Krok 2 — urči rod","d":"Slovo „oči\" je v množném čísle rodu ŽENSKÉHO — ty oči. Patří do stejné skupiny jako děti a uši.","f":"rod ŽENSKÝ, množné číslo"},{"n":"Krok 3 — použij tabulku","d":"","f":"→ leskly"}],"vys":"Její oči se v přítmí leskly.","moz":["leskly","leskli","leskla","lesklo"],"spr":0},{"id":"cj-shoda-3485a44b","q":"Doplň správnou koncovku (podmět není ve větě):\n\nSousedé se vrátili z dovolené. Hned nám vyprávěl__ o moři.","typ":"choice","kroky":[{"n":"Krok 1 — hledej podmět","d":"Ve druhé větě žádný podmět napsaný není. Musíš ho najít v té předchozí.","f":"podmět nevyjádřený"},{"n":"Krok 2 — dosaď zájmeno","d":"KDO vyprávěl? Oni — a to jsou sousedé z první věty.","f":"podmět: sousedé"},{"n":"Krok 3 — urči rod a doplň","d":"Soused je mužský rod ŽIVOTNÝ v množném čísle.","f":"→ vyprávěli"}],"vys":"Hned nám vyprávěli o moři.","moz":["vyprávěli","vyprávěly","vyprávěla","vyprávělo"],"spr":0},{"id":"cj-shoda-8b78a6ac","q":"Doplň správnou koncovku:\n\nNaše babičky pekly se vnučkami vánoční cukroví. Celý den se v kuchyni smál__.","typ":"choice","kroky":[{"n":"Krok 1 — najdi podmět","d":"KDO se smál? Babičky a vnučky — obojí z předchozí věty.","f":"podmět: babičky, vnučky"},{"n":"Krok 2 — urči rody","d":"Babička je ženský rod, vnučka také. Žádný mužský životný.","f":"samé ženské rody, množné číslo"},{"n":"Krok 3 — použij tabulku","d":"","f":"→ smály"}],"vys":"Celý den se v kuchyni smály.","moz":["smály","smáli","smála","smálo"],"spr":0},{"id":"cj-shoda-be76c7e7","q":"Doplň správnou koncovku:\n\nHousata s kachňaty se batolil__ k vodě.","typ":"choice","kroky":[{"n":"Krok 1 — najdi podmět","d":"KDO se batolil? Housata a kachňata.","f":"podmět: housata, kachňata"},{"n":"Krok 2 — urči rod","d":"Housata i kachňata jsou mláďata — a názvy mláďat jsou v češtině rod STŘEDNÍ (to house, to kachně).","f":"rod STŘEDNÍ, množné číslo"},{"n":"Krok 3 — použij tabulku","d":"Střední rod v množném čísle → -a. Pozor, mláďata jsou živá, ale rod je střední, ne mužský životný.","f":"→ batolila"}],"vys":"Housata s kachňaty se batolila k vodě.","moz":["batolila","batolily","batolili","batolilo"],"spr":0},{"id":"cj-shoda-b4bd2ada","q":"Doplň správnou koncovku:\n\nDivadelní představení diváky nadchl__.","typ":"choice","kroky":[{"n":"Krok 1 — najdi podmět","d":"Tady je past. CO nadchlo? Představení. Diváci nejsou podmět — ti byli nadšení, ale nic nedělali. Jsou předmět.","f":"podmět: představení"},{"n":"Krok 2 — urči rod a číslo","d":"Představení je rod STŘEDNÍ a tady jednotné číslo — jedno představení.","f":"rod STŘEDNÍ, jednotné číslo"},{"n":"Krok 3 — doplň koncovku","d":"Střední rod v jednotném čísle → -lo.","f":"→ nadchlo"}],"vys":"Divadelní představení diváky nadchlo.","moz":["nadchlo","nadchli","nadchly","nadchla"],"spr":0}]},{"id":"mat-vyrazy","predmet":"M","tema":"vyrazy","nazev":"Výrazy a mnohočleny","popis":"Roznásobování, vytýkání a tři vzorce, které musíš znát zpaměti. Bez toho se neobejdeš u rovnic ani u slovních úloh.","vyklad":[{"h":"Co je výraz a co proměnná","t":"Výraz je zápis složený z čísel, písmen a znamének. Písmenu se říká proměnná — může za ni přijít jakékoli číslo.\n\nČlen výrazu je každá část oddělená plusem nebo mínusem. Ve výrazu 3x + 5y − 2 jsou tři členy.","f":"3x + 5y − 2\n↑     ↑     ↑\n1.    2.    3. člen"},{"h":"Sčítat smíš jen stejné členy","t":"Stejné členy mají úplně stejné písmeno i mocninu. Jen ty se dají sečíst.\n\n3x a 5x sečteš na 8x. Ale 3x a 5x² sečíst nejde — to jsou různé věci a musí zůstat vedle sebe.","f":"3x + 5x = 8x  ✓\n3x + 5x² = 3x + 5x²  (nejde zjednodušit)"},{"h":"Roznásobování závorky","t":"Číslo před závorkou vynásobíš s každým členem uvnitř. Na žádný nesmíš zapomenout.\n\nJe-li před závorkou mínus, obrátí znaménka všech členů uvnitř. Tady se chybuje nejvíc.","f":"3(2x − 4) = 6x − 12\n−(2x − 4) = −2x + 4"},{"h":"Závorka krát závorka","t":"Každý člen první závorky vynásobíš s každým členem druhé. U dvoučlenů to jsou čtyři součiny.\n\nPomůcka: postupuj vždy stejně — první s prvním, první s druhým, druhý s prvním, druhý s druhým.","f":"(x + 2)(x + 3) =\n= x² + 3x + 2x + 6 =\n= x² + 5x + 6"},{"h":"Tři vzorce, které musíš umět nazpaměť","t":"Tyhle tři se v testu objevují pořád. Naučit se je vyplatí víc než cokoli jiného v tomhle okruhu.\n\nTřetí z nich — rozdíl druhých mocnin — se hodí i obráceně, k rozkladu na součin.","f":"(a + b)² = a² + 2ab + b²\n(a − b)² = a² − 2ab + b²\n(a + b)(a − b) = a² − b²"},{"h":"Vytýkání — vzorce naruby","t":"Vytýkání je opak roznásobování. Najdeš, co mají všechny členy společné, a dáš to před závorku.\n\nZkouška je snadná: roznásob to zpátky a musíš dostat původní výraz.","f":"6x + 9 = 3(2x + 3)\n4x² − 8x = 4x(x − 2)"},{"h":"Hodnota výrazu","t":"Dosadit číslo za proměnnou umí každý. Pozor jen na dvě věci:\n\nZáporné číslo dosazuj vždy do závorky. A nezapomeň na pořadí operací — nejdřív mocniny, pak násobení, až nakonec sčítání.","f":"pro x = −2:\n3x² = 3·(−2)² = 3·4 = 12\n(ne 3·(−4) = −12!)"}],"ulohy":[{"id":"mat-vyrazy-992c7e92","q":"Zjednoduš výraz:\n\n5x + 3y − 2x + 7y","typ":"open","kroky":[{"n":"Krok 1 — najdi stejné členy","d":"Členy s x jsou 5x a −2x. Členy s y jsou 3y a 7y.","f":"(5x − 2x) + (3y + 7y)"},{"n":"Krok 2 — sečti každou skupinu zvlášť","d":"","f":"3x + 10y"},{"n":"Krok 3 — dál to nejde","d":"3x a 10y sečíst nelze, mají různé proměnné. Výsledek necháváme takto.","f":"3x + 10y"}],"vys":"3x + 10y","odp":"3x+10y"},{"id":"mat-vyrazy-ca04b6b9","q":"Roznásob a zjednoduš:\n\n2(x − 3) − 4(2 − x)","typ":"open","kroky":[{"n":"Krok 1 — roznásob první závorku","d":"Dvojkou vynásob oba členy.","f":"2x − 6"},{"n":"Krok 2 — roznásob druhou závorku","d":"Před závorkou je −4. Vynásob −4 s oběma členy: −4·2 = −8 a −4·(−x) = +4x.","f":"−8 + 4x"},{"n":"Krok 3 — sečti stejné členy","d":"2x a 4x dají 6x, −6 a −8 dají −14.","f":"6x − 14"}],"vys":"6x − 14","odp":"6x-14"},{"id":"mat-vyrazy-baa48da6","q":"Umocni podle vzorce:\n\n(x + 5)²","typ":"open","kroky":[{"n":"Krok 1 — vyber správný vzorec","d":"Je to druhá mocnina součtu, tedy (a + b)² = a² + 2ab + b².","f":"a = x, b = 5"},{"n":"Krok 2 — dosaď do vzorce","d":"a² je x², dvojnásobný součin je 2·x·5, b² je 25.","f":"x² + 2·x·5 + 5²"},{"n":"Krok 3 — dopočítej","d":"Pozor: nejčastější chyba je napsat jen x² + 25 a zapomenout prostřední člen.","f":"x² + 10x + 25"}],"vys":"x² + 10x + 25","odp":"x²+10x+25"},{"id":"mat-vyrazy-3990ec26","q":"Umocni podle vzorce:\n\n(3a − 2)²","typ":"open","kroky":[{"n":"Krok 1 — urči a a b","d":"Je to druhá mocnina rozdílu. Za a dosazujeme celé 3a, ne jen a.","f":"a = 3a, b = 2"},{"n":"Krok 2 — dosaď","d":"(3a)² = 9a². Prostřední člen je 2·3a·2 = 12a a je záporný. Poslední je 2² = 4.","f":"9a² − 12a + 4"},{"n":"Poznámka","d":"Umocňuje se celý člen 3a včetně trojky. Napsat 3a² by byla chyba.","f":"(3a)² = 9a²  ✓"}],"vys":"9a² − 12a + 4","odp":"9a²-12a+4"},{"id":"mat-vyrazy-987edfb8","q":"Roznásob:\n\n(x − 4)(x + 4)","typ":"open","kroky":[{"n":"Krok 1 — poznej vzorec","d":"Stejná dvojice se jednou sčítá a jednou odčítá. To je rozdíl druhých mocnin.","f":"(a + b)(a − b) = a² − b²"},{"n":"Krok 2 — dosaď","d":"a je x, b je 4.","f":"x² − 4² = x² − 16"},{"n":"Kontrola roznásobením","d":"x·x + 4x − 4x − 16. Prostřední členy se vyruší, zbude x² − 16.","f":"x² − 16  ✓"}],"vys":"x² − 16","odp":"x²-16"},{"id":"mat-vyrazy-dea730ab","q":"Roznásob a zjednoduš:\n\n(2x + 1)(x − 3)","typ":"open","kroky":[{"n":"Krok 1 — každý s každým","d":"2x·x = 2x², 2x·(−3) = −6x, 1·x = x, 1·(−3) = −3.","f":"2x² − 6x + x − 3"},{"n":"Krok 2 — sečti prostřední členy","d":"−6x a +x dají −5x.","f":"2x² − 5x − 3"}],"vys":"2x² − 5x − 3","odp":"2x²-5x-3"},{"id":"mat-vyrazy-196f524b","q":"Vytkni před závorku:\n\n12x + 18","typ":"open","kroky":[{"n":"Krok 1 — najdi společného dělitele","d":"Čísla 12 a 18 dělí beze zbytku 6. To je největší společný dělitel.","f":"NSD(12, 18) = 6"},{"n":"Krok 2 — vytkni","d":"Před závorku dej 6, dovnitř to, co zbude po dělení: 12x:6 = 2x a 18:6 = 3.","f":"6(2x + 3)"},{"n":"Zkouška","d":"Roznásob zpátky: 6·2x = 12x, 6·3 = 18. Sedí.","f":"6(2x + 3) = 12x + 18  ✓"}],"vys":"6(2x + 3)","odp":"6(2x+3)"},{"id":"mat-vyrazy-4f8ff61d","q":"Vytkni před závorku:\n\n5a² − 15a","typ":"open","kroky":[{"n":"Krok 1 — společné je i písmeno","d":"Čísla 5 a 15 dělí pětka. Navíc oba členy obsahují a — první dokonce a².","f":"společné: 5a"},{"n":"Krok 2 — vytkni 5a","d":"5a²:5a = a a −15a:5a = −3.","f":"5a(a − 3)"},{"n":"Zkouška","d":"5a·a = 5a², 5a·(−3) = −15a. Sedí.","f":"5a(a − 3)  ✓"}],"vys":"5a(a − 3)","odp":"5a(a-3)"},{"id":"mat-vyrazy-cba287be","q":"Rozlož na součin pomocí vzorce:\n\nx² − 49","typ":"open","kroky":[{"n":"Krok 1 — poznej rozdíl druhých mocnin","d":"x² je druhá mocnina x, 49 je druhá mocnina sedmi. Mezi nimi je mínus.","f":"x² − 7²"},{"n":"Krok 2 — použij vzorec pozpátku","d":"a² − b² = (a + b)(a − b).","f":"(x + 7)(x − 7)"},{"n":"Poznámka","d":"Na pořadí závorek nezáleží, součin je stejný.","f":"(x − 7)(x + 7)  ✓"}],"vys":"(x + 7)(x − 7)","odp":"(x-7)(x+7)"},{"id":"mat-vyrazy-e4eaab04","q":"Vypočti hodnotu výrazu 2x² − 3x pro x = −2.","typ":"open","kroky":[{"n":"Krok 1 — dosaď do závorky","d":"Záporné číslo dávej vždy do závorky, jinak se spleteš ve znaménku.","f":"2·(−2)² − 3·(−2)"},{"n":"Krok 2 — nejdřív mocnina","d":"(−2)² je +4, protože mínus krát mínus je plus.","f":"2·4 − 3·(−2)"},{"n":"Krok 3 — pak násobení a odčítání","d":"2·4 = 8 a −3·(−2) = +6.","f":"8 + 6 = 14"}],"vys":"14","odp":"14"},{"id":"mat-vyrazy-813fac3e","q":"Který zápis vyjadřuje obvod obdélníku se stranami x a x + 3?","typ":"choice","kroky":[{"n":"Krok 1 — vzorec pro obvod","d":"Obvod obdélníku je dvojnásobek součtu obou stran.","f":"o = 2·(a + b)"},{"n":"Krok 2 — dosaď strany","d":"","f":"o = 2·(x + x + 3)"},{"n":"Krok 3 — zjednoduš uvnitř a roznásob","d":"Uvnitř je 2x + 3, dvojka to roznásobí.","f":"o = 2·(2x + 3) = 4x + 6"}],"vys":"4x + 6","moz":["4x + 6","2x + 3","x² + 3x","2x + 6"],"spr":0},{"id":"mat-vyrazy-3416385f","q":"Zapiš výrazem: číslo x zmenšené o třetinu čísla y.","typ":"choice","kroky":[{"n":"Krok 1 — rozeber větu po částech","d":"Základ je číslo x. Od něj se něco odčítá.","f":"x − …"},{"n":"Krok 2 — co se odčítá","d":"Třetina lohy":[{"id":"mat-mocniny-5750c831","q":"Vypočti zpaměti:\n\n13²","typ":"open","kroky":[{"n":"Krok 1 — rozepiš","d":"Třináct na druhou znamená 13 krát 13.","f":"13·13"},{"n":"Krok 2 — spočítej po částech","d":"13·13 = 13·10 + 13·3 = 130 + 39.","f":"130 + 39 = 169"},{"n":"Zapamatuj si","d":"Tuhle hodnotu i sousední (12² = 144, 14² = 196) je dobré znát nazpaměť.","f":"13² = 169"}],"vys":"169","odp":"169"},{"id":"mat-mocniny-3f7c94c5","q":"Vypočti:\n\n√196","typ":"open","kroky":[{"n":"Krok 1 — hledej číslo, jehož druhá mocnina je 196","d":"Zkus mezi 13 a 15. 13² = 169, to je málo. 15² = 225, to je moc.","f":"13² = 169 < 196 < 225 = 15²"},{"n":"Krok 2 — zbývá čtrnáctka","d":"14·14 = 196.","f":"√196 = 14"}],"vys":"14","odp":"14"},{"id":"mat-mocniny-19ea395f","q":"Vypočti:\n\n√(0,49)","typ":"open","kroky":[{"n":"Krok 1 — převeď na zlomek","d":"0,49 je 49 setin.","f":"√(49/100)"},{"n":"Krok 2 — odmocni čitatele i jmenovatele","d":"√49 = 7 a √100 = 10.","f":"7/10"},{"n":"Krok 3 — zpátky na desetinné číslo","d":"","f":"0,7"}],"vys":"0,7","odp":"0.7"},{"id":"mat-mocniny-66dd17f7","q":"Vypočti hodnotu výrazu:\n\n3² + 4²","typ":"open","kroky":[{"n":"Krok 1 — nejdřív mocniny","d":"Mocniny mají přednost před sčítáním.","f":"9 + 16"},{"n":"Krok 2 — sečti","d":"","f":"25"},{"n":"Pozor na past","d":"Není to (3 + 4)² = 49. Mocnina se počítá zvlášť pro každé číslo.","f":"3² + 4² = 25 ≠ 49"}],"vys":"25","odp":"25"},{"id":"mat-mocniny-1ad9416d","q":"Vypočti:\n\n√(9·16)","typ":"open","kroky":[{"n":"Krok 1 — dvě cesty, obě správné","d":"Buď nejdřív vynásob 9·16 = 144 a pak odmocni. Nebo odmocni každé zvlášť.","f":"√144  nebo  √9·√16"},{"n":"Krok 2 — kratší cesta","d":"√9 = 3 a √16 = 4.","f":"3·4 = 12"}],"vys":"12","odp":"12"},{"id":"mat-mocniny-f0e43863","q":"Kolik je jedna šestnáctina z jednoho metru čtverečního? (v cm²)","typ":"choice","kroky":[{"n":"Krok 1 — převeď metr čtvereční","d":"Metr je 100 cm, takže metr čtvereční je 100·100 cm².","f":"1 m² = 10 000 cm²"},{"n":"Krok 2 — vyděl šestnácti","d":"","f":"10 000 : 16 = 625"},{"n":"Poznámka","d":"Pozor, plošné jednotky se převádějí stovkou, ne desítkou. Tady se chybuje.","f":"625 cm²"}],"vys":"625 cm²","moz":["625 cm²","6,25 cm²","16 cm²","1 600 cm²"],"spr":0},{"id":"mat-mocniny-d1461703","q":"Zapiš pomocí mocniny desíti:\n\n0,001","typ":"choice","kroky":[{"n":"Krok 1 — spočítej desetinná místa","d":"Jednička je na třetím místě za desetinnou čárkou.","f":"0,001 = 1/1000"},{"n":"Krok 2 — převeď na mocninu","d":"Tisíc je 10³, takže jedna tisícina je 10 na mínus třetí.","f":"10⁻³"}],"vys":"10⁻³","moz":["10⁻³","10³","10⁻²","10⁻⁴"],"spr":0},{"id":"mat-mocniny-2bf14e60","q":"Čtverec má obsah 121 cm². Jak dlouhá je jeho strana? (v cm)","typ":"open","kroky":[{"n":"Krok 1 — vzorec pro obsah čtverce","d":"Obsah je strana krát strana, tedy druhá mocnina strany.","f":"S = a²"},{"n":"Krok 2 — odmocni","d":"Hledáme číslo, jehož druhá mocnina je 121.","f":"a = √121 = 11"},{"n":"Zkouška","d":"11·11 = 121. Sedí.","f":"strana = 11 cm"}],"vys":"11 cm","odp":"11"},{"id":"mat-mocniny-db5f2a33","q":"Vypočti:\n\n(−3)²","typ":"open","kroky":[{"n":"Krok 1 — rozepiš","d":"Umocňuje se celé číslo v závorce, tedy −3.","f":"(−3)·(−3)"},{"n":"Krok 2 — znaménka","d":"Mínus krát mínus je plus.","f":"+9"},{"n":"Pozor na rozdíl","d":"Bez závorky je to jinak: −3² znamená −(3²) = −9. Závorka rozhoduje.","f":"(−3)² = 9   ale   −3² = −9"}],"vys":"9","odp":"9"},{"id":"mat-mocniny-34a925f3","q":"Vypočti hodnotu výrazu:\n\n√64 + √36","typ":"open","kroky":[{"n":"Krok 1 — odmocni každé zvlášť","d":"√64 = 8, protože 8² = 64. √36 = 6, protože 6² = 36.","f":"8 + 6"},{"n":"Krok 2 — sečti","d":"","f":"14"},{"n":"Pozor","d":"Není to √(64 + 36) = √100 = 10. Odmocnina se nedá rozdělit přes součet.","f":"√64 + √36 = 14"}],"vys":"14","odp":"14"}]},{"id":"mat-pomer","predmet":"M","tema":"pomer","nazev":"Poměr, úměrnost a měřítko","popis":"Trojčlenka, dělení v poměru, měřítko mapy a plánu. Základ skoro každé slovní úlohy.","vyklad":[{"h":"Co je poměr","t":"Poměr porovnává dvě veličiny. Zapisuje se dvojtečkou a čte se „ku“.\n\nPoměr se dá krátit i rozšiřovat jako zlomek — 6 : 9 je totéž co 2 : 3.","f":"6 : 9 = 2 : 3\n(vydělíme obě čísla třemi)"},{"h":"Dělení v daném poměru","t":"Musíš rozdělit celek v poměru? Spočítej nejdřív, kolik je dohromady dílů. Pak zjisti hodnotu jednoho dílu a tou násob.\n\nTenhle postup funguje vždycky, i pro tři a víc částí.","f":"1 200 Kč v poměru 2 : 3\ndílů: 2 + 3 = 5\njeden díl: 1 200 : 5 = 240\n480 Kč a 720 Kč"},{"h":"Přímá úměrnost","t":"Když jedna veličina roste, druhá roste stejně rychle. Dvakrát víc rohlíků stojí dvakrát tolik.\n\nPoznávací znamení: podíl obou veličin je pořád stejný. Grafem je přímka procházející počátkem.","f":"3 rohlíky … 12 Kč\n6 rohlíků … 24 Kč\n12/3 = 24/6 = 4"},{"h":"Nepřímá úměrnost","t":"Když jedna veličina roste, druhá klesá. Dvakrát víc dělníků udělá práci za poloviční čas.\n\nPoznávací znamení: součin obou veličin je pořád stejný. Grafem je hyperbola.","f":"3 dělníci … 8 dní\n6 dělníků … 4 dny\n3·8 = 6·4 = 24"},{"h":"Trojčlenka — a hlavně šipky","t":"Napiš si zadání do dvou řádků pod sebe a udělej šipky.\n\nU přímé úměrnosti míří obě šipky stejným směrem. U nepřímé opačným — a to znamená, že jednu stranu zlomku otočíš.","f":"přímá:   ↓↓  nebo  ↑↑\nnepřímá: ↓↑  nebo  ↑↓"},{"h":"Měřítko mapy a plánu","t":"Měřítko 1 : 50 000 znamená, že 1 cm na mapě je 50 000 cm ve skutečnosti.\n\nNejčastější chyba je zapomenout převést jednotky. Vždycky nakonec převeď centimetry na metry nebo kilometry.","f":"1 : 50 000\n1 cm → 50 000 cm = 500 m = 0,5 km"},{"h":"Postup u měřítka","t":"Z mapy do skutečnosti se násobí, ze skutečnosti na mapu se dělí. Vždycky číslem z měřítka.\n\nJe-li měřítko zvětšovací (třeba 2 : 1 u drobné součástky), platí to obráceně.","f":"mapa → skutečnost: ·50 000\nskutečnost → mapa: :50 000"}],"ulohy":[{"id":"mat-pomer-d140ceb0","q":"Zkrať poměr na základní tvar:\n\n18 : 24","typ":"open","kroky":[{"n":"Krok 1 — najdi společného dělitele","d":"Čísla 18 a 24 dělí beze zbytku šestka.","f":"NSD(18, 24) = 6"},{"n":"Krok 2 — vyděl obě čísla","d":"18:6 = 3 a 24:6 = 4.","f":"3 : 4"},{"n":"Kontrola","d":"Trojka a čtyřka už společného dělitele nemají, poměr je v základním tvaru.","f":"3 : 4  ✓"}],"vys":"3 : 4","odp":"3:4"},{"id":"mat-pomer-02d957aa","q":"SLOVNÍ ÚLOHA\n\nBabička rozdělila mezi vnoučata 1 500 Kč v poměru 2 : 3. Kolik korun dostalo to, které bralo víc?","typ":"open","kroky":[{"n":"Krok 1 — spočítej díly","d":"Poměr 2 : 3 znamená dohromady pět dílů.","f":"2 + 3 = 5 dílů"},{"n":"Krok 2 — hodnota jednoho dílu","d":"Celou částku vyděl počtem dílů.","f":"1 500 : 5 = 300 Kč"},{"n":"Krok 3 — větší podíl","d":"Ten větší má tři díly.","f":"3 · 300 = 900 Kč"},{"n":"Zkouška","d":"Menší dostal 2·300 = 600. Dohromady 900 + 600 = 1 500. Sedí.","f":"900 Kč"}],"vys":"900 Kč","odp":"900"},{"id":"mat-pomer-9144e555","q":"SLOVNÍ ÚLOHA\n\nSedm stejných sešitů stojí 84 Kč. Kolik korun stojí pět takových sešitů?","typ":"open","kroky":[{"n":"Krok 1 — urči typ úměrnosti","d":"Míň sešitů znamená míň peněz. Obě veličiny jdou stejným směrem, je to přímá úměrnost.","f":"přímá úměrnost"},{"n":"Krok 2 — cena jednoho sešitu","d":"","f":"84 : 7 = 12 Kč"},{"n":"Krok 3 — cena pěti","d":"","f":"5 · 12 = 60 Kč"}],"vys":"60 Kč","odp":"60"},{"id":"mat-pomer-cea2d145","q":"SLOVNÍ ÚLOHA\n\nŠest zedníků postaví zeď za 10 dní. Za kolik dní ji postaví patnáct zedníků při stejném tempu?","typ":"open","kroky":[{"n":"Krok 1 — urči typ úměrnosti","d":"Víc zedníků znamená míň dní. Veličiny jdou proti sobě — nepřímá úměrnost.","f":"nepřímá úměrnost"},{"n":"Krok 2 — spočítej celkovou práci","d":"U nepřímé úměrnosti je součin stálý. Práce je 6·10 = 60 „člověkodnů“.","f":"6 · 10 = 60"},{"n":"Krok 3 — vyděl novým počtem","d":"","f":"60 : 15 = 4 dny"},{"n":"Ověř úsudkem","d":"Patnáct je víc než šest, takže musí vyjít míň než 10 dní. Sedí.","f":"4 dny"}],"vys":"4 dny","odp":"4"},{"id":"mat-pomer-81b27bc9","q":"Na mapě s měřítkem 1 : 25 000 je vzdálenost 8 cm. Kolik je to ve skutečnosti v kilometrech?","typ":"open","kroky":[{"n":"Krok 1 — z mapy do skutečnosti se násobí","d":"","f":"8 · 25 000 = 200 000 cm"},{"n":"Krok 2 — převeď na metry","d":"Sto centimetrů je metr.","f":"200 000 : 100 = 2 000 m"},{"n":"Krok 3 — převeď na kilometry","d":"Tisíc metrů je kilometr.","f":"2 000 : 1 000 = 2 km"}],"vys":"2 km","odp":"2"},{"id":"mat-pomer-e037dec0","q":"Skutečná vzdálenost dvou měst je 15 km. Jak daleko od sebe budou na mapě 1 : 100 000? (v cm)","typ":"open","kroky":[{"n":"Krok 1 — převeď na centimetry","d":"Nejdřív si vše dej do stejných jednotek jako měřítko.","f":"15 km = 15 000 m = 1 500 000 cm"},{"n":"Krok 2 — ze skutečnosti na mapu se dělí","d":"","f":"1 500 000 : 100 000 = 15 cm"},{"n":"Pomůcka","d":"U měřítka 1 : 100 000 platí, že 1 cm je právě 1 km. To se hodí pamatovat.","f":"15 cm"}],"vys":"15 cm","odp":"15"},{"id":"mat-pomer-7dbb7eaf","q":"Ve třídě je poměr chlapců a dívek 3 : 4. Chlapců je 12. Kolik je ve třídě dívek?","typ":"open","kroky":[{"n":"Krok 1 — najdi hodnotu dílu","d":"Chlapci mají tři díly a je jich dvanáct.","f":"12 : 3 = 4 na jeden díl"},{"n":"Krok 2 — dívky mají čtyři díly","d":"","f":"4 · 4 = 16 dívek"},{"n":"Doplňková kontrola","d":"Celkem je ve třídě 12 + 16 = 28 žáků, což je 7 dílů po 4. Sedí.","f":"16 dívek"}],"vys":"16 dívek","odp":"16"},{"id":"mat-pomer-a76337de","q":"Který graf odpovídá přímé úměrnosti?","typ":"choice","kroky":[{"n":"Krok 1 — co znamená přímá úměrnost","d":"Podíl obou veličin je stálý, tedy y = k·x.","f":"y = k · x"},{"n":"Krok 2 — jak takový graf vypadá","d":"Rovnice bez absolutního členu znamená přímku, která začíná v počátku. Když je x nulové, je nulové i y.","f":"přímka přes bod [0, 0]"},{"n":"Pro srovnání","d":"Nepřímá úměrnost má tvar y = k/x a jejím grafem je hyperbola.","f":"přímka počátkem  ✓"}],"vys":"Přímka procházející počátkem","moz":["Přímka procházející počátkem","Hyperbola","Parabola","Vodorovná přímka"],"spr":0},{"id":"mat-pomer-864024c8","q":"SLOVNÍ ÚLOHA\n\nAuto ujede 100 km na 6 litrů benzinu. Kolik litrů spotřebuje na 250 km?","typ":"open","kroky":[{"n":"Krok 1 — typ úměrnosti","d":"Delší cesta znamená víc paliva. Přímá úměrnost.","f":"přímá"},{"n":"Krok 2 — spotřeba na 1 km","d":"","f":"6 : 100 = 0,06 l"},{"n":"Krok 3 — na 250 km","d":"","f":"0,06 · 250 = 15 l"}],"vys":"15 litrů","odp":"15"},{"id":"mat-pomer-2b4ffb85","q":"Do bazénu teče voda dvěma stejnými trubkami 9 hodin. Za jak dlouho ho naplní tři takové trubky?","typ":"open","kroky":[{"n":"Krok 1 — typ úměrnosti","d":"Víc trubek, kratší čas. Nepřímá úměrnost.","f":"nepřímá"},{"n":"Krok 2 — celková práce","d":"","f":"2 · 9 = 18"},{"n":"Krok 3 — vyděl třemi","d":"","f":"18 : 3 = 6 hodin"}],"vys":"6 hodin","odp":"6"}]},{"id":"mat-procenta","predmet":"M","tema":"procenta","nazev":"Procenta a finanční matematika","popis":"Základ, počet procent, procentová část. Slevy, zdražení, úroky a daň z úroku — přesně jak to chce test.","vyklad":[{"h":"Tři pojmy, které stačí rozlišit","t":"Základ je celek, tedy sto procent. Počet procent říká, kolik z něj bereme. Procentová část je výsledné množství.\n\nV každé úloze si nejdřív pojmenuj, co je co. Tím je půlka práce hotová.","f":"z 800 Kč (základ)\nvezmi 25 % (počet procent)\ndostaneš 200 Kč (část)"},{"h":"Jedno procento je klíč","t":"Nejjistější postup: spočítej si jedno procento a pak jím násob.\n\nJedno procento získáš vydělením základu stem. Pak už jen násobíš, kolik procent potřebuješ.","f":"1 % z 800 = 800 : 100 = 8\n25 % = 25 · 8 = 200"},{"h":"Sleva — pozor na dvě cesty","t":"Sleva 20 % se dá spočítat dvěma způsoby. Druhý je rychlejší a méně chybový.\n\nBuď spočítáš slevu a odečteš ji. Nebo rovnou spočítáš, kolik zbude — tedy 80 %.","f":"cena 500, sleva 20 %\ncesta A: 500 − 100 = 400\ncesta B: 80 % z 500 = 400"},{"h":"Zdražení funguje stejně","t":"Zdraží-li se o 15 %, platíš 115 % původní ceny.\n\nRychlý převod: 115 % je 1,15. Původní cenu prostě vynásob tímto číslem.","f":"200 Kč + 15 %\n200 · 1,15 = 230 Kč"},{"h":"Jistina, úrok a úroková míra","t":"Jistina je vložená částka. Úroková míra je procento za rok. Úrok je to, co ti banka připíše.\n\nÚrok za jeden rok spočítáš jako procento z jistiny — přesně jako každá jiná procentová úloha.","f":"jistina 20 000 Kč\núroková míra 3 % p. a.\núrok = 3 % z 20 000 = 600 Kč"},{"h":"Daň z úroku","t":"Z připsaného úroku si stát bere daň — u nás 15 %. Daň se počítá z úroku, ne z jistiny.\n\nNa účet ti tedy dorazí jen 85 % úroku.","f":"úrok 600 Kč\ndaň: 15 % z 600 = 90 Kč\nčistý úrok: 510 Kč"},{"h":"Inflace jednoduše","t":"Inflace znamená, že ceny rostou a za stejné peníze koupíš míň.\n\nPři inflaci 5 % stojí zboží za 100 Kč o rok později 105 Kč. Počítá se úplně stejně jako zdražení.","f":"100 Kč při inflaci 5 %\n→ za rok 105 Kč"}],"ulohy":[{"id":"mat-procenta-a24a0808","q":"Vypočti 35 % z 240.","typ":"open","kroky":[{"n":"Krok 1 — spočítej jedno procento","d":"Základ vyděl stem.","f":"240 : 100 = 2,4"},{"n":"Krok 2 — vynásob počtem procent","d":"","f":"35 · 2,4 = 84"}],"vys":"84","odp":"84"},{"id":"mat-procenta-55951dcf","q":"Kabát stál 1 200 Kč a zlevnil o 30 %. Kolik stojí teď?","typ":"open","kroky":[{"n":"Krok 1 — kolik zbude po slevě","d":"Sleva 30 % znamená, že platíš 70 % ceny. Tahle cesta je rychlejší než počítat slevu zvlášť.","f":"100 % − 30 % = 70 %"},{"n":"Krok 2 — spočítej 70 % z ceny","d":"1 % je 12 Kč, sedmdesát procent je 70·12.","f":"70 · 12 = 840 Kč"},{"n":"Kontrola druhou cestou","d":"Sleva by byla 30·12 = 360. A 1 200 − 360 = 840. Sedí.","f":"840 Kč"}],"vys":"840 Kč","odp":"840"},{"id":"mat-procenta-9b5fd5a9","q":"Kolik procent je 45 ze 180?","typ":"open","kroky":[{"n":"Krok 1 — urči, co je základ","d":"Celek je 180, hledáme, jakou je 45 jeho částí.","f":"základ = 180"},{"n":"Krok 2 — spočítej jedno procento","d":"","f":"180 : 100 = 1,8"},{"n":"Krok 3 — kolikrát se vejde do 45","d":"","f":"45 : 1,8 = 25 %"}],"vys":"25 %","odp":"25"},{"id":"mat-procenta-0ea7fe55","q":"Po zdražení o 20 % stojí zboží 360 Kč. Kolik stálo př
