tavy-3908cd06","q":"SLOVNÍ ÚLOHA\n\nZa 3 rohlíky a 2 housky zaplatíš 26 Kč. Za 1 rohlík a 4 housky zaplatíš 32 Kč. Kolik korun stojí jeden rohlík?","typ":"open","kroky":[{"n":"Krok 1 — pojmenuj neznámé","d":"Cena rohlíku r, cena housky h.","f":"3r + 2h = 26\nr + 4h = 32"},{"n":"Krok 2 — vyjádři r z druhé rovnice","d":"Tam stojí r osamoceně, je to nejjednodušší.","f":"r = 32 − 4h"},{"n":"Krok 3 — dosaď do první","d":"","f":"3(32 − 4h) + 2h = 26"},{"n":"Krok 4 — vyřeš","d":"Roznásob a seber členy.","f":"96 − 12h + 2h = 26\n−10h = −70  →  h = 7"},{"n":"Krok 5 — dopočítej rohlík","d":"","f":"r = 32 − 4·7 = 4 Kč"},{"n":"Zkouška","d":"3·4 + 2·7 = 12 + 14 = 26 ✓","f":"rohlík stojí 4 Kč"}],"vys":"Rohlík 4 Kč, houska 7 Kč","odp":"4"},{"id":"mat-soustavy-a1e7c933","q":"SLOVNÍ ÚLOHA\n\nSoučet dvou čísel je 40, jejich rozdíl je 8. Které je to větší číslo?","typ":"open","kroky":[{"n":"Krok 1 — napiš soustavu","d":"","f":"x + y = 40\nx − y = 8"},{"n":"Krok 2 — sečti rovnice","d":"y se vyruší.","f":"2x = 48  →  x = 24"},{"n":"Krok 3 — dopočítej druhé číslo","d":"","f":"24 + y = 40  →  y = 16"},{"n":"Zkouška","d":"Součet 40 ✓, rozdíl 24 − 16 = 8 ✓","f":"větší číslo je 24"}],"vys":"24 (druhé je 16)","odp":"24"},{"id":"mat-soustavy-242c758b","q":"Kolik řešení má soustava?\n\nx + y = 5\n2x + 2y = 10","typ":"choice","kroky":[{"n":"Krok 1 — porovnej rovnice","d":"Druhá rovnice je přesně dvojnásobek první. Neříká nám nic nového.","f":"2·(x + y) = 2·5"},{"n":"Krok 2 — zkus sčítací metodu","d":"Vynásob první rovnici −2 a přičti ke druhé.","f":"0 = 0"},{"n":"Krok 3 — závěr","d":"Zbylo pravdivé tvrzení, ale obě neznámé zmizely. Řešením je každá dvojice, která splňuje x + y = 5.","f":"nekonečně mnoho řešení"}],"vys":"Nekonečně mnoho řešení","moz":["Nekonečně mnoho","Právě jedno","Žádné","Právě dvě"],"spr":0}]},{"id":"mat-pythagoras","predmet":"M","tema":"trojuhelniky","nazev":"Pythagorova věta","popis":"Výpočet stran pravoúhlého trojúhelníku, úhlopříčky v obdélníku, krychli i kvádru. V testu bývá každý rok.","vyklad":[{"h":"Kdy ji smíš použít","t":"Pythagorova věta platí JEN v pravoúhlém trojúhelníku. Nikde jinde.\n\nNejdřív se vždycky ujisti, že v úloze pravý úhel opravdu je — často je schovaný v obdélníku, ve čtverci nebo ve výšce trojúhelníku.","f":"jen když je v trojúhelníku 90°"},{"h":"Odvěsny a přepona","t":"Přepona je nejdelší strana a leží vždycky NAPROTI pravému úhlu. Zbylé dvě strany jsou odvěsny.\n\nZáměna přepony a odvěsny je nejčastější chyba v celém okruhu. Než začneš počítat, najdi si pravý úhel a podívej se naproti.","f":"c … přepona (naproti 90°)\na, b … odvěsny"},{"h":"Samotná věta","t":"Obsah čtverce nad přeponou se rovná součtu obsahů čtverců nad oběma odvěsnami.\n\nJinými slovy: druhá mocnina přepony je součet druhých mocnin odvěsen.","f":"c² = a² + b²","svg":"<svg class=\"vis\" viewBox=\"0 0 260 150\" xmlns=\"http://www.w3.org/2000/svg\"><polygon points=\"40,120 160,120 40,40\" fill=\"none\" stroke=\"#f4f1e8\" stroke-width=\"2.5\"/><rect x=\"40\" y=\"105\" width=\"15\" height=\"15\" fill=\"none\" stroke=\"#ffd84d\" stroke-width=\"2\"/><text x=\"95\" y=\"138\" fill=\"#7fe3ff\" font-size=\"15\" font-weight=\"700\" text-anchor=\"middle\" font-family=\"sans-serif\">a<\/text><text x=\"26\" y=\"85\" fill=\"#7fe3ff\" font-size=\"15\" font-weight=\"700\" text-anchor=\"middle\" font-family=\"sans-serif\">b<\/text><text x=\"112\" y=\"72\" fill=\"#ff8ad1\" font-size=\"15\" font-weight=\"700\" text-anchor=\"middle\" font-family=\"sans-serif\">c<\/text><text x=\"205\" y=\"80\" fill=\"#ffd84d\" font-size=\"14\" font-weight=\"700\" text-anchor=\"middle\" font-family=\"sans-serif\">c² = a² + b²<\/text><\/svg>"},{"h":"Hledáš přeponu — sčítáš","t":"Známe obě odvěsny a hledáme přeponu? Umocni je, sečti a odmocni.\n\nVýsledek musí být větší než každá odvěsna. Když ti vyjde menší, něco je špatně.","f":"a = 3, b = 4\nc² = 9 + 16 = 25\nc = 5"},{"h":"Hledáš odvěsnu — odčítáš","t":"Známe přeponu a jednu odvěsnu? Pak od čtverce přepony ODEČTI čtverec známé odvěsny.\n\nTady se plete znaménko nejčastěji. Pomůcka: odvěsna musí vyjít menší než přepona.","f":"c = 13, a = 5\nb² = 169 − 25 = 144\nb = 12"},{"h":"Slavné trojice, které se vyplatí znát","t":"Některé trojice čísel vycházejí pěkně a v testech se objevují pořád dokola.\n\nZnáš-li je, ušetříš čas i chyby. Platí i jejich násobky — třeba 6, 8, 10.","f":"3 – 4 – 5\n5 – 12 – 13\n8 – 15 – 17\n(a jejich násobky)"},{"h":"Úhlopříčka obdélníku","t":"Úhlopříčka rozdělí obdélník na dva pravoúhlé trojúhelníky. Strany obdélníku jsou odvěsny, úhlopříčka je přepona.\n\nU čtverce se strany rovnají, takže úhlopříčka je strana krát odmocnina ze dvou.","f":"obdélník 6 × 8\nu² = 36 + 64 = 100\nu = 10"},{"h":"Tělesová úhlopříčka kvádru","t":"V kvádru se věta používá dvakrát za sebou. Nejdřív spočítáš úhlopříčku podstavy, ta se pak stane odvěsnou.\n\nExistuje i zkratka — jeden vzorec pro všechny tři hrany najednou.","f":"nejdřív: u² = a² + b²\npotom:   U² = u² + c²\nzkratka: U² = a² + b² + c²"}],"ulohy":[{"id":"mat-pythagoras-ff4b14c5","q":"Odvěsny pravoúhlého trojúhelníku měří 6 cm a 8 cm. Jak dlouhá je přepona? (v cm)","typ":"open","kroky":[{"n":"Krok 1 — co hledáme","d":"Známe obě odvěsny, hledáme přeponu. Budeme tedy sčítat.","f":"c² = a² + b²"},{"n":"Krok 2 — dosaď a umocni","d":"","f":"c² = 6² + 8² = 36 + 64 = 100"},{"n":"Krok 3 — odmocni","d":"","f":"c = √100 = 10 cm"},{"n":"Kontrola","d":"Je to násobek slavné trojice 3–4–5, jen dvakrát větší. Sedí.","f":"10 cm"}],"vys":"10 cm","odp":"10"},{"id":"mat-pythagoras-5ee1a6dc","q":"Přepona měří 13 cm, jedna odvěsna 5 cm. Jak dlouhá je druhá odvěsna? (v cm)","typ":"open","kroky":[{"n":"Krok 1 — hledáme odvěsnu, takže odčítáme","d":"Přepona je vždy ta největší strana, tedy 13 cm.","f":"b² = c² − a²"},{"n":"Krok 2 — dosaď","d":"","f":"b² = 13² − 5² = 169 − 25 = 144"},{"n":"Krok 3 — odmocni","d":"","f":"b = √144 = 12 cm"},{"n":"Kontrola","d":"Trojice 5–12–13 je jedna z těch, které se vyplatí znát zpaměti.","f":"12 cm"}],"vys":"12 cm","odp":"12"},{"id":"mat-pythagoras-87bf3766","q":"Obdélník má rozměry 9 cm a 12 cm. Jak dlouhá je jeho úhlopříčka? (v cm)","typ":"open","kroky":[{"n":"Krok 1 — najdi pravoúhlý trojúhelník","d":"Úhlopříčka rozdělí obdélník na dva pravoúhlé trojúhelníky. Strany obdélníku jsou odvěsny.","f":"a = 9, b = 12"},{"n":"Krok 2 — použij větu","d":"","f":"u² = 81 + 144 = 225"},{"n":"Krok 3 — odmocni","d":"","f":"u = √225 = 15 cm"},{"n":"Poznámka","d":"Je to trojnásobek trojice 3–4–5.","f":"15 cm"}],"vys":"15 cm","odp":"15"},{"id":"mat-pythagoras-ff3c736a","q":"Čtverec má stranu 5 cm. Jaký je obsah čtverce sestrojeného nad jeho úhlopříčkou? (v cm²)","typ":"open","kroky":[{"n":"Krok 1 — spočítej druhou mocninu úhlopříčky","d":"Nemusíš vůbec odmocňovat! Obsah čtverce nad úhlopříčkou je právě u².","f":"u² = 5² + 5² = 50"},{"n":"Krok 2 — a to je rovnou výsledek","d":"Obsah čtverce se stranou u je u², což už máme.","f":"S = 50 cm²"},{"n":"Chytrá zkratka","d":"Kdybys počítala u = √50 a pak to zase umocnila, dostaneš totéž — jen s většími čísly a rizikem zaokrouhlení.","f":"50 cm²"}],"vys":"50 cm²","odp":"50"},{"id":"mat-pythagoras-6b071d1d","q":"Krychle má hranu 6 cm. Jak dlouhá je její stěnová úhlopříčka? (zaokrouhli na desetiny cm)","typ":"open","kroky":[{"n":"Krok 1 — stěna krychle je čtverec","d":"Stěnová úhlopříčka je úhlopříčka čtverce o straně 6.","f":"u² = 6² + 6² = 72"},{"n":"Krok 2 — odmocni","d":"√72 je mezi 8 a 9, protože 8² = 64 a 9² = 81.","f":"u = √72 ≈ 8,49"},{"n":"Krok 3 — zaokrouhli","d":"","f":"u ≈ 8,5 cm"}],"vys":"přibližně 8,5 cm","odp":"8.5"},{"id":"mat-pythagoras-92a1dd5f","q":"Kvádr má hrany 3 cm, 4 cm a 12 cm. Jak dlouhá je tělesová úhlopříčka? (v cm)","typ":"open","kroky":[{"n":"Krok 1 — úhlopříčka podstavy","d":"Nejdřív spočítej úhlopříčku obdélníkové podstavy 3 × 4.","f":"u² = 9 + 16 = 25,  u = 5"},{"n":"Krok 2 — druhý pravoúhlý trojúhelník","d":"Úhlopříčka podstavy (5) a výška (12) jsou odvěsny nového trojúhelníku. Tělesová úhlopříčka je jeho přepona.","f":"U² = 5² + 12² = 25 + 144 = 169"},{"n":"Krok 3 — odmocni","d":"","f":"U = 13 cm"},{"n":"Zkratka","d":"Šlo to i najednou: U² = 3² + 4² + 12² = 9 + 16 + 144 = 169.","f":"13 cm"}],"vys":"13 cm","odp":"13"},{"id":"mat-pythagoras-35909ab4","q":"Žebřík dlouhý 5 m je opřený o zeď. Jeho pata je 3 m od zdi. Do jaké výšky sahá? (v m)","typ":"open","kroky":[{"n":"Krok 1 — nakresli si to","d":"Zeď je svislá, země vodorovná — mezi nimi je pravý úhel. Žebřík je přepona.","f":"c = 5 (žebřík), a = 3 (vzdálenost)"},{"n":"Krok 2 — hledáme odvěsnu, tedy odčítáme","d":"","f":"b² = 25 − 9 = 16"},{"n":"Krok 3 — odmocni","d":"","f":"b = 4 m"},{"n":"Ověř úsudkem","d":"Výška musí být menší než délka žebříku. 4 < 5, sedí.","f":"4 m"}],"vys":"4 m","odp":"4"},{"id":"mat-pythagoras-c5241acd","q":"Rozhodni, zda trojúhelník se stranami 7, 24 a 25 je pravoúhlý.","typ":"choice","kroky":[{"n":"Krok 1 — najdi nejdelší stranu","d":"Kdyby byl pravoúhlý, byla by přeponou. Tady je to 25.","f":"c = 25, a = 7, b = 24"},{"n":"Krok 2 — spočítej obě strany rovnice zvlášť","d":"Vlevo čtverec přepony, vpravo součet čtverců odvěsen.","f":"25² = 625\n7² + 24² = 49 + 576 = 625"},{"n":"Krok 3 — porovnej","d":"Obě strany se rovnají, věta platí. To znamená, že trojúhelník pravoúhlý JE.","f":"625 = 625  →  ano ✓"}],"vys":"Ano, je pravoúhlý","moz":["Ano, je pravoúhlý","Ne, není pravoúhlý","Nelze rozhodnout","Je rovnostranný"],"spr":0},{"id":"mat-pythagoras-48256c36","q":"Rovnoramenný trojúhelník má základnu 16 cm a ramena 10 cm. Jak vysoký je? (v cm)","typ":"open","kroky":[{"n":"Krok 1 — výška půlí základnu","d":"U rovnoramenného trojúhelníku spadne výška přesně doprostřed základny a vytvoří pravý úhel.","f":"polovina základny = 8 cm"},{"n":"Krok 2 — najdi pravoúhlý trojúhelník","d":"Rameno je přepona (10), polovina základny odvěsna (8), výška druhá odvěsna.","f":"v² = 10² − 8²"},{"n":"Krok 3 — dopočítej","d":"","f":"v² = 100 − 64 = 36\nv = 6 cm"}],"vys":"6 cm","odp":"6"},{"id":"mat-pythagoras-1e540691","q":"Televize má úhlopříčku 100 cm a šířku 80 cm. Jak vysoká je obrazovka? (v cm)","typ":"open","kroky":[{"n":"Krok 1 — obrazovka je obdélník","d":"Úhlopříčka je přepona, šířka a výška jsou odvěsny.","f":"c = 100, a = 80"},{"n":"Krok 2 — odčítej","d":"","f":"b² = 10 000 − 6 400 = 3 600"},{"n":"Krok 3 — odmocni","d":"","f":"b = 60 cm"},{"n":"Poznámka","d":"Opět násobek trojice 3–4–5, tentokrát dvacetkrát.","f":"60 cm"}],"vys":"60 cm","odp":"60"}]},{"id":"mat-obsahy","predmet":"M","tema":"obvod-obsah","nazev":"Obvody a obsahy rovinných útvarů","popis":"Trojúhelník, obdélník, lichoběžník a hlavně kruh. Včetně složených obrazců, které test miluje.","vyklad":[{"h":"Obvod versus obsah","t":"Obvod je délka čáry kolem dokola — měří se v centimetrech.\n\nObsah je plocha uvnitř — měří se v centimetrech čtverečních. Když si spleteš jednotku, poznáš, že jsi spletla i vzorec.","f":"obvod → cm, m, km\nobsah → cm², m², km²"},{"h":"Obdélník a čtverec","t":"U obdélníku obvod sečteš dvě strany a vynásobíš dvěma, obsah vynásobíš strany.\n\nČtverec je jen zvláštní obdélník, kde jsou obě strany stejné.","f":"obdélník: o = 2(a + b),  S = a·b\nčtverec:  o = 4a,  S = a²"},{"h":"Trojúhelník","t":"Obsah trojúhelníku je polovina součinu strany a výšky K TÉ STRANĚ.\n\nVýška musí být kolmá právě k té straně, kterou jsi použila. Tady se chybuje.","f":"S = a · v / 2"},{"h":"Rovnoběžník a lichoběžník","t":"U rovnoběžníku je obsah strana krát výška — bez dělení dvěma.\n\nU lichoběžníku sečteš obě rovnoběžné strany, vynásobíš výškou a vydělíš dvěma.","f":"rovnoběžník: S = a · v\nlichoběžník: S = (a + c) · v / 2"},{"h":"Kruh a kružnice","t":"Kružnice je jen ta čára, kruh je i s vnitřkem. Proto má kružnice délku a kruh obsah.\n\nČíslo π je přibližně 3,14. Průměr je dvojnásobek poloměru.","f":"délka kružnice: o = 2πr = πd\nobsah kruhu:    S = πr²"},{"h":"Pozor na poloměr a průměr","t":"Nejčastější chyba v celém okruhu: do vzorce dosadíš průměr místo poloměru.\n\nKdyž zadání říká „kruh o průměru 10 cm“, do vzorce patří pětka, ne desítka.","f":"d = 10 cm  →  r = 5 cm\nS = π·5² = 78,5 cm²"},{"h":"Složené obrazce","t":"Složitý tvar rozděl na jednoduché části — obdélníky, trojúhelníky, půlkruhy.\n\nObsahy pak sečti. Když je v obrazci díra, obsah díry naopak odečti.","f":"S = S₁ + S₂ − S₃"},{"h":"Vztah mezi rozměry a obsahem","t":"Zvětšíš-li stranu dvakrát, obsah se zvětší čtyřikrát. Trojnásobná strana znamená devítinásobný obsah.\n\nJe to proto, že obsah závisí na druhé mocnině rozměru.","f":"strana ·2  →  obsah ·4\nstrana ·3  →  obsah ·9"}],"ulohy":[{"id":"mat-obsahy-6b11ab0a","q":"Obdélník má strany 7 cm a 12 cm. Jaký je jeho obsah? (v cm²)","typ":"open","kroky":[{"n":"Krok 1 — vzorec","d":"","f":"S = a · b"},{"n":"Krok 2 — dosaď","d":"","f":"S = 7 · 12 = 84 cm²"}],"vys":"84 cm²","odp":"84"},{"id":"mat-obsahy-5d904d65","q":"Trojúhelník má stranu 10 cm a k ní výšku 6 cm. Jaký je jeho obsah? (v cm²)","typ":"open","kroky":[{"n":"Krok 1 — vzorec","d":"Obsah trojúhelníku je polovina součinu strany a příslušné výšky.","f":"S = a · v / 2"},{"n":"Krok 2 — dosaď","d":"","f":"S = 10 · 6 / 2"},{"n":"Krok 3 — dopočítej","d":"","f":"S = 30 cm²"}],"vys":"30 cm²","odp":"30"},{"id":"mat-obsahy-a5b09bb4","q":"Kruh má poloměr 5 cm. Jaký je jeho obsah? (π ≈ 3,14, výsledek v cm²)","typ":"open","kroky":[{"n":"Krok 1 — vzorec pro obsah kruhu","d":"","f":"S = π · r²"},{"n":"Krok 2 — nejdřív umocni poloměr","d":"Pozor na pořadí — umocňuje se jen r, ne celý součin.","f":"r² = 25"},{"n":"Krok 3 — vynásob pí","d":"","f":"S = 3,14 · 25 = 78,5 cm²"}],"vys":"78,5 cm²","odp":"78.5"},{"id":"mat-obsahy-39d35b83","q":"Kruh má průměr 8 cm. Jaký je jeho obsah? (π ≈ 3,14, v cm²)","typ":"open","kroky":[{"n":"Krok 1 — pozor, zadaný je PRŮMĚR","d":"Do vzorce patří poloměr. Ten je poloviční.","f":"r = 8 : 2 = 4 cm"},{"n":"Krok 2 — umocni poloměr","d":"","f":"r² = 16"},{"n":"Krok 3 — vynásob pí","d":"","f":"S = 3,14 · 16 = 50,24 cm²"},{"n":"Poznámka","d":"Kdybys dosadila osmičku, vyšlo by 200,96 — čtyřikrát víc. To je typická chyba.","f":"50,24 cm²"}],"vys":"50,24 cm²","odp":"50.24"},{"id":"mat-obsahy-54b29597","q":"Jaká je délka kružnice s poloměrem 10 cm? (π ≈ 3,14, v cm)","typ":"open","kroky":[{"n":"Krok 1 — vzorec pro délku kružnice","d":"","f":"o = 2 · π · r"},{"n":"Krok 2 — dosaď","d":"","f":"o = 2 · 3,14 · 10"},{"n":"Krok 3 — dopočítej","d":"","f":"o = 62,8 cm"}],"vys":"62,8 cm","odp":"62.8"},{"id":"mat-obsahy-c0f12c2b","q":"Lichoběžník má rovnoběžné strany 8 cm a 12 cm a výšku 5 cm. Jaký je jeho obsah? (v cm²)","typ":"open","kroky":[{"n":"Krok 1 — vzorec","d":"Sečti obě rovnoběžné strany, vynásob výškou a vyděl dvěma.","f":"S = (a + c) · v / 2"},{"n":"Krok 2 — sečti základny","d":"","f":"8 + 12 = 20"},{"n":"Krok 3 — dopočítej","d":"","f":"S = 20 · 5 / 2 = 50 cm²"}],"vys":"50 cm²","odp":"50"},{"id":"mat-obsahy-e7c5a046","q":"Čtverec má obvod 36 cm. Jaký je jeho obsah? (v cm²)","typ":"open","kroky":[{"n":"Krok 1 — z obvodu urči stranu","d":"Čtverec má čtyři stejné strany.","f":"a = 36 : 4 = 9 cm"},{"n":"Krok 2 — spočítej obsah","d":"","f":"S = 9² = 81 cm²"}],"vys":"81 cm²","odp":"81"},{"id":"mat-obsahy-c170fc08","q":"Zahrada je obdélník 20 m × 15 m. Uprostřed je kruhový bazén o poloměru 3 m. Jaká plocha zahrady zbývá? (π ≈ 3,14, v m²)","typ":"open","kroky":[{"n":"Krok 1 — obsah celé zahrady","d":"","f":"S₁ = 20 · 15 = 300 m²"},{"n":"Krok 2 — obsah bazénu","d":"","f":"S₂ = 3,14 · 3² = 3,14 · 9 = 28,26 m²"},{"n":"Krok 3 — odečti díru","d":"Bazén zahradu ubírá, proto odčítáme.","f":"S = 300 − 28,26 = 271,74 m²"}],"vys":"271,74 m²","odp":"271.74"},{"id":"mat-obsahy-502a05d7","q":"Strana čtverce se zvětší třikrát. Kolikrát se zvětší jeho obsah?","typ":"choice","kroky":[{"n":"Krok 1 — zkus to na číslech","d":"Vezmi stranu 2, po zvětšení bude 6.","f":"původní S = 4\nnová S = 36"},{"n":"Krok 2 — porovnej","d":"","f":"36 : 4 = 9"},{"n":"Krok 3 — proč to tak je","d":"Obsah závisí na druhé mocnině strany. Zvětší-li se strana k-krát, obsah se zvětší k²-krát.","f":"3² = 9  →  devětkrát"}],"vys":"Devětkrát","moz":["Devětkrát","Třikrát","Šestkrát","Dvakrát"],"spr":0},{"id":"mat-obsahy-ff1934da","q":"Obdélníková místnost má obsah 24 m² a jednu stranu 6 m. Jaký je její obvod? (v m)","typ":"open","kroky":[{"n":"Krok 1 — dopočítej druhou stranu","d":"Obsah je součin stran, takže druhou stranu získáš dělením.","f":"b = 24 : 6 = 4 m"},{"n":"Krok 2 — spočítej obvod","d":"","f":"o = 2 · (6 + 4) = 2 · 10"},{"n":"Krok 3 — výsledek","d":"","f":"o = 20 m"}],"vys":"20 m","odp":"20"}]},{"id":"mat-telesa","predmet":"M","tema":"telesa","nazev":"Objemy a povrchy těles","popis":"Krychle, kvádr, válec, jehlan, kužel a koule. Vzorce i praktické úlohy s převody jednotek.","vyklad":[{"h":"Objem a povrch — dvě různé věci","t":"Objem říká, kolik se dovnitř vejde. Měří se v krychlových jednotkách.\n\nPovrch je součet obsahů všech ploch zvenku. Měří se ve čtverečních jednotkách — je to vlastně rozbalená síť tělesa.","f":"objem → cm³, m³, litry\npovrch → cm², m²"},{"h":"Krychle a kvádr","t":"U kvádru vynásobíš všechny tři hrany. Povrch je součet obsahů šesti stěn, které jsou po dvou stejné.\n\nKrychle je kvádr se všemi hranami stejnými.","f":"kvádr: V = a·b·c\n       S = 2(ab + bc + ac)\nkrychle: V = a³,  S = 6a²"},{"h":"Válec","t":"Válec má dvě kruhové podstavy a jeden zakřivený plášť.\n\nObjem je obsah podstavy krát výška. Plášť po rozvinutí tvoří obdélník, jehož jedna strana je obvod kruhu.","f":"V = π r² · v\nS = 2πr² + 2πr·v"},{"h":"Jehlan a kužel — nezapomeň na třetinu","t":"Špičatá tělesa mají objem přesně třikrát menší než hranol nebo válec se stejnou podstavou a výškou.\n\nTa třetina je to, co se u nich nejčastěji zapomíná.","f":"jehlan: V = S_podstavy · v / 3\nkužel:  V = π r² · v / 3"},{"h":"Výška versus strana u kužele","t":"U kužele rozlišuj výšku (kolmo od vrcholu do středu podstavy) a stranu (od vrcholu k okraji podstavy).\n\nJsou spojené Pythagorovou větou. Do objemu patří výška, do pláště strana.","f":"s² = r² + v²\nplášť kužele: π r · s"},{"h":"Koule","t":"U koule si stačí zapamatovat dva vzorce. Oba obsahují poloměr na třetí, respektive na druhou.\n\nPomůcka na objem: čtyři třetiny pí er na třetí.","f":"V = 4/3 · π r³\nS = 4 π r²"},{"h":"Převody objemových jednotek","t":"Tohle je v testu častější zdroj chyb než samotné vzorce.\n\nJeden litr je krychle o hraně 10 cm, tedy tisíc centimetrů krychlových. Krychlový metr je tisíc litrů.","f":"1 l = 1 dm³ = 1 000 cm³\n1 m³ = 1 000 l\n1 hl = 100 l"},{"h":"Síť tělesa","t":"Síť je těleso rozstřižené a rozložené do roviny. Její obsah je přesně povrch tělesa.\n\nU válce se plášť rozvine na obdélník o rozměrech 2πr a v — to je dobré si představit.","f":"obsah sítě = povrch tělesa"}],"ulohy":[{"id":"mat-telesa-63c44af3","q":"Krychle má hranu 4 cm. Jaký je její objem? (v cm³)","typ":"open","kroky":[{"n":"Krok 1 — vzorec","d":"Objem krychle je hrana na třetí.","f":"V = a³"},{"n":"Krok 2 — dosaď","d":"","f":"V = 4·4·4 = 64 cm³"}],"vys":"64 cm³","odp":"64"},{"id":"mat-telesa-6787cff8","q":"Krychle má hranu 5 cm. Jaký je její povrch? (v cm²)","typ":"open","kroky":[{"n":"Krok 1 — kolik má krychle stěn","d":"Šest, všechny stejné čtverce.","f":"S = 6 · a²"},{"n":"Krok 2 — obsah jedné stěny","d":"","f":"a² = 25 cm²"},{"n":"Krok 3 — vynásob šesti","d":"","f":"S = 150 cm²"}],"vys":"150 cm²","odp":"150"},{"id":"mat-telesa-28304d5e","q":"Kvádr má hrany 3 cm, 4 cm a 10 cm. Jaký je jeho objem? (v cm³)","typ":"open","kroky":[{"n":"Krok 1 — vzorec","d":"","f":"V = a · b · c"},{"n":"Krok 2 — vynásob","d":"","f":"V = 3 · 4 · 10 = 120 cm³"}],"vys":"120 cm³","odp":"120"},{"id":"mat-telesa-2640cf59","q":"Válec má poloměr podstavy 3 cm a výšku 10 cm. Jaký je jeho objem? (π ≈ 3,14, v cm³)","typ":"open","kroky":[{"n":"Krok 1 — obsah podstavy","d":"Podstava je kruh.","f":"S = 3,14 · 3² = 3,14 · 9 = 28,26 cm²"},{"n":"Krok 2 — vynásob výškou","d":"","f":"V = 28,26 · 10"},{"n":"Krok 3 — výsledek","d":"","f":"V = 282,6 cm³"}],"vys":"282,6 cm³","odp":"282.6"},{"id":"mat-telesa-031e82e0","q":"Kolik litrů vody se vejde do akvária o rozměrech 50 cm × 30 cm × 40 cm?","typ":"open","kroky":[{"n":"Krok 1 — spočítej objem v cm³","d":"","f":"V = 50 · 30 · 40 = 60 000 cm³"},{"n":"Krok 2 — převeď na litry","d":"Tisíc centimetrů krychlových je jeden litr.","f":"60 000 : 1 000 = 60 l"},{"n":"Poznámka","d":"Převod objemových jednotek se dělá tisícem, ne desítkou. Tohle je v testech oblíbená past.","f":"60 litrů"}],"vys":"60 litrů","odp":"60"},{"id":"mat-telesa-c353b87b","q":"Jehlan má obsah podstavy 30 cm² a výšku 9 cm. Jaký je jeho objem? (v cm³)","typ":"open","kroky":[{"n":"Krok 1 — vzorec s třetinou","d":"Jehlan má třetinový objem oproti hranolu se stejnou podstavou a výškou.","f":"V = S · v / 3"},{"n":"Krok 2 — dosaď","d":"","f":"V = 30 · 9 / 3"},{"n":"Krok 3 — dopočítej","d":"","f":"V = 270 : 3 = 90 cm³"}],"vys":"90 cm³","odp":"90"},{"id":"mat-telesa-38c1e968","q":"Kužel má poloměr podstavy 6 cm a výšku 8 cm. Jak dlouhá je jeho strana? (v cm)","typ":"open","kroky":[{"n":"Krok 1 — najdi pravoúhlý trojúhelník","d":"Poloměr, výška a strana kužele tvoří pravoúhlý trojúhelník. Strana je přepona.","f":"s² = r² + v²"},{"n":"Krok 2 — dosaď","d":"","f":"s² = 36 + 64 = 100"},{"n":"Krok 3 — odmocni","d":"","f":"s = 10 cm"}],"vys":"10 cm","odp":"10"},{"id":"mat-telesa-bc04f7b2","q":"Koule má poloměr 3 cm. Jaký je její povrch? (π ≈ 3,14, v cm²)","typ":"open","kroky":[{"n":"Krok 1 — vzorec pro povrch koule","d":"","f":"S = 4 · π · r²"},{"n":"Krok 2 — umocni poloměr","d":"","f":"r² = 9"},{"n":"Krok 3 — dopočítej","d":"","f":"S = 4 · 3,14 · 9 = 113,04 cm²"}],"vys":"113,04 cm²","odp":"113.04"},{"id":"mat-telesa-388c7bc4","q":"Bazén má tvar kvádru 10 m × 5 m × 2 m. Kolik krychlových metrů vody se do něj vejde?","typ":"open","kroky":[{"n":"Krok 1 — objem kvádru","d":"","f":"V = 10 · 5 · 2 = 100 m³"},{"n":"Krok 2 — kolik je to litrů","d":"Pro představu: krychlový metr je tisíc litrů.","f":"100 m³ = 100 000 litrů"}],"vys":"100 m³ (tedy 100 000 litrů)","odp":"100"},{"id":"mat-telesa-fa2747ed","q":"Kolik hran má kvádr?","typ":"choice","kroky":[{"n":"Krok 1 — představ si krabici","d":"Kvádr má tři různé délky hran a od každé čtyři kusy.","f":"3 · 4 = 12"},{"n":"Krok 2 — a co ostatní","d":"Vrcholů je 8 a stěn 6. Ty se s hranami často pletou.","f":"hrany 12, vrcholy 8, stěny 6"}],"vys":"12 hran","moz":["12","8","6","10"],"spr":0},{"id":"mat-telesa-6ae6b65f","q":"Krychle má povrch 96 cm². Jaká je délka její hrany? (v cm)","typ":"open","kroky":[{"n":"Krok 1 — z povrchu na jednu stěnu","d":"Povrch je šest stejných čtverců.","f":"96 : 6 = 16 cm²"},{"n":"Krok 2 — ze stěny na hranu","d":"Obsah stěny je a², takže odmocni.","f":"a = √16 = 4 cm"},{"n":"Zkouška","d":"6 · 4² = 6 · 16 = 96. Sedí.","f":"4 cm"}],"vys":"4 cm","odp":"4"}]},{"id":"mat-funkce","predmet":"M","tema":"jednotky-grafy","nazev":"Funkce, závislosti a grafy","popis":"Lineární funkce, čtení z grafu a tabulky, přímá i nepřímá úměrnost jako funkce.","vyklad":[{"h":"Co je funkce","t":"Funkce je předpis, který každé hodnotě x přiřadí právě jednu hodnotu y.\n\nMůže být zapsaná rovnicí, tabulkou nebo grafem. Všechny tři zápisy říkají totéž.","f":"y = 2x + 1\nx = 3  →  y = 7"},{"h":"Lineární funkce a její graf","t":"Lineární funkce má tvar y = ax + b a jejím grafem je vždycky přímka.\n\nČíslo a určuje sklon, číslo b říká, kde přímka protíná svislou osu.","f":"y = 2x + 1\nsklon 2, protíná osu y v bodě 1"},{"h":"Rostoucí, nebo klesající?","t":"Rozhoduje znaménko u čísla a.\n\nKladné a znamená, že přímka stoupá zleva doprava. Záporné a znamená, že klesá. Nulové a dá vodorovnou přímku.","f":"y = 3x − 2   → rostoucí\ny = −3x + 2  → klesající\ny = 5        → vodorovná"},{"h":"Jak sestrojit graf","t":"Přímka je určená dvěma body. Vyber si dvě jednoduchá x, dopočítej y a body spoj.\n\nNejjednodušší bývá x = 0 a x = 1, případně x = 0 a takové x, kde vyjde y = 0.","f":"y = 2x − 4\nx = 0 → y = −4\nx = 2 → y = 0"},{"h":"Leží bod na grafu?","t":"Souřadnice bodu prostě dosaď do rovnice. Vyjde-li pravdivá rovnost, bod na grafu leží.\n\nPrvní číslo v hranaté závorce je x, druhé y.","f":"Leží [3, 5] na y = 2x − 1?\n5 = 2·3 − 1 = 5  ✓ ano"},{"h":"Přímá a nepřímá úměrnost jako funkce","t":"Přímá úměrnost je zvláštní lineární funkce y = kx — bez absolutního členu, takže prochází počátkem.\n\nNepřímá úměrnost má tvar y = k/x a jejím grafem je hyperbola.","f":"přímá:   y = k·x  (přímka počátkem)\nnepřímá: y = k/x  (hyperbola)"},{"h":"Čtení z grafu","t":"V testu se často jen odečítá. Hledáš-li y pro dané x, jdi od osy x nahoru ke grafu a pak doleva na osu y.\n\nOpačným směrem to funguje stejně.","f":"x → nahoru ke grafu → doleva na y"}],"ulohy":[{"id":"mat-funkce-d68c220a","q":"Vypočti hodnotu funkce y = 3x − 5 pro x = 4.","typ":"open","kroky":[{"n":"Krok 1 — dosaď za x","d":"","f":"y = 3·4 − 5"},{"n":"Krok 2 — nejdřív násobení","d":"","f":"y = 12 − 5 = 7"}],"vys":"y = 7","odp":"7"},{"id":"mat-funkce-9da12c2e","q":"Pro kterou hodnotu x je funkce y = 2x + 6 rovna nule?","typ":"open","kroky":[{"n":"Krok 1 — dosaď nulu za y","d":"Ptáme se, kdy graf protne vodorovnou osu.","f":"0 = 2x + 6"},{"n":"Krok 2 — vyřeš rovnici","d":"","f":"2x = −6"},{"n":"Krok 3 — dopočítej","d":"","f":"x = −3"}],"vys":"x = −3","odp":"-3"},{"id":"mat-funkce-9a020342","q":"Je funkce y = −4x + 1 rostoucí, nebo klesající?","typ":"choice","kroky":[{"n":"Krok 1 — najdi číslo u x","d":"To je koeficient a a jen on rozhoduje.","f":"a = −4"},{"n":"Krok 2 — podívej se na znaménko","d":"Záporné číslo znamená klesající funkci — čím větší x, tím menší y.","f":"a < 0  →  klesající"},{"n":"Ověř na číslech","d":"Pro x = 0 je y = 1, pro x = 1 je y = −3. y opravdu klesá.","f":"klesající ✓"}],"vys":"Klesající","moz":["Klesající","Rostoucí","Konstantní","Nelze určit"],"spr":0},{"id":"mat-funkce-277d24ee","q":"V kterém bodě protíná graf funkce y = 5x − 10 svislou osu y?","typ":"choice","kroky":[{"n":"Krok 1 — co znamená protnout osu y","d":"Na svislé ose je x vždycky nula.","f":"x = 0"},{"n":"Krok 2 — dosaď","d":"","f":"y = 5·0 − 10 = −10"},{"n":"Krok 3 — zapiš bod","d":"Souřadnice se píší jako [x, y].","f":"[0, −10]"}],"vys":"[0, −10]","moz":["[0, −10]","[2, 0]","[0, 5]","[−10, 0]"],"spr":0},{"id":"mat-funkce-d64a4b5f","q":"Leží bod [2, 7] na grafu funkce y = 3x + 1?","typ":"choice","kroky":[{"n":"Krok 1 — rozděl souřadnice","d":"První číslo je x, druhé y.","f":"x = 2, y = 7"},{"n":"Krok 2 — dosaď do rovnice","d":"","f":"3·2 + 1 = 7"},{"n":"Krok 3 — porovnej","d":"Vyšlo přesně 7, což se rovná souřadnici y. Bod tedy na grafu leží.","f":"7 = 7  ✓"}],"vys":"Ano, leží","moz":["Ano, leží","Ne, neleží","Nelze rozhodnout","Leží jen část"],"spr":0},{"id":"mat-funkce-ac054d84","q":"Taxi má nástupní sazbu 40 Kč a za každý kilometr 25 Kč. Kolik zaplatíš za 12 km?","typ":"open","kroky":[{"n":"Krok 1 — sestav funkci","d":"Nástupní sazba se platí jednou, kilometry se násobí.","f":"y = 25x + 40"},{"n":"Krok 2 — dosaď 12 km","d":"","f":"y = 25·12 + 40"},{"n":"Krok 3 — dopočítej","d":"","f":"y = 300 + 40 = 340 Kč"}],"vys":"340 Kč","odp":"340"},{"id":"mat-funkce-7750a39c","q":"Které z funkcí je přímou úměrností?","typ":"choice","kroky":[{"n":"Krok 1 — co musí přímá úměrnost splňovat","d":"Musí mít tvar y = kx, tedy bez přičítaného čísla.","f":"y = k·x"},{"n":"Krok 2 — projdi možnosti","d":"y = 4x + 2 má navíc dvojku, takže neprochází počátkem. y = 4/x je nepřímá úměrnost. y = x² není lineární.","f":"y = 4x  ✓"},{"n":"Kontrola","d":"U přímé úměrnosti musí platit, že pro x = 0 je i y = 0. To splňuje jen první.","f":"y = 4x"}],"vys":"y = 4x","moz":["y = 4x","y = 4x + 2","y = 4/x","y = x² "],"spr":0},{"id":"mat-funkce-c2c32571","q":"V tabulce je: x = 2 → y = 10, x = 5 → y = 25. O jakou závislost jde?","typ":"choice","kroky":[{"n":"Krok 1 — spočítej podíl y ku x","d":"U přímé úměrnosti musí být stejný v obou sloupcích.","f":"10 : 2 = 5\n25 : 5 = 5"},{"n":"Krok 2 — podíly se shodují","d":"Koeficient je 5, závislost je přímá úměrnost.","f":"y = 5x"},{"n":"Kontrola nepřímé","d":"U nepřímé by musel být stálý součin. 2·10 = 20, ale 5·25 = 125. Ne  180°"},{"n":"Krok 2 — spočítej díly","d":"","f":"1 + 2 + 3 = 6 dílů"},{"n":"Krok 3 — hodnota jednoho dílu","d":"","f":"180 : 6 = 30°"},{"n":"Krok 4 — největší má tři díly","d":"","f":"3 · 30 = 90°"},{"n":"Zajímavost","d":"Trojúhelník je tedy pravoúhlý, úhly jsou 30°, 60° a 90°.","f":"90°"}],"vys":"90°","odp":"90"},{"id":"mat-geometrie-8776b1bd","q":"Dva úhly v trojúhelníku měří 47° a 68°. Kolik stupňů má třetí?","typ":"open","kroky":[{"n":"Krok 1 — sečti známé úhly","d":"","f":"47 + 68 = 115°"},{"n":"Krok 2 — odečti od 180","d":"","f":"180 − 115 = 65°"}],"vys":"65°","odp":"65"},{"id":"mat-geometrie-e275b534","q":"Trojúhelníky jsou podobné s koeficientem 3. Nejmenší strana menšího měří 4 cm. Kolik měří odpovídající strana většího? (v cm)","typ":"open","kroky":[{"n":"Krok 1 — co znamená koeficient podobnosti","d":"Každá strana většího trojúhelníku je třikrát delší.","f":"k = 3"},{"n":"Krok 2 — vynásob","d":"","f":"4 · 3 = 12 cm"}],"vys":"12 cm","odp":"12"},{"id":"mat-geometrie-8e29b19b","q":"Zvětšíme-li rozměry čtverce dvakrát, kolikrát se zvětší jeho obsah?","typ":"choice","kroky":[{"n":"Krok 1 — pravidlo o podobnosti","d":"Délky se mění k-krát, obsah k²-krát.","f":"k = 2  →  k² = 4"},{"n":"Krok 2 — ověř na číslech","d":"Čtverec 3×3 má obsah 9. Po zvětšení 6×6 má obsah 36.","f":"36 : 9 = 4  ✓"}],"vys":"Čtyřikrát","moz":["Čtyřikrát","Dvakrát","Osmkrát","Šestnáctkrát"],"spr":0},{"id":"mat-geometrie-cf125a6d","q":"Podle které věty jsou shodné trojúhelníky, u nichž známe tři dvojice stejně dlouhých stran?","typ":"choice","kroky":[{"n":"Krok 1 — přelož si zkratky","d":"Písmeno s znamená stranu, písmeno u úhel.","f":"s = strana, u = úhel"},{"n":"Krok 2 — tři strany","d":"Tři strany za sebou dávají zkratku sss.","f":"sss ✓"},{"n":"Pozor","d":"Věta uu patří k PODOBNOSTI, ne ke shodnosti. Dva stejné úhly zaručí stejný tvar, ne velikost.","f":"sss"}],"vys":"Podle věty sss","moz":["sss","sus","usu","uu"],"spr":0},{"id":"mat-geometrie-8c3d1f40","q":"Kolik tečen lze vést ke kružnici z bodu ležícího vně kružnice?","typ":"choice","kroky":[{"n":"Krok 1 — představ si to","d":"Z bodu venku se dá kružnice obejít z jedné i z druhé strany.","f":"dvě možnosti"},{"n":"Krok 2 — proč právě dvě","d":"Thaletova kružnice nad úsečkou od středu k bodu protne kružnici právě ve dvou bodech.","f":"2 body dotyku → 2 tečny"},{"n":"Pro srovnání","d":"Z bodu NA kružnici vede jediná tečna, z bodu uvnitř žádná.","f":"dvě tečny"}],"vys":"Dvě tečny","moz":["Dvě","Jednu","Žádnou","Nekonečně mnoho"],"spr":0},{"id":"mat-geometrie-e3512297","q":"Rovnostranný trojúhelník má všechny úhly stejné. Kolik stupňů měří každý?","typ":"open","kroky":[{"n":"Krok 1 — součet je vždy 180","d":"","f":"α + β + γ = 180°"},{"n":"Krok 2 — všechny jsou stejné","d":"Vyděl součet třemi.","f":"180 : 3 = 60°"}],"vys":"60°","odp":"60"}]},{"id":"cj-vyjmenovana","predmet":"CJ","tema":"pravopis-iy","nazev":"Vyjmenovaná slova a i/y po obojetných","popis":"Kde psát tvrdé y a kde měkké i. Nejzákladnější pravopisný jev — a v testu bývá schovaný v delším textu.","vyklad":[{"h":"Tři skupiny souhlásek","t":"Po tvrdých souhláskách h, ch, k, r, d, t, n se píše tvrdé y.\nPo měkkých ž, š, č, ř, c, j, ď, ť, ň se píše měkké i.\n\nProblém dělají jen obojetné: b, f, l, m, p, s, v, z.","f":"tvrdé:   h ch k r d t n → y\nměkké:   ž š č ř c j ď ť ň → i\nobojetné: b f l m p s v z → ?"},{"h":"Jak se rozhodnout u obojetných","t":"Po obojetné souhlásce píšeme y jen ve vyjmenovaných slovech a ve slovech, která jsou od nich odvozená.\n\nVe všech ostatních případech se píše i. Když si nejsi jistá, zkus najít příbuzné vyjmenované slovo.","f":"bydlet → bydliště, obydlí (y)\nbít se → bitva (i)"},{"h":"Vyjmenovaná po B a po L","t":"Po B: být, bydlit, obyvatel, byt, příbytek, nábytek, dobytek, obyčej, bystrý, bylina, kobyla, býk, Přibyslav.\n\nPo L: slyšet, mlýn, blýskat se, polykat, plynout, plýtvat, vzlykat, lysý, lýtko, lýko, lyže, pelyněk, plyš.","f":"B: být, bydlit, obyvatel, byt…\nL: slyšet, mlýn, blýskat, polykat…"},{"h":"Vyjmenovaná po M a po P","t":"Po M: my, mýt, myslit, mýlit se, hmyz, myš, hlemýžď, mýtit, zamykat, smýkat, dmýchat, chmýří, nachomýtnout se, Litomyšl.\n\nPo P: pýcha, pytel, pysk, netopýr, slepýš, pyl, kopyto, klopýtat, třpytit se, zpytovat, pykat, pýr, pýřit se, čepýřit se.","f":"M: my, mýt, myslit, hmyz, myš…\nP: pýcha, pytel, netopýr, pyl…"},{"h":"Vyjmenovaná po S, V a Z","t":"Po S: syn, sytý, sýr, syrový, sychravý, usychat, sýkora, sýček, sysel, syčet, sypat.\n\nPo V: vy, vysoký, výt, výskat, zvykat, žvýkat, vydra, výr, vyžle, povyk, výheň, cavyky, klavír.\n\nPo Z: brzy, jazyk, nazývat se, Ruzyně.","f":"S: syn, sytý, sýr, sýkora…\nV: vy, vysoký, vydra, výr…\nZ: brzy, jazyk, nazývat"},{"h":"Dvojice, na kterých to stojí","t":"Některá slova zní stejně, ale znamenají něco jiného a píšou se jinak. Rozhoduje význam.\n\nTohle je přesně to, na co se test ptá — vždycky si přelož, co věta říká.","f":"být (existovat) × bít (tlouct)\nmýt (umývat) × mít (vlastnit)\nvýr (pták) × vír (ve vodě)\nsýra (jídlo) × síra (prvek)"},{"h":"Další zrádné dvojice","t":"Zapamatuj si i tyhle. V testu se objevují pravidelně, protože obě varianty jsou správně — jen v jiné větě.","f":"my (osoby) × mi (mně)\nvy (osoby) × vi- (jinak)\nlýko (stromu) × liko (nic)\nnabýt (získat) × nabít (baterku)"},{"h":"Odvozená slova","t":"Y se drží i ve slovech, která z vyjmenovaného vznikla — i když už vypadají jinak.\n\nProto zkoušej hledat příbuzné slovo. Když najdeš vyjmenované, píšeš y.","f":"myslit → myšlenka, smysl, úmysl\nbýt → bytost, bydliště, nábytek"}],"ulohy":[{"id":"cj-vyjmenovana-654cc463","q":"Doplň i nebo y:\n\nChtěl b__t vždycky první.","typ":"choice","kroky":[{"n":"Krok 1 — přelož si význam","d":"Chtěl EXISTOVAT první? Ne — chtěl BÝT první, tedy existovat v té roli.","f":"význam: existovat"},{"n":"Krok 2 — vyber slovo","d":"Být ve významu existovat je vyjmenované slovo, píše se s y.","f":"být ✓"},{"n":"Pro srovnání","d":"Bít s měkkým i znamená tlouct, mlátit.","f":"chtěl být první"}],"vys":"Chtěl být vždycky první.","moz":["být","bít"],"spr":0},{"id":"cj-vyjmenovana-aa3a4f3b","q":"Doplň i nebo y:\n\nZvon začal b__t poledne.","typ":"choice","kroky":[{"n":"Krok 1 — co zvon dělá","d":"Zvon tluče, udeřuje. To je bít.","f":"význam: tlouct"},{"n":"Krok 2 — vyber","d":"Bít ve významu tlouct se píše s měkkým i.","f":"bít ✓"}],"vys":"Zvon začal bít poledne.","moz":["bít","být"],"spr":0},{"id":"cj-vyjmenovana-b857baa0","q":"Doplň i nebo y:\n\nMusíš si um__t ruce.","typ":"choice","kroky":[{"n":"Krok 1 — co s rukama děláš","d":"Myješ je vodou. To je mýt.","f":"význam: umývat"},{"n":"Krok 2 — mýt je vyjmenované slovo","d":"Píše se s y.","f":"umýt ✓"},{"n":"Pro srovnání","d":"Umět znamená ovládat něco. „Musíš to umět.“","f":"umýt ruce"}],"vys":"Musíš si umýt ruce.","moz":["umýt","umít"],"spr":0},{"id":"cj-vyjmenovana-33fe1f28","q":"Doplň i nebo y:\n\nNa louce poletoval hm__z.","typ":"choice","kroky":[{"n":"Krok 1 — před doplňovaným písmenem je m","d":"M je obojetná souhláska, takže musíme sáhnout k vyjmenovaným slovům.","f":"obojetné m"},{"n":"Krok 2 — je hmyz mezi vyjmenovanými po M?","d":"Ano: my, mýt, myslit, mýlit se, HMYZ, myš, hlemýžď…","f":"hmyz ✓"}],"vys":"Na louce poletoval hmyz.","moz":["hmyz","hmiz"],"spr":0},{"id":"cj-vyjmenovana-71d5e358","q":"Doplň i nebo y:\n\nV lese jsme viděli v__ra velkého.","typ":"choice","kroky":[{"n":"Krok 1 — o čem je řeč","d":"Výr velký je sova, tedy pták.","f":"význam: pták"},{"n":"Krok 2 — výr je vyjmenované po V","d":"Píše se s y.","f":"výr ✓"},{"n":"Pro srovnání","d":"Vír s měkkým i je točící se voda. Víra je přesvědčení.","f":"viděli výra"}],"vys":"V lese jsme viděli výra velkého.","moz":["výra","víra"],"spr":0},{"id":"cj-vyjmenovana-9c4cf89b","q":"Doplň i nebo y:\n\nNa talíři byl kus s__ra.","typ":"choice","kroky":[{"n":"Krok 1 — co je na talíři","d":"Na talíři bývá jídlo — sýr.","f":"význam: potravina"},{"n":"Krok 2 — sýr je vyjmenované po S","d":"","f":"sýra ✓"},{"n":"Pro srovnání","d":"Síra s měkkým i je chemický prvek e","t":"Příslovce určuje okolnost děje. Ptáš se KDE, KDY, JAK, PROČ.\n\nČasto se plete s přídavným jménem. Rozdíl: přídavné jméno patří ke jménu, příslovce ke slovesu.","f":"rychle běží (jak? příslovce)\nrychlý běh (jaký? přídavné)"},{"h":"Předložky a spojky","t":"Předložka stojí před jménem a určuje jeho pád — na stole, do školy, s bratrem.\n\nSpojka spojuje slova nebo věty — a, ale, protože, když, že.","f":"předložky: v, na, do, pod, s, z\nspojky: a, i, ale, nebo, že, když"},{"h":"Částice a citoslovce","t":"Částice uvozuje větu nebo vyjadřuje postoj — ať, kéž, snad, asi, prý.\n\nCitoslovce napodobuje zvuk nebo vyjadřuje cit — bum, haf, ach, jé.","f":"částice: ať, kéž, snad, asi, prý\ncitoslovce: bum, haf, au, ach"},{"h":"Pozor na slova, která mění druh","t":"Stejné slovo může být podle věty různým slovním druhem. Vždycky se rozhoduj podle konkrétní věty, ne podle slova samotného.","f":"kolem domu (předložka)\nchodil kolem (příslovce)\njedna kniha (číslovka)\njedna z možností (zájmeno)"}],"ulohy":[{"id":"cj-slovnidruhy-364445d6","q":"Určete slovní druh slova RYCHLE ve větě:\n\nAuto jelo rychle.","typ":"choice","kroky":[{"n":"Krok 1 — na co se ptáš","d":"Jelo JAK? Rychle. Ptáš se na okolnost děje.","f":"jak? → příslovce"},{"n":"Krok 2 — ke kterému slovu patří","d":"Patří ke slovesu jelo, ne k podstatnému jménu. To potvrzuje příslovce.","f":"příslovce ✓"},{"n":"Pro srovnání","d":"„Rychlé auto“ — tam je rychlé přídavné jméno, protože patří k autu.","f":"rychle = příslovce"}],"vys":"Příslovce","moz":["příslovce","přídavné jméno","podstatné jméno","sloveso"],"spr":0},{"id":"cj-slovnidruhy-8a25ef2a","q":"Určete slovní druh slova PĚT ve větě:\n\nKoupili jsme pět rohlíků.","typ":"choice","kroky":[{"n":"Krok 1 — na co se ptáš","d":"Koupili KOLIK rohlíků? Pět.","f":"kolik? → číslovka"},{"n":"Krok 2 — potvrzení","d":"Vyjadřuje počet, tedy číslovka základní.","f":"číslovka ✓"}],"vys":"Číslovka","moz":["číslovka","podstatné jméno","zájmeno","příslovce"],"spr":0},{"id":"cj-slovnidruhy-26bccf42","q":"Určete slovní druh slova POD ve větě:\n\nKočka spí pod stolem.","typ":"choice","kroky":[{"n":"Krok 1 — kde slovo stojí","d":"Stojí před podstatným jménem stolem a určuje jeho pád.","f":"pod stolem (7. pád)"},{"n":"Krok 2 — to je znak předložky","d":"Předložka se sama o sobě nedá použít, vždy patří ke jménu.","f":"předložka ✓"}],"vys":"Předložka","moz":["předložka","příslovce","spojka","částice"],"spr":0},{"id":"cj-slovnidruhy-af0dec52","q":"Určete slovní druh slova ALE ve větě:\n\nChtěl přijít, ale nestihl to.","typ":"choice","kroky":[{"n":"Krok 1 — co slovo dělá","d":"Spojuje dvě věty do souvětí.","f":"spojuje věty"},{"n":"Krok 2 — to je spojka","d":"Konkrétně spojka odporovací — druhá věta popírá očekávání z první.","f":"spojka ✓"}],"vys":"Spojka","moz":["spojka","částice","citoslovce","příslovce"],"spr":0},{"id":"cj-slovnidruhy-a799219b","q":"Určete slovní druh slova KTERÝ ve větě:\n\nKniha, kterou jsem četl, byla dlouhá.","typ":"choice","kroky":[{"n":"Krok 1 — co slovo zastupuje","d":"Zastupuje podstatné jméno kniha, aby se neopakovalo.","f":"zastupuje jméno"},{"n":"Krok 2 — to je zájmeno","d":"Konkrétně zájmeno vztažné — připojuje vedlejší větu.","f":"zájmeno ✓"},{"n":"Pozor","d":"Přestože se ptáme „která kniha“, není to přídavné jméno — nepopisuje vlastnost, jen odkazuje.","f":"zájmeno vztažné"}],"vys":"Zájmeno","moz":["zájmeno","přídavné jméno","spojka","částice"],"spr":0},{"id":"cj-slovnidruhy-89c2b37e","q":"Určete slovní druh slova AŤ ve větě:\n\nAť už konečně přijde!","typ":"choice","kroky":[{"n":"Krok 1 — co slovo dělá","d":"Nic nespojuje, jen uvozuje větu a vyjadřuje přání mluvčího.","f":"vyjadřuje přání"},{"n":"Krok 2 — to je částice","d":"Částice uvozují věty a vyjadřují postoj — ať, kéž, nechť, snad.","f":"částice ✓"},{"n":"Pozor na dvojí roli","d":"Ve větě „Řekl, ať přijde“ je ať naopak spojka — připojuje vedlejší větu.","f":"tady částice"}],"vys":"Částice","moz":["částice","spojka","citoslovce","příslovce"],"spr":0},{"id":"cj-slovnidruhy-bf840e80","q":"Kolik slovních druhů rozlišujeme v češtině?","typ":"open","kroky":[{"n":"Krok 1 — vyjmenuj je","d":"Podstatná jména, přídavná jména, zájmena, číslovky, slovesa, příslovce, předložky, spojky, částice, citoslovce.","f":"1–10"},{"n":"Krok 2 — spočítej","d":"Prvních pět se ohýbá, zbylých pět ne.","f":"10 slovních druhů"}],"vys":"10","odp":"10"},{"id":"cj-slovnidruhy-ead8eead","q":"Určete slovní druh slova KOLEM ve větě:\n\nProšel kolem domu.","typ":"choice","kroky":[{"n":"Krok 1 — stojí před jménem?","d":"Ano — kolem DOMU. Určuje pád podstatného jména.","f":"kolem domu (2. pád)"},{"n":"Krok 2 — to je předložka","d":"","f":"předložka ✓"},{"n":"Pozor na druhý význam","d":"Ve větě „Prošel kolem“ (bez jména za tím) je kolem příslovce místa.","f":"tady předložka"}],"vys":"Předložka","moz":["předložka","příslovce","podstatné jméno","spojka"],"spr":0},{"id":"cj-slovnidruhy-86185690","q":"Které slovo ve větě je sloveso?\n\nMalý chlapec rychle přeběhl ulici.","typ":"choice","kroky":[{"n":"Krok 1 — hledej děj","d":"Co chlapec dělal? Přeběhl.","f":"co dělal? → sloveso"},{"n":"Krok 2 — projdi ostatní","d":"Malý je přídavné jméno, rychle příslovce, ulici podstatné jméno.","f":"přeběhl ✓"}],"vys":"přeběhl","moz":["přeběhl","malý","rychle","ulici"],"spr":0},{"id":"cj-slovnidruhy-fa5330a9","q":"Určete slovní druh slova DVAKRÁT.","typ":"choice","kroky":[{"n":"Krok 1 — na co se ptáš","d":"Kolikrát? Dvakrát.","f":"kolikrát? → číslovka"},{"n":"Krok 2 — jaký druh číslovky","d":"Je to číslovka násobná. Vyjadřuje, kolikrát se něco stalo.","f":"číslovka násobná ✓"},{"n":"Proč ne příslovce","d":"Vypadá jako příslovce, ale odpovídá na otázku po počtu, což je znak číslovky.","f":"číslovka"}],"vys":"Číslovka (násobná)","moz":["číslovka","příslovce","zájmeno","částice"],"spr":0}]},{"id":"cj-tvaroslovi","predmet":"CJ","tema":"slovni-druhy","nazev":"Tvarosloví — pády, vzory a slovesa","popis":"Sedm pádů, vzory podstatných jmen, osoba a čas u sloves. Testové otázky bývají přesně na tohle.","vyklad":[{"h":"Sedm pádů a jejich otázky","t":"1. kdo, co · 2. koho, čeho · 3. komu, čemu · 4. koho, co · 5. oslovujeme, voláme · 6. o kom, o čem · 7. s kým, s čím\n\nOtázky se vyplatí umět odříkat. Bez nich pád neurčíš.","f":"1. kdo, co\n2. koho, čeho\n3. komu, čemu\n4. koho, co\n5. oslovení\n6. o kom, o čem\n7. s kým, s čím"},{"h":"Jak pád určit","t":"Najdi si slovo ve větě a polož si na něj otázku. Ta otázka ti pád prozradí.\n\nPozor na 2. a 4. pád — u neživotných se tvary často shodují. Pomůže dosadit životné slovo.","f":"Vidím psa. → koho vidím? → 4. pád\nBojím se psa. → koho se bojím? → 2. pád"},{"h":"Rod a vzory podstatných jmen","t":"Rod mužský životný: pán, muž, předseda, soudce.\nRod mužský neživotný: hrad, stroj.\nRod ženský: žena, růže, píseň, kost.\nRod střední: město, moře, kuře, stavení.","f":"M živ: pán, muž, předseda, soudce\nM neživ: hrad, stroj\nŽ: žena, růže, píseň, kost\nS: město, moře, kuře, stavení"},{"h":"Jak najít vzor","t":"Dej slovo do 1. pádu jednotného čísla, urči rod a pak porovnej koncovku ve 2. pádu.\n\nPráve 2. pád rozliší podobné vzory nejlépe.","f":"kost — 2. pád kosti\npíseň — 2. pád písně"},{"h":"Osoba, číslo a čas u sloves","t":"Osoby jsou tři a každá má jednotné i množné číslo.\n\nČasy jsou minulý, přítomný a budoucí. U dokonavých sloves přítomný čas neexistuje.","f":"1. os. já píšu / my píšeme\n2. os. ty píšeš / vy píšete\n3. os. on píše / oni píšou"},{"h":"Slovesný způsob","t":"Oznamovací říká, co se děje. Rozkazovací přikazuje. Podmiňovací vyjadřuje podmínku nebo přání a poznáš ho podle by.","f":"oznamovací: přijde\nrozkazovací: přijď\npodmiňovací: přišel by"},{"h":"Vid dokonavý a nedokonavý","t":"Dokonavé sloveso vyjadřuje děj ukončený a nemá přítomný čas — napsal, napíšu (to je budoucnost).\n\nNedokonavé vyjadřuje děj probíhající — psal, píšu, budu psát.","f":"psát (nedok.) → píšu, budu psát\nnapsat (dok.) → napíšu (budoucí!)"},{"h":"Nejčastější past v testu","t":"Otázka „v jakém čase je sloveso napíšu“ svádí odpovědět přítomný. Je ale budoucí, protože sloveso je dokonavé.\n\nZkus si to: „Napíšu to zítra“ — dneska to ještě není hotové.","f":"napíšu = čas BUDOUCÍ"}],"ulohy":[{"id":"cj-tvaroslovi-61cfa914","q":"Urči pád podtrženého slova:\n\nDal jsem to KAMARÁDOVI.","typ":"choice","kroky":[{"n":"Krok 1 — polož otázku","d":"Dal jsem to komu? Kamarádovi.","f":"komu? čemu?"},{"n":"Krok 2 — najdi pád k otázce","d":"Komu, čemu je 3. pád.","f":"3. pád ✓"}],"vys":"3. pád","moz":["3. pád","2. pád","4. pád","6. pád"],"spr":0},{"id":"cj-tvaroslovi-90476739","q":"Urči pád podtrženého slova:\n\nBojím se TMY.","typ":"choice","kroky":[{"n":"Krok 1 — polož otázku","d":"Bojím se koho, čeho? Tmy.","f":"koho? čeho?"},{"n":"Krok 2 — pád","d":"Koho, čeho je 2. pád.","f":"2. pád ✓"},{"n":"Pomůcka","d":"Sloveso bát se se vždycky pojí s 2. pádem.","f":"2. pád"}],"vys":"2. pád","moz":["2. pád","4. pád","3. pád","7. pád"],"spr":0},{"id":"cj-tvaroslovi-b7df9ae4","q":"Urči pád podtrženého slova:\n\nMluvili jsme o VÝLETĚ.","typ":"choice","kroky":[{"n":"Krok 1 — polož otázku","d":"Mluvili jsme o kom, o čem? O výletě.","f":"o kom? o čem?"},{"n":"Krok 2 — pád","d":"To je 6. pád. Poznáš ho i podle toho, že se vždy pojí s předložkou.","f":"6. pád ✓"}],"vys":"6. pád","moz":["6. pád","2. pád","3. pád","7. pád"],"spr":0},{"id":"cj-tvaroslovi-339f9425","q":"Podle kterého vzoru se skloňuje slovo KOST?","typ":"choice","kroky":[{"n":"Krok 1 — urči rod","d":"Ta kost — rod ženský.","f":"rod ženský"},{"n":"Krok 2 — porovnej 2. pád","d":"Bez kosti. Vzor kost má ve 2. pádě koncovku -i.","f":"kosti → vzor kost ✓"},{"n":"Pro srovnání","d":"Vzor píseň má ve 2. pádě písně, tedy -e. To je rozlišovací znak.","f":"kost"}],"vys":"Vzor kost","moz":["kost","píseň","žena","růže"],"spr":0},{"id":"cj-tvaroslovi-33c8197d","q":"Podle kterého vzoru se skloňuje slovo MOŘE?","typ":"choice","kroky":[{"n":"Krok 1 — urči rod","d":"To moře — rod střední.","f":"rod střední"},{"n":"Krok 2 — vzory středního rodu","d":"Město, moře, kuře, stavení. Slovo moře je samo vzorem.","f":"vzor moře ✓"}],"vys":"Vzor moře","moz":["moře","město","kuře","stavení"],"spr":0},{"id":"cj-tvaroslovi-76b332f2","q":"V jaké osobě a čísle je sloveso ve větě:\n\nPůjdeme do kina.","typ":"choice","kroky":[{"n":"Krok 1 — kdo to dělá","d":"Kdo půjde? My. To je 1. osoba.","f":"my → 1. osoba"},{"n":"Krok 2 — kolik jich je","d":"My znamená víc lidí, tedy množné číslo.","f":"1. osoba, množné číslo ✓"}],"vys":"1. osoba, množné číslo","moz":["1. osoba, množné číslo","1. osoba, jednotné číslo","3. osoba, množné číslo","2. osoba, množné číslo"],"spr":0},{"id":"cj-tvaroslovi-dcfa7527","q":"V jakém čase je sloveso NAPÍŠU?","typ":"choice","kroky":[{"n":"Krok 1 — je sloveso dokonavé?","d":"Napsat vyjadřuje ukončený děj, je tedy dokonavé.","f":"dokonavé sloveso"},{"n":"Krok 2 — co to znamená pro čas","d":"Dokonavá slovesa nemají přítomný čas. Tvar, který vypadá jako přítomný, je ve skutečnosti budoucí.","f":"napíšu = budoucí ✓"},{"n":"Ověř si to větou","d":"„Napíšu to zítra.“ Zítra je budoucnost. Sedí.","f":"čas budoucí"}],"vys":"Čas budoucí","moz":["budoucí","přítomný","minulý","podmiňovací"],"spr":0},{"id":"cj-tvaroslovi-8c19b3c6","q":"Ve kterém slovesném způsobu je tvar PŘIŠEL BY?","typ":"choice","kroky":[{"n":"Krok 1 — najdi poznávací znak","d":"Ve tvaru je slůvko by. To je jasná známka podmiňovacího způsobu.","f":"by → podmiňovací"},{"n":"Krok 2 — co to znamená","d":"Vyjadřuje děj, který by nastal za nějaké podmínky. „Přišel by, kdyby měl čas.“","f":"podmiňovací ✓"}],"vys":"Podmiňovací způsob","moz":["podmiňovací","oznamovací","rozkazovací","trpný"],"spr":0},{"id":"cj-tvaroslovi-45c1539f","q":"Urči pád: \n\nS BRATREM jsme šli na výlet.","typ":"choice","kroky":[{"n":"Krok 1 — polož otázku","d":"Šli jsme s kým, s čím? S bratrem.","f":"s kým? s čím?"},{"n":"Krok 2 — pád","d":"To je 7. pád. Předložka s se s ním pojí vždycky.","f":"7. pád ✓"}],"vys":"7. pád","moz":["7. pád","4. pád","6. pád","2. pád"],"spr":0},{"id":"cj-tvaroslovi-e109be12","q":"Podle kterého vzoru se skloňuje slovo PŘEDSEDA?","typ":"choice","kroky":[{"n":"Krok 1 — urči rod","d":"Ten předseda — mužský rod životný. Přestože slovo končí na -a jako ženská jména.","f":"mužský životný"},{"n":"Krok 2 — vzory mužského životného","d":"Pán, muž, předseda, soudce. Slovo předseda je samo vzorem pro jména zakončená na -a.","f":"vzor předseda ✓"},{"n":"Podobná slova","d":"Také starosta, kolega, husita — všechna podle vzoru předseda.","f":"předseda"}],"vys":"Vzor předseda","moz":["předseda","pán","muž","soudce"],"spr":0}]},{"id":"cj-skladba","predmet":"CJ","tema":"vetne-cleny","nazev":"Větné členy a skladba","popis":"Podmět, přísudek, předmět, přívlastek a příslovečné určení. Základní stavba věty.","vyklad":[{"h":"Základní skladební dvojice","t":"Každá věta stojí na dvojici podmět a přísudek. To je její kostra.\n\nPodmět říká, KDO nebo CO. Přísudek říká, CO DĚLÁ nebo JAKÝ JE.","f":"Pes | štěká.\npodmět | přísudek"},{"h":"Podmět a jeho druhy","t":"Vyjádřený podmět je ve větě napsaný. Nevyjádřený se pozná z tvaru slovesa.\n\nNěkolikanásobný podmět má víc částí spojených spojkou.","f":"Petr přišel. (vyjádřený)\nPřišel pozdě. (nevyjádřený — on)\nPetr a Jana přišli. (několikanásobný)"},{"h":"Přísudek slovesný a jmenný","t":"Slovesný přísudek je tvořený jen slovesem — běží, spal, bude psát.\n\nJmenný se sponou je spojení slovesa být, bývat, stát se a jména — je hodný, stal se lékařem.","f":"Chlapec běží. (slovesný)\nChlapec je hodný. (jmenný se sponou)"},{"h":"Předmět","t":"Předmět doplňuje sloveso. Ptáš se na něj pádovými otázkami kromě 1. a 5. pádu.\n\nČasto je to ten, na koho děj směřuje.","f":"Čtu knihu. (co čtu?)\nPomohl bratrovi. (komu?)"},{"h":"Přívlastek","t":"Přívlastek rozvíjí podstatné jméno. Ptáš se JAKÝ, KTERÝ, ČÍ.\n\nShodný stojí většinou před jménem a shoduje se s ním v pádě. Neshodný stojí za ním a neshoduje se.","f":"nový dům (shodný)\ndům mého otce (neshodný)"},{"h":"Příslovečné určení","t":"Rozvíjí sloveso a určuje okolnost. Ptáš se KDE, KDY, JAK, PROČ.\n\nPodle otázky rozlišujeme určení místa, času, způsobu a příčiny.","f":"Šel domů. (kam? místa)\nPřišel včera. (kdy? času)\nBěžel rychle. (jak? způsobu)"},{"h":"Jak rozebírat větu","t":"Postupuj vždy stejně. Najdi přísudek — je to nejjistější orientační bod, protože je v každé větě.\n\nPak se na něj zeptej KDO nebo CO a máš podmět. Ostatní členy dohledáš otázkami.","f":"1. přísudek (co se děje)\n2. podmět (kdo/co)\n3. ostatní členy otázkami"},{"h":"Nejčastější past","t":"Podmět nemusí stát na začátku věty a nemusí být hned u slovesa.\n\nProto se vždycky ptej, ne hádej podle pořadí slov.","f":"Na zahradě si děti hrály.\npodmět = děti, ne zahrada"}],"ulohy":[{"id":"cj-skladba-3ec1b169","q":"Urči podmět ve větě:\n\nNa louce kvetly bílé sedmikrásky.","typ":"choice","kroky":[{"n":"Krok 1 — najdi přísudek","d":"Co se ve větě děje? Kvetly.","f":"přísudek: kvetly"},{"n":"Krok 2 — zeptej se kdo, co","d":"Co kvetlo? Sedmikrásky.","f":"podmět: sedmikrásky ✓"},{"n":"Krok 3 — proč ne louce","d":"Louka nekvetla, jen říká kde. To je příslovečné určení místa.","f":"sedmikrásky"}],"vys":"sedmikrásky","moz":["sedmikrásky","louce","bílé","kvetly"],"spr":0},{"id":"cj-skladba-c3c97913","q":"Urči přísudek ve větě:\n\nStarší bratr mi včera pomohl s úkolem.","typ":"choice","kroky":[{"n":"Krok 1 — hledej děj","d":"Co se ve větě děje? Pomohl.","f":"pomohl"},{"n":"Krok 2 — potvrzení","d":"Je to sloveso v určitém tvaru, tedy přísudek slovesný.","f":"přísudek slovesný ✓"}],"vys":"pomohl","moz":["pomohl","bratr","včera","s úkolem"],"spr":0},{"id":"cj-skladba-d3cabc32","q":"Jaký přísudek je ve větě:\n\nMůj dědeček byl učitel.","typ":"choice","kroky":[{"n":"Krok 1 — najdi sloveso","d":"Slovesem je byl, tvar slovesa být.","f":"byl"},{"n":"Krok 2 — co následuje","d":"Za slovesem stojí podstatné jméno učitel, které o dědečkovi něco vypovídá.","f":"byl + učitel"},{"n":"Krok 3 — to je jmenný se sponou","d":"Spona je tvar slovesa být, jmenná část je učitel.","f":"jmenný se sponou ✓"}],"vys":"Přísudek jmenný se sponou","moz":["jmenný se sponou","slovesný","slovesně jmenný bez spony","žádný"],"spr":0},{"id":"cj-skladba-630601e0","q":"Urči předmět ve větě:\n\nDěti kreslily obrázek.","typ":"choice","kroky":[{"n":"Krok 1 — přísudek a podmět","d":"Kreslily je přísudek, děti je podmět.","f":"děti | kreslily"},{"n":"Krok 2 — polož pádovou otázku","d":"Kreslily co? Obrázek. To je 4. pád.","f":"co? → obrázek"},{"n":"Krok 3 — to je předmět","d":"Doplňuje sloveso, děj na něj směřuje.","f":"předmět: obrázek ✓"}],"vys":"obrázek","moz":["obrázek","děti","kreslily","žádný"],"spr":0},{"id":"cj-skladba-817e070d","q":"Urči příslovečné určení a jeho druh:\n\nZítra pojedeme na výlet.","typ":"choice","kroky":[{"n":"Krok 1 — najdi přísudek","d":"Pojedeme.","f":"přísudek: pojedeme"},{"n":"Krok 2 — polož otázku kdy","d":"Pojedeme kdy? Zítra.","f":"kdy? → zítra"},{"n":"Krok 3 — druh určení","d":"Otázka kdy znamená příslovečné určení času.","f":"určení času ✓"},{"n":"Pozor","d":"„Na výlet“ odpovídá na otázku kam, to by bylo určení místa.","f":"zítra = čas"}],"vys":"zítra — příslovečné určení času","moz":["zítra — určení času","na výlet — určení času","zítra — určení místa","pojedeme — určení způsobu"],"spr":0},{"id":"cj-skladba-dfb8b5f2","q":"Urči přívlastek ve větě:\n\nStará lípa stínila celý dvůr.","typ":"choice","kroky":[{"n":"Krok 1 — najdi podstatné jméno, které se rozvíjí","d":"Lípa. A jaká lípa? Stará.","f":"jaká? → stará"},{"n":"Krok 2 — to je přívlastek","d":"Stojí před jménem a shoduje se s ním v rodě, čísle i pádě.","f":"přívlastek shodný ✓"}],"vys":"stará — přívlastek shodný","moz":["stará","lípa","stínila","dvůr"],"spr":0},{"id":"cj-skladba-031f45a2","q":"Který přívlastek je neshodný?","typ":"choice","kroky":[{"n":"Krok 1 — kde přívlastek stojí","d":"U neshodného stojí přívlastek AŽ ZA podstatným jménem.","f":"dům mého otce"},{"n":"Krok 2 — shoduje se v pádě?","d":"Dům je 1. pád, ale otce je 2. pád. Neshodují se, proto neshodný.","f":"neshodný ✓"},{"n":"Pro srovnání","d":"Nový dům — obojí 1. pád, tedy shodný přívlastek.","f":"dům mého otce"}],"vys":"dům mého otce","moz":["dům mého otce","nový dům","velký dům","dřevěný dům"],"spr":0},{"id":"cj-skladba-ed92125e","q":"Kolik větných členů tvoří základní skladební dvojici?","typ":"open","kroky":[{"n":"Krok 1 — které to jsou","d":"Podmět a přísudek.","f":"podmět + přísudek"},{"n":"Krok 2 — spočítej","d":"Jsou to dva a tvoří kostru každé věty.","f":"2"}],"vys":"2 (podmět a přísudek)","odp":"2"},{"id":"cj-skladba-2b106ab8","q":"Urči podmět ve větě:\n\nBylo nám veselo.","typ":"choice","kroky":[{"n":"Krok 1 — zkus se zeptat kdo, co","d":"Kdo nebo co bylo? Odpověď ve větě není a ani se nedá doplnit.","f":"nelze najít podmět"},{"n":"Krok 2 — to je bezpodmětá věta","d":"Některé věty popisují stav nebo přírodní děj a podmět prostě nemají.","f":"bezpodmětá ✓"},{"n":"Další příklady","d":"Prší. Sněží. Bolí mě hlava. Setmělo se.","f":"věta bezpodmětá"}],"vys":"Věta je bezpodmětá","moz":["věta je bezpodmětá","nám","veselo","bylo"],"spr":0},{"id":"cj-skladba-ed22f7c2","q":"Urči podmět ve větě:\n\nPo obědě si šli odpočinout.","typ":"choice","kroky":[{"n":"Krok 1 — hledej podmět ve větě","d":"Žádné podstatné jméno v 1. pádě tam není.","f":"nikdo není napsaný"},{"n":"Krok 2 — pomůže tvar slovesa","d":"Šli — koncovka ukazuje na 3. osobu množného čísla, tedy oni.","f":"šli → oni"},{"n":"Krok 3 — závěr","d":"Podmět je nevyjádřený. Pozor, to není totéž jako bezpodmětá věta — tady podmět existuje, jen není napsaný.","f":"nevyjádřený (oni) ✓"}],"vys":"Nevyjádřený podmět (oni)","moz":["nevyjádřený (oni)","obědě","šli","odpočinout"],"spr":0}]},{"id":"cj-carky","predmet":"CJ","tema":"souveti","nazev":"Souvětí a čárky","popis":"Kdy se píše čárka a kdy ne. Věta hlavní a vedlejší, spojky, oslovení a vsuvky.","vyklad":[{"h":"Věta jednoduchá a souvětí","t":"Věta jednoduchá má jeden přísudek. Souvětí má přísudků víc — tolik vět, kolik je sloves v určitém tvaru.\n\nPočet přísudků je nejjistější způsob, jak větu od souvětí odlišit.","f":"Petr čte knihu. (1 přísudek)\nPetr čte, když má čas. (2 přísudky)"},{"h":"Základní pravidlo","t":"Mezi větami v souvětí se zpravidla píše čárka.\n\nVýjimka je, když jsou věty spojené spojkami a, i, ani, nebo, či ve významu prostého slučování.","f":"Přišel a posadil se. (bez čárky)\nPřišel, ale nezůstal. (s čárkou)"},{"h":"Před kterými spojkami se čárka píše vždy","t":"Ale, avšak, však, nýbrž, protože, poněvadž, jelikož, aby, že, když, kdyby, přestože, ačkoli, jestliže.\n\nTyhle spojky uvozují vedlejší větu nebo odporují — čárka před nimi patří.","f":"ale, však, protože, aby,\nže, když, přestože, ačkoli"},{"h":"Kdy se před A čárka přece píše","t":"Spojka a obvykle čárku nemá. Ale je-li ve významu odporovacím nebo následuje-li po ní jiná spojka, čárka tam patří.","f":"Chtěl přijít, a nepřišel. (odporovací)\nŘekl, že přijde, a že se těší.\nPršelo, a proto jsme zůstali doma."},{"h":"Vedlejší věta uvnitř","t":"Je-li vedlejší věta vložená doprostřed, odděluje se čárkami z OBOU stran.\n\nZapomenutá druhá čárka je jedna z nejčastějších chyb vůbec.","f":"Kniha, kterou jsem četl, byla dlouhá.\n         ↑ obě čárky ↑"},{"h":"Oslovení a citoslovce","t":"Oslovení se vždycky odděluje čárkou. Stojí-li uprostřed věty, čárkami z obou stran.\n\nStejně tak citoslovce.","f":"Petře, pojď sem.\nPojď sem, Petře.\nUž, Petře, běž."},{"h":"Vsuvka a přístavek","t":"Vsuvka je poznámka vložená do věty. Odděluje se čárkami z obou stran.\n\nPřístavek je jiné pojmenování téhož a odděluje se také.","f":"Zítra, myslím, bude pršet.\nKarel IV., český král, založil univerzitu."},{"h":"Několikanásobné větné členy","t":"Ve výčtu se čárky píší mezi jednotlivými položkami — kromě té, před kterou je spojka a, i, nebo.","f":"Koupil chleba, máslo, sýr a mléko.\n(před posledním a je čárka zbytečná)"}],"ulohy":[{"id":"cj-carky-1c2bc3d3","q":"Kolik vět je v souvětí?\n\nKdyž přišel domů, uvařil si čaj a sedl si k oknu.","typ":"open","kroky":[{"n":"Krok 1 — hledej slovesa v určitém tva
